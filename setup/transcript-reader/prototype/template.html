<!doctype html>
<!--
  THROWAWAY PROTOTYPE for the design checkpoint in setup/transcript-reader/DESIGN.md.
  build_prototype.py fills the payload slot below with private transcript text, so the built
  page lives in the gitignored out/ folder. No remote requests or fonts; served by the
  reader's own server (setup/transcript-reader/serve.sh), it calls only that local server
  (live.js) to refresh, follow Herdr's focus and send a reply to a pane.
  The hosted copy's shell (sync.py --build-only) is this page with no payload: it loads its
  own folder's index.json, then one conversation or document at a time (hosted.js), and only reads.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src '__SCRIPT_HASH__'; connect-src 'self'; __CSP_HOSTED__frame-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="reader-token" content="__READER_TOKEN__">
__HEAD_HOSTED__
<meta name="template" content="__TEMPLATE_HASH__">
<title>Transcript reader (prototype)</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1d2433; --muted: #5d6779; --faint: #8b93a3; --line: #dfe3ea; --paper: #ffffff; --wash: #f4f5f8;
    --you: #1f5fd1; --you-wash: #e9f0fd; --mate: #6b3fc4; --mate-wash: #f1ecfb;
    --ask: #8a5a00; --ask-wash: #fff3d6; --ask-line: #f0c45c; --ok: #2f6b45; --ok-wash: #e8f3ec;
    --open: #b4232d; --code: #f1f3f6; --dim: #657083;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --cue: rgb(0 0 0 / .2);
    /* One width for the header, the conversation and the message bar: --col (the Documents view widens it to --col-doc). --rail is the room
       a side menu will take beside that column (DESIGN.md, task tags): the column and the bar are centred in what is left of it. */
    --col: 44rem; --col-doc: 76rem; --rail: 0px;
    /* The longest a line of prose runs (about 75 characters); tables and code keep the whole column. */
    --measure: 35rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e7e9ee; --muted: #a3aab8; --faint: #7b8394; --line: #343a46; --paper: #1b1f27; --wash: #12151b;
      --you: #8db4ff; --you-wash: #1d2a44; --mate: #c3a6ff; --mate-wash: #2a2340;
      --ask: #ffd27a; --ask-wash: #3a2f15; --ask-line: #a3802e; --ok: #8fd3a8; --ok-wash: #1b3024;
      --open: #ff8a8a; --code: #252a34; --dim: #8f97a8; --cue: rgb(0 0 0 / .55);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.5 var(--sans); }
  body { padding-right: var(--rail); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--you); overflow-wrap: anywhere; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: var(--col); margin: 0 auto; padding: 8px 12px; }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .to-sheet { margin-left: auto; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  /* Folded to one line, the tabs and the answer sheet link are icons of one size: Conversation (on the other views), Documents
     (lit on the Documents view) and the answer sheet. Unfolded, the tabs and the text link are there instead. Each icon's tap area reaches past its box. */
  .view-btn, .to-sheet .sheet-ico { display: none; }
  .view-btn { position: relative; flex: none; width: 30px; height: 28px; padding: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; color: var(--muted); place-items: center; }
  .bar.collapsed .view-btn:not([hidden]) { display: grid; }
  .bar.collapsed .to-sheet { position: relative; flex: none; width: 30px; height: 28px; margin-left: 0; display: grid; place-items: center; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; color: var(--muted); }
  .bar.collapsed .to-sheet .txt { display: none; }
  .bar.collapsed .to-sheet .sheet-ico { display: block; }
  .bar.collapsed .view-btn::after, .bar.collapsed .to-sheet::after { content: ""; position: absolute; inset: -8px -3px; }
  .view-btn:focus-visible, .to-sheet:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .locked .view-btn { display: none !important; }
  .bar-toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 30px; height: 28px; padding: 0; color: var(--muted); flex: none; display: grid; place-items: center; }
  /* A chevron drawn with borders: up while the controls show, down once they are hidden. */
  .bar-toggle::before { content: ""; width: 7px; height: 7px; border: solid currentColor; border-width: 2px 0 0 2px; transform: translateY(2px) rotate(45deg); }
  .bar.collapsed .bar-toggle::before { transform: translateY(-2px) rotate(225deg); }
  /* Follow Herdr, kept in reach when the header is folded to one line (the same switch as the one in the controls). */
  .follow-quick { display: none; flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; height: 28px; padding: 0 9px; font-size: 13px; color: var(--muted); }
  .bar.collapsed .follow-quick:not([hidden]) { display: block; }
  .follow-quick:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .crumb { display: none; flex: 1 1 auto; min-width: 0; border: 0; background: none; padding: 0; text-align: left; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { white-space: nowrap; }
  /* At phone width the title row also holds the status badge, the search button and the chevron: the link keeps its whole name ("Answer sheet", never a short form),
     loses its arrow, and the title gives way (cut with an ellipsis) when a long badge such as "hosted · read-only" needs the room. */
  @media (max-width: 440px) { .to-sheet .go { display: none; } .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; } }
  .bar.collapsed .name, .bar.collapsed .proto, .bar.collapsed #bar-more { display: none; }
  /* The tab title already says prototype; at phone width the badge would push the title onto two lines. */
  @media (max-width: 440px) { .proto { display: none; } }
  .bar.collapsed .crumb { display: block; }
  /* Collapsed on a conversation, the one line is a session picker instead of a plain name; on the Documents view it is a document picker. */
  .crumb-session, .crumb-doc { display: none; flex: 1 1 auto; min-width: 0; max-width: 100%; height: 28px; font: inherit; font-size: 14px; font-weight: 600; padding: 2px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-overflow: ellipsis; }
  .bar.collapsed.pick .crumb { display: none; }
  .bar.collapsed.pick .crumb-session, .bar.collapsed.docpick .crumb-doc { display: block; }
  /* The star beside a session picker: outline when the session on screen is not starred, filled when it is. */
  .star-btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 30px; height: 28px; padding: 0; color: var(--muted); flex: none; display: none; place-items: center; }
  .star-btn svg { fill: none; }
  .star-btn[aria-pressed="true"] svg { fill: currentColor; }
  .star-btn:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .bar.collapsed.pick .crumb-star:not([hidden]), .pick-row .star-btn:not([hidden]) { display: grid; }
  /* In the folded title row the picker needs every pixel: the star is narrower there and sits close to it. */
  .crumb-star { width: 26px; margin-left: -4px; }
  .proto { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--open); border: 1px solid currentColor; border-radius: 99px; padding: 1px 6px; }
  /* A Watch column of 4 (about 330 px) cannot hold Conversation, Documents, Tasks and All tasks on one line: the row wraps rather than cut All tasks off or scroll sideways. */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tab { flex: 1 1 auto; white-space: nowrap; border: 1px solid var(--line); background: var(--wash); border-radius: 8px; padding: 5px 8px; font-size: 14px; }
  .tab[aria-selected="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); font-weight: 600; }
  /* The tabs' own list sits inside the row without a box of its own, so the Tasks link (a link to another page, not a view) can share the row without being a tab. */
  .tablist { display: contents; }
  .tab-link:not([hidden]) { display: flex; align-items: center; justify-content: center; color: inherit; text-decoration: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .pick-row { flex: 1 1 100%; min-width: 0; display: flex; gap: 6px; align-items: stretch; }
  .pick-row select { flex: 1 1 auto; }
  .controls select { flex: 1 1 100%; min-width: 0; max-width: 100%; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px 9px; font-size: 13px; }
  /* One pressed style for every toggle, in the "you" blue: yellow belongs to "Needs you" alone, so a switched-on Follow Herdr or Pin never reads as an ask. */
  .btn[aria-pressed="true"], .view-btn[aria-pressed="true"], .follow-quick[aria-pressed="true"], .star-btn[aria-pressed="true"], .pin[aria-pressed="true"], .hide-msg[aria-pressed="true"], .sheet-flag[aria-pressed="true"], .search-row button[aria-pressed="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); }
  .btn:focus-visible, .tab:focus-visible, .fold:focus-visible, .bar-toggle:focus-visible, .crumb:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .summary { font-size: 12px; color: var(--muted); margin-top: 4px; }
  /* The hosted copy says when the laptop built it, and says so louder once that is old. */
  .asof { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .asof span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asof.stale span { color: var(--ask); font-weight: 600; }
  .asof.says span { white-space: normal; overflow: visible; }
  .asof button { flex: none; border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
  .asof span { font-variant-numeric: tabular-nums; }
  .asof button.sync { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 1px 9px; color: var(--ink); text-decoration: none; }
  .asof button.sync:disabled { opacity: .6; cursor: default; }
  .asof button.sync:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .asof a.offline-link { flex: none; font-size: 12px; color: var(--muted); }
  /* What this device holds of a sealed copy, with the two actions: Download everything now, Forget this device. */
  .offline { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); }
  .offline-text { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .offline-text.bad { color: var(--open); }
  .offline progress { display: block; width: 100%; height: 6px; margin-top: 6px; }
  .offline-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  @media (hover: none) and (pointer: coarse) { .offline-acts .btn { min-height: 44px; padding: 4px 12px; font-size: 14px; } .asof a.offline-link { padding: 12px 4px; } }
  /* A sealed copy asks for its passphrase before anything else; the tabs wait until it opens. */
  .locked #bar-more, .locked .bar-toggle { display: none; }
  main { max-width: var(--col); margin: 0 auto; padding: 10px 12px 80px; }

  /* View A: conversation reader */
  .divider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); margin: 14px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .input { margin: 18px 0 6px; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .input.captain { background: var(--you-wash); border: 1px solid color-mix(in srgb, var(--you) 30%, transparent); margin-left: 2.2rem; }
  .input.firstmate { background: var(--mate-wash); border: 1px solid color-mix(in srgb, var(--mate) 30%, transparent); margin-right: 1.2rem; }
  .input.peer { background: var(--wash); border: 1px solid var(--line); margin-right: 1.2rem; }
  .who { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 2px; white-space: normal; }
  .who > b, .who > span, .who > button { white-space: nowrap; }
  .who > span.note { white-space: normal; flex: 1 1 12ch; min-width: 0; }
  .wake-who { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who b { color: var(--ink); }
  .input.captain .who b { color: var(--you); }
  .input.firstmate .who b { color: var(--mate); }
  .clip { max-height: 13.5em; overflow: hidden; position: relative; }
  .clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em; background: linear-gradient(transparent, var(--paper)); pointer-events: none; }
  .input .clip::after { background: none; }
  .more { border: 0; background: none; color: var(--you); padding: 2px 0; font-size: 13px; }
  .reply { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .reply.needs { border-left: 4px solid var(--ask-line); }
  .chip { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
  .chip.needs { background: var(--ask-wash); color: var(--ask); }
  .chip.reminder, .chip.asked, .chip.answered { background: var(--code); color: var(--muted); font-weight: 600; }
  .chip.open { background: color-mix(in srgb, var(--open) 15%, transparent); color: var(--open); }
  .asks { background: var(--ask-wash); border-radius: 8px; padding: 6px 9px; margin: 6px 0; font-size: 15px; }
  .asks div + div { margin-top: 4px; }
  .asks .cardq b { font-weight: 700; margin-right: 6px; }
  .asks .cardq .rec { color: var(--muted); }
  /* While the box above lists the asks, the reply's body does not mark them a second time. */
  .reply.boxed .md .ask { background: none; box-shadow: none; }
  .reply.boxed .md tr.ask td { background: none; }
  .asks code, .input code { font: 13px var(--mono); background: color-mix(in srgb, var(--code) 70%, transparent); border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }
  /* Prose stops at about 75 characters a line however wide its box is; tables and code boxes keep the whole box. */
  .md > :is(p, ul, ol, blockquote, hr, h1, h2, h3, h4, h5, h6) { max-width: var(--measure); }
  .md p { margin: 0 0 .55em; }
  .md ul, .md ol { margin: 0 0 .55em; padding-left: 1.5em; }
  .md li { margin: 0 0 .25em; }
  .md li > p { margin: 0 0 .35em; }
  .md li > ul, .md li > ol { margin: .25em 0; }
  .md li.task { list-style: none; position: relative; }
  .md li.task::before { content: "\2610"; position: absolute; left: -1.4em; }
  .md li.task.done::before { content: "\2611"; }
  .md h4 { margin: .6em 0 .3em; font-size: 15px; }
  .md .ask { background: var(--ask-wash); box-shadow: -4px 0 0 var(--ask-wash), 4px 0 0 var(--ask-wash); border-radius: 3px; }
  .md .reminder { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .md code, .empty code { font: 13px var(--mono); background: var(--code); border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }
  .md pre { font: 12px/1.45 var(--mono); background: var(--code); border-radius: 6px; padding: 7px 9px; overflow-x: auto; white-space: pre; margin: 0 0 .55em; }
  .md .local-link { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  /* A reply's mention of another session (a tab label, a role, an id), linked when the reader lists that session. */
  .md a.session-ref { color: var(--mate); text-decoration: underline dotted currentColor; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; border-radius: 3px; }
  .md a.session-ref:hover { text-decoration-style: solid; background: var(--mate-wash); }
  .md a.session-ref:focus-visible { outline: 2px solid var(--mate); outline-offset: 2px; }
  .md a.session-ref code { color: inherit; }
  /* A markdown file named by its absolute path (filerefs.js): a link, drawn as the other links of a reply are, dotted until hovered. */
  .md a.file-ref { color: var(--you); text-decoration: underline dotted currentColor; text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: pointer; border-radius: 3px; overflow-wrap: anywhere; }
  .md a.file-ref:hover { text-decoration-style: solid; background: var(--you-wash); }
  .md a.file-ref:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .md a.file-ref code { color: inherit; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: .8em 0; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 9px; color: var(--muted); margin: 0 0 .55em; }
  .md blockquote > :last-child { margin-bottom: 0; }
  .codebox { position: relative; margin: 0 0 .55em; }
  /* Wrapped, not scrolled sideways, so a whole command shows at once and stays clear of Copy. */
  .codebox pre { margin: 0; padding-right: 4.4rem; min-height: 2.2rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-label { position: absolute; left: 9px; top: -7px; font: 10px var(--sans); color: var(--dim); background: var(--paper); border-radius: 4px; padding: 0 4px; }
  .copy { position: absolute; top: 4px; right: 4px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 6px; padding: 1px 8px; font-size: 12px; user-select: none; -webkit-user-select: none; }
  .copy::before { content: attr(data-label); }
  .copy:hover { color: var(--you); border-color: var(--you); }
  .table-wrap { overflow-x: auto; margin: 0 0 .7em; border: 1px solid var(--line); border-radius: 8px; }
  .table-cue { position: relative; margin: 0 0 .7em; }
  .table-cue .table-wrap { margin: 0; }
  /* The shadow on an edge with more behind it, and a round arrow on it; neither takes a tap. */
  .table-cue .cue { position: absolute; top: 1px; bottom: 1px; width: 30px; display: none; pointer-events: none; }
  .table-cue .cue.l { left: 1px; border-radius: 7px 0 0 7px; background: linear-gradient(to right, var(--cue), transparent); }
  .table-cue .cue.r { right: 1px; border-radius: 0 7px 7px 0; background: linear-gradient(to left, var(--cue), transparent); }
  .table-cue .cue::after { position: absolute; top: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); color: var(--muted); font-size: 17px; line-height: 1; padding-bottom: 2px; }
  .table-cue .cue.l::after { content: "\2039"; left: 3px; }
  .table-cue .cue.r::after { content: "\203a"; right: 3px; }
  .table-cue.more-l .cue.l, .table-cue.more-r .cue.r { display: block; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.4; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--line); min-width: 5.5rem; }
  .md th { background: var(--wash); border-top: 0; font-weight: 650; white-space: nowrap; }
  .md td:first-child, .md th:first-child { min-width: 2.5rem; }
  .md tr.ask td { background: var(--ask-wash); }
  .doc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .doc-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--you); background: var(--you-wash); color: var(--you); border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 600; max-width: 100%; }
  .doc-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-icon { font-weight: 400; }

  /* An HTML file a reply names, shown from the server in a sandboxed frame (api.js) */
  .htmlview { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .htmlbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .htmlbar a.btn, .imgbar a.btn { text-decoration: none; color: inherit; }
  .htmlbar .when { flex: 1 1 10rem; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .htmlframe { position: relative; height: 72vh; height: 72dvh; min-height: 18rem; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .htmlframe iframe { display: block; border: 0; width: 100%; height: 100%; background: #fff; transform-origin: 0 0; }
  .htmlnote { padding: 18px 14px; font-size: 14px; color: var(--muted); background: var(--paper); height: 100%; }
  .htmlview.full { position: fixed; inset: 0; z-index: 20; background: var(--wash); padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
  .htmlview.full .htmlframe { flex: 1; height: auto; min-height: 0; border-radius: 8px; }

  /* An image file a reply names, in an <img>: fitted to the width, or at its own size inside a frame that scrolls */
  .imgview { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .imgbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .imgbar .when { flex: 1 1 14rem; min-width: 0; font-size: 12px; color: var(--muted); }
  .imgframe { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: auto; padding: 8px; text-align: center; overscroll-behavior: contain; }
  .imgframe img { display: inline-block; vertical-align: top; max-width: 100%; height: auto; cursor: zoom-in; }
  .imgframe.vector img { width: 100%; }
  .imgframe.actual { max-height: 78vh; max-height: 78dvh; text-align: left; }
  .imgframe.actual img { max-width: none; width: auto; cursor: zoom-out; }
  .imgframe.nozoom img { cursor: default; }

  /* Documents: a file a message names, beside its contents list */
  .docmode { --col: var(--col-doc); }
  .docview { display: block; }
  .toc { position: sticky; top: var(--bar-h, 120px); z-index: 3; background: var(--wash); margin: 0 0 10px; }

  .state { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 6px; background: var(--code); color: var(--muted); }
  .state.ask { background: var(--ask-wash); color: var(--ask); }
  .state.done { background: var(--ok-wash); color: var(--ok); }
  .state.you { background: var(--you-wash); color: var(--you); }
  .ev .text { font-size: 14px; overflow-wrap: anywhere; cursor: pointer; }
  .ev .text.collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .detail { grid-column: 2; margin-top: 4px; }
  .filters { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }

  /* Replying to a reply: the Reply button, the selection button and the composer */
  .reply-to { margin-left: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--you); }
  /* Pin: on a message and on a reply, then the list of pins in the header. */
  .pin { margin-left: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .pin + .reply-to { margin-left: 0; }
  /* Hide: removes a message or reply from this view only (never from the session log); the pill sits beside Pin and shows it again while hidden ones are on show. */
  #search [data-scope][aria-disabled="true"] { opacity: .45; }
  .hide-msg { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .pin + .hide-msg { margin-left: 0; }
  .hide-msg + .reply-to { margin-left: 0; }
  .hide-msg:focus-visible, .undo-toast button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .gone { opacity: .6; border-style: dashed; }
  .gone > .who::after { content: "hidden"; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 99px; padding: 0 7px; order: 9; }
  .undo-toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dock-h, 0px) + 14px); z-index: 30; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 8px 8px 8px 14px; border-radius: 99px; background: var(--ink); color: var(--paper); font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .undo-toast[hidden] { display: none; }
  .undo-toast button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 99px; padding: 3px 12px; font-weight: 600; }
  /* Marking a reply's answer sheet wrong or missing: a small button after Reply, and the panel it opens under the reply's header line. */
  .sheet-flag { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .sheet-flag:focus-visible, .sheetfix button:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .sheetfix { margin: 4px 0 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--wash); font-size: 13px; color: var(--ink); }
  .sheetfix .line { margin: 0 0 6px; }
  .sheetfix .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .sheetfix button { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 2px 10px; font-size: 12px; color: var(--ink); }
  .sheetfix button.primary { border-color: var(--you); color: var(--you); font-weight: 600; }
  .sheetfix button:disabled { opacity: .5; }
  .sheetfix .say { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
  .sheetfix .say.bad { color: var(--open); }
  .sheetfix .hint { margin: 6px 0 0; font-size: 12px; color: var(--faint); }
  @media (pointer: coarse) { .sheet-flag, .sheetfix button { min-height: 44px; } }
  .pin:focus-visible, .pin-item:focus-visible, .pin-x:focus-visible, .reply-to:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  #pins-panel { min-width: 0; margin-top: 4px; }
  .pins { margin-top: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 6px 8px; }
  .pins-scope { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pins-scope .where { margin-left: auto; font-size: 11px; color: var(--faint); }
  .pins-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: min(38vh, 22rem); overflow-y: auto; overscroll-behavior: contain; }
  .pins-list li { display: flex; gap: 4px; align-items: flex-start; border-top: 1px solid var(--line); }
  .pin-body { flex: 1; min-width: 0; }
  .pin-item { display: block; width: 100%; min-width: 0; text-align: left; border: 0; background: none; padding: 6px 2px; }
  .pin-meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; }
  .pin-item.gone .pin-text { color: var(--muted); font-style: italic; }
  .pin-actions { display: flex; flex: none; gap: 5px; align-items: flex-start; padding-top: 6px; }
  .pin-edit, .pin-x { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 3px; text-decoration: underline; }
  .pin-description-edit { display: flex; gap: 5px; align-items: center; padding: 0 2px 6px; }
  .pin-description-edit input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; background: var(--paper); color: var(--ink); font: 14px/1.3 var(--sans); }
  .pin-description-edit input:focus { outline: 2px solid var(--you); outline-offset: -1px; }
  .pin-description-edit .btn { flex: none; padding: 3px 7px; font-size: 12px; }
  .pins-note { font-size: 12px; color: var(--muted); padding: 6px 2px 2px; }
  .reply.is-target-reply { box-shadow: 0 0 0 2px var(--you); }
  .live { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .live.on { color: var(--ok); }
  .follow-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .kept-note { font-size: 12px; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .kept-note .btn { margin-left: 4px; padding: 2px 8px; font-size: 12px; }
  .float-comment-key { margin-left: 7px; font-weight: 400; font-size: 11px; opacity: .8; }
  .float-comment { position: absolute; z-index: 7; border: 1px solid var(--you); background: var(--you); color: var(--paper); border-radius: 99px; padding: 3px 11px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
  .copy-note { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 8; border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; background: var(--paper); color: var(--muted); font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .14); opacity: 0; transform: translateY(3px); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
  .copy-note.show { opacity: 1; transform: translateY(0); }
  .dock { position: fixed; left: 0; right: var(--rail); bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgb(0 0 0 / .08); padding-bottom: env(safe-area-inset-bottom); }
  .dock-inner { max-width: var(--col); margin: 0 auto; padding: 6px 12px 8px; }
  .dock-chip { border: 1px solid color-mix(in srgb, var(--you) 35%, transparent); background: var(--you-wash); border-radius: 8px; padding: 5px 8px; margin-bottom: 5px; }
  .dock-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .dock-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-head button, .dock-passage button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 13px; }
  .dock-passage { display: flex; gap: 6px; align-items: baseline; font-size: 13px; color: var(--muted); border-left: 3px solid var(--ask-line); padding-left: 7px; margin-top: 5px; }
  .dock-passage span { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dock-label { font-size: 11px; color: var(--faint); margin-top: 4px; }
  .dock-fold { display: inline; font: inherit; color: var(--you); background: none; border: 0; padding: 0; margin: 0 4px 0 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .dock-line { font: 12px/1.4 var(--mono); background: var(--paper); border-radius: 6px; padding: 4px 7px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 4.2em; overflow-y: auto; }
  .dock-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dock-acts { display: flex; gap: 8px; align-items: baseline; min-height: 20px; }
  .dock-acts .why { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-acts .why.bad { color: var(--open); white-space: normal; }
  .dock-acts .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dock-acts .count.bad { color: var(--open); font-weight: 600; }
  .dock-acts button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
  .dock-worker { font-size: 12px; color: var(--ask); }
  .dock-row { display: flex; gap: 6px; align-items: flex-end; margin-top: 4px; }
  /* 16px keeps a phone from zooming in when the box is tapped. */
  .dock textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); resize: none; overflow-y: auto; }
  .dock textarea:focus { outline: 2px solid var(--you); outline-offset: -1px; }
  .dock textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock-row button { background: var(--you); border: 1px solid var(--you); color: var(--paper); font-weight: 600; border-radius: 10px; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
  .dock-row button.alt { background: var(--paper); color: var(--you); padding: 7px 10px; }
  .dock-batch { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 5px; }
  .dock-batch .dock-head button:first-child { flex: 1; min-width: 0; text-align: left; color: var(--ink); font-weight: 600; }
  .dock-batch .dock-head button.armed { color: var(--open); font-weight: 600; }
  .dock-batch ol { list-style: none; margin: 3px 0 0; padding: 0; max-height: 28vh; overflow-y: auto; }
  .dock-batch li { display: flex; gap: 6px; align-items: baseline; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
  .dock-batch .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .dock-batch .what { flex: 1; min-width: 0; }
  .dock-batch .what small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-batch .what span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .dock-batch li button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
  /* The whole message a batch sends, on demand: numbering, every pointer and comment in full. */
  .dock-preview { margin: 0 0 5px; max-height: 30vh; overflow-y: auto; }
  .dock-preview .dock-line { max-height: none; overflow: visible; border: 1px solid var(--line); }
  @media (max-width: 440px) { .dock-batch ol { max-height: 18vh; } }
  /* A fingertip is about 44 px: Send and Add, the links under the box and the Pin and Reply pills grow where the screen is touched, not under a mouse. */
  @media (pointer: coarse) {
    .dock-row button { min-height: 44px; min-width: 44px; }
    .dock textarea { min-height: 44px; }
    .dock-acts button, .dock-head button, .dock-batch li button { padding: 8px 6px; }
    .pin, .reply-to { padding-top: 7px; padding-bottom: 7px; }
    .hide-msg { padding-top: 7px; padding-bottom: 7px; }
    .undo-toast button { min-height: 44px; }
  }
  .dock button:disabled { opacity: .45; cursor: default; }
  .input.pending { opacity: .6; border-style: dashed; }
  .input.pending.refused { opacity: 1; border-color: var(--open); }
  /* A message the owner can still take back, or is being asked about, reads at full strength: it is waiting on them. */
  .input.pending.undoable { opacity: 1; }
  .input.pending.noted { opacity: .85; }
  .input.pending .hint { font-size: 12px; color: var(--muted); margin: 0 0 3px; }
  .input.pending .who > button.undo { border-color: var(--you); background: var(--you); color: var(--paper); font-weight: 600; }
  .input.pending .who > button:disabled { opacity: .5; }
  .dock textarea:read-only { opacity: .6; }
  .dock-row button.undo { background: var(--paper); color: var(--you); min-width: 5.2em; font-variant-numeric: tabular-nums; }
  /* Photos for the message: the button that picks them (the same size as Add and Send, 44 px where the screen is touched), a thumbnail for
     each above the box with its own remove button (tap area about 44 px), and a dashed edge while a file is dragged over the page. */
  .dock-row button.icon { padding: 0; width: 38px; height: 36px; display: grid; place-items: center; flex: none; }
  .dock-row button.icon svg { display: block; }
  .dock-row button[aria-disabled="true"] { opacity: .45; }
  .dock-thumbs { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; padding: 6px 0 2px; margin-top: 2px; scrollbar-width: thin; }
  .thumb { position: relative; flex: none; width: 56px; height: 56px; }
  .thumb-pic { display: block; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--code); }
  .thumb-pic canvas { display: block; width: 100%; height: 100%; }
  .thumb-pic.plain { display: grid; place-items: end center; padding-bottom: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .thumb.bad .thumb-pic { border: 2px solid var(--open); }
  .thumb-x { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 50%; background: rgb(0 0 0 / .66); color: #fff; font-size: 11px; line-height: 1; display: grid; place-items: center; }
  .thumb-x::after { content: ""; position: absolute; inset: -11px; }
  .thumb-x:focus-visible, .dock-row button.icon:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .dock.dropping .dock-inner { outline: 2px dashed var(--you); outline-offset: -4px; border-radius: 12px; }
  .new-reply { position: fixed; left: calc((100% - var(--rail)) / 2); transform: translateX(-50%); z-index: 6; border: 1px solid var(--you); background: var(--you); color: var(--paper); border-radius: 99px; padding: 4px 13px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }

  /* Search: the button in the title row, the row under it and the list of matches. Opening it folds the tabs and controls,
     as the folded header already does, so on a phone the row and the list have the screen. */
  .search-toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 30px; height: 28px; padding: 0; color: var(--muted); flex: none; display: grid; place-items: center; }
  .search-toggle[aria-expanded="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); }
  .search-toggle:focus-visible, .search-row button:focus-visible, .search-chips .btn:focus-visible, .hit:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .locked .search-toggle, .locked .search { display: none; }
  .search { margin-top: 6px; }
  .search-row { display: flex; gap: 6px; align-items: center; }
  /* 16px keeps a phone from zooming in when the box is tapped. */
  .search-row input { flex: 1 1 auto; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px; background: var(--paper); color: var(--ink); font: 16px/1.3 var(--sans); }
  .search-row input:focus { outline: 2px solid var(--you); outline-offset: -1px; }
  .search-count { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .search-row button { flex: none; height: 30px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 0 8px; font-size: 13px; color: var(--ink); }
  .search-row button:disabled { opacity: .45; cursor: default; }
  .search-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
  .search-chips .btn { font-size: 12px; padding: 3px 7px; }
  .search-chips .brk { flex-basis: 100%; height: 0; }
  @media (max-width: 440px) { .search-chips .long { display: none; } .bar.searching .asof { display: none; } }
  .search-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .search-results { margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); max-height: min(58vh, 32rem); overflow-y: auto; overscroll-behavior: contain; }
  .hit-group { position: sticky; top: 0; display: flex; gap: 6px; background: var(--wash); border-bottom: 1px solid var(--line); padding: 3px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .hit-group span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 6px 9px; }
  .hit-group + .hit { border-top: 0; }
  .hit[aria-current="true"] { background: var(--you-wash); }
  .hit-meta { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 12px; color: var(--muted); }
  .hit-meta b { color: var(--ink); }
  .hit-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; }
  .hit-text mark { background: var(--hit); color: inherit; border-radius: 2px; }
  .hit-more { padding: 6px 9px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  /* Where the words are on the page. The page's own text is never rewrapped: these are ranges over it. */
  :root { --hit: #ffe066; }
  @media (prefers-color-scheme: dark) { :root { --hit: #6b5a12; } }
  /* The header, folded: the jumps (the pills of the open controls) and the icons for the other views sit in it. */
  .jump { display: none; flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; height: 28px; padding: 0 8px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .jump.ask { color: var(--ask); }
  .bar.collapsed .jump:not([hidden]) { display: block; }
  .jump:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  /* On a phone's width the folded header is two lines: the picker, the live badge, search and the way back to the controls above; the jumps,
     the other views, the answer sheet and Follow below, each with room for a thumb. The sync line stays out of it unless it has a warning. */
  @media (max-width: 640px) {
    .bar.collapsed .title { flex-wrap: wrap; gap: 0 6px; }
    .bar.collapsed .title > :is(.crumb, .crumb-session, .crumb-doc) { order: 1; flex: 1 1 0; }
    .bar.collapsed .title > .crumb-star { order: 2; }
    .bar.collapsed .title > .live { order: 3; }
    .bar.collapsed .title > .search-toggle { order: 4; }
    .bar.collapsed .title > .bar-toggle { order: 5; }
    /* The Tasks icon goes up beside the search where the width wraps: the second line has room for the jumps, Documents, the answer sheet, Pins and Follow, and no more. */
    .bar.collapsed .title > #view-tasks { order: 3; margin-top: 0; }
    .bar.collapsed .title::after { content: ""; order: 6; flex: 0 0 100%; height: 0; }
    .bar.collapsed .title > :is(.jump, .view-btn, .to-sheet, .follow-quick) { order: 7; margin-top: 6px; }
    .bar.collapsed .asof:not(.stale) { display: none; }
    .bar.searching .title::after, .bar.searching .title > :is(.jump, .view-btn, .to-sheet, .follow-quick) { display: none !important; }
  }
  /* A fingertip is about 44 px: every control in the header (the title row, the tabs, the pills, the pickers, the search and the
     lists in the controls) is that tall where the screen is touched, and the icon buttons are that wide. */
  @media (pointer: coarse) {
    .bar :is(.view-btn, .bar-toggle, .search-toggle, .star-btn, .crumb-star), .bar.collapsed .to-sheet { width: 44px; height: 44px; margin-left: 0; }
    .bar.collapsed .view-btn::after, .bar.collapsed .to-sheet::after { content: none; }
    .bar :is(.follow-quick, .jump) { height: 44px; min-width: 44px; padding: 0 6px; }
    .bar .crumb { min-height: 44px; }
    .bar :is(.crumb-session, .crumb-doc, .controls select) { height: 44px; }
    .bar .tab, .bar .btn { min-height: 44px; }
    .bar .to-sheet { display: flex; align-items: center; min-height: 44px; padding: 0 6px; }
    .bar .asof { align-items: center; margin-top: 6px; }
    .bar .asof button.sync { min-height: 44px; padding: 1px 14px; }
    .bar .asof a.offline-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; }
    .search-row input { height: 44px; }
    .search-row button { height: 44px; min-width: 44px; }
    .pin-item, .pin-x { min-height: 44px; }
  }
  /* Three pills, three icons and Follow are 380 px of fingertip, more than a 390 px phone leaves: a 4 px gap and 4 px inside each pill bring the row
     to 356 px, one row (a narrower screen wraps Follow onto a row of its own). */
  @media (pointer: coarse) and (max-width: 440px) {
    .bar.collapsed .title { column-gap: 4px; }
    .bar :is(.follow-quick, .jump) { padding: 0 4px; }
  }
  ::highlight(find-hit) { background-color: #ffe066; color: #1d2433; }
  ::highlight(find-current) { background-color: #ff9632; color: #1d2433; }
  @media (prefers-color-scheme: dark) { ::highlight(find-hit) { background-color: #6b5a12; color: #ffffff; } ::highlight(find-current) { background-color: #c2641a; color: #ffffff; } }
  /* A question a Campus agent waits on (the embed page): the yellow box a reply's asks have, each question with its choices as small pills;
     answered or cancelled, the box goes quiet and the pick is filled. */
  .cform .cardq + .cardq { margin-top: 8px; }
  .copts { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }

     message bar, search and floating buttons are not there. A strip at the foot says what the agent is doing, and "New reply" offers the
     newest turn when you have scrolled up; both sit over the column the way the message bar does on the reader. */
  body.embed #bar, body.embed .copy-note, body.embed #new-reply { display: none !important; }

  .embed-live .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: embed-pulse 1.4s ease-in-out infinite; }

<script>
(() => {
  "use strict";
  // Three pages are made from this one: the local page (its payload holds every conversation), the hosted copy's shell and the lite page.
  // The hosted shell and the lite page have no payload: they load an index.json, then one conversation at a time (hosted.js). That is one
  // question, LAZY. Whether there is a laptop to ask is another, HOSTED: the hosted copy has none, so it has no Follow, Reopen, Close or
  // Sync of its own, and its message bar queues a send (hosted.enqueue) for the laptop's sync to deliver when it is awake and shows what
  // the laptop answered. The lite page (out/live/index.html) is LAZY and not HOSTED: it is served by the reader's own server, so it sends
  // straight to the pane (every check the server makes), follows Herdr, polls the state every 2 seconds and waits on the server's events,
  // and only its conversations come one at a time, from the objects each build writes beside it.
  // A fourth page is made from it too: the embed page (out/live/embed.html), a host's web view (Conn's) that draws one conversation of its own
  // from JSON, with the reader's turns and styles and none of the reader (README.md, "The embed page"). It is the local page with nothing
  // to ask and nothing kept: its payload is empty, its server is never reached (live.js), it stores nothing (memoryStorage below), its
  // header, message bar and search are hidden, and its turns come from window.readerEmbed instead of the reading list.
  const MODE = "__MODE__";  // "local", "hosted", "live" or "embed"
  const LAZY = MODE === "hosted" || MODE === "live";
  const HOSTED = MODE === "hosted";
  const EMBED = MODE === "embed";
  // What the embed page keeps: nothing past the page itself. Every read and write of localStorage and sessionStorage in this script lands
  // here, so the pins, the read marks, the drafts and the rest of what the reader keeps in a browser are never written, whatever code reaches them.
  const memoryStorage = () => { const held = new Map(); return { getItem: k => held.has(k) ? held.get(k) : null, setItem: (k, v) => { held.set(k, String(v)); }, removeItem: k => { held.delete(k); }, clear: () => held.clear(), key: i => [...held.keys()][i] ?? null, get length() { return held.size; } }; };
  const browserStorage = name => { try { return window[name]; } catch (e) { return null; } };
  const localStorage = EMBED ? memoryStorage() : browserStorage("localStorage");
  const sessionStorage = EMBED ? memoryStorage() : browserStorage("sessionStorage");
/*__LIVE__*/
/*__HOSTED__*/
  // What needs the local server: refreshing, following Herdr, sending, reopening and closing.
  const canLive = live.served && !HOSTED;
  // The answer sheet: the local page's is questionnaire.html; the hosted copy's and the lite page's are sheet.html beside the page (the lite
  // page's shows this conversation's sheets only and links back to it, so a column or a window stays on the conversation it was opened on).
  const SHEET_PAGE = HOSTED || MODE === "live" ? "sheet.html" : "questionnaire.html";
/*__PINS__*/
/*__PICKER__*/
/*__ASKS__*/
/*__MARKDOWN_IT__*/
/*__MARKDOWN__*/
/*__STEPS__*/
/*__FIND__*/
/*__DOCFILES__*/
/*__ADDRESS__*/
/*__SESSIONREFS__*/
/*__FILEREFS__*/
/*__EMBED__*/
/*__SELECTCOPY__*/
  const selectCopy = readerSelectCopy;
  // A lazy page starts empty until its index.json arrives.
  let data = LAZY ? hosted.data({}, null) : JSON.parse(document.getElementById("payload").textContent);
  const $ = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  let detailCount = 0;
  // What hides text on screen, each with its own opener, so a pin or a search match opens only what hides it, in place,
  // and never redraws the conversation: a run of folded wake-ups, a folded wake-up, a clipped message or reply, working
  // notes. Keyed like state.open (the key a click on the button adds), and filled again by each render.
  // { open(), close(), shown() }
  const reveals = new Map();
  // open: what the reader expanded (long replies, folded wake-ups, working notes), so a refresh keeps it.
  const state = { view: "reader", session: 0, showWakes: false, open: new Set(), fleetHome: "all", hideRoutine: true, openOnly: false, follow: true, copySelection: true, barOpen: true, pinsOpen: false, pinsScope: "here", pinEditing: null, showHidden: false, docPage: "list" };
  // The lite page is opened on one conversation (a column that is pinned to it) and stays there until Follow is turned on for it, in its own
  // setting; the local page follows unless it was turned off.
  const FOLLOW_KEY = MODE === "live" ? "tr-live-follow" : "tr-follow";
  state.follow = MODE !== "live";
  try { state.follow = MODE === "live" ? localStorage.getItem(FOLLOW_KEY) === "1" : localStorage.getItem(FOLLOW_KEY) !== "0"; } catch (e) { /* the default */ }
  try { state.copySelection = localStorage.getItem("tr-copy-selection") !== "0"; } catch (e) { /* default: copy */ }
  if (EMBED) state.copySelection = false;  // a host's web view never copies what is selected on its own
  // A phone's width. The header starts folded there, on every view (an HTML file gets the whole screen under one line of it), so the
  // conversation has the screen; the controls are one tap away. What the owner chose in this browser wins over that: open or folded
  // (barChoice), until the browser forgets it. With no choice, the header follows the width, a turned phone included.
  const narrow = matchMedia("(max-width: 440px)");
  let barChoice = null;
  try { const kept = localStorage.getItem("tr-bar"); barChoice = kept === "1" ? true : kept === "0" ? false : null; } catch (e) { /* no choice kept */ }
  state.barOpen = barChoice === null ? !narrow.matches : barChoice;
  // How a leader's Documents view groups its files: "task" (the default) or "folder". Kept in this browser, for every leader alike.
  let docGroup = "task";
  try { docGroup = docfiles.pref(localStorage.getItem("tr-docgroup")); } catch (e) { /* default: by task */ }
  const homeName = id => id === "main" ? "Main" : id === "captain" ? "You" : id === "workspace" ? "Your own sessions" : id.replace(/^secondmate-/, "").replace(/ · \d{4}-\d{2}-\d{2}-/, " · ");
  const fmtTime = s => new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(s * 1000));
  const fmtClock = s => new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date(s * 1000));
  const fmtDay = s => new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" }).format(new Date(s * 1000));
  const fmtShortDay = s => new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short" }).format(new Date(s * 1000));
  const fmtWhen = s => s ? `${fmtDay(s)} ${fmtTime(s)}` : "";
  // When the hosted copy was built: the time alone today, with the day before that.
  const builtAt = s => fmtShortDay(s) === fmtShortDay(Date.now() / 1000) ? fmtTime(s) : fmtWhen(s);
  // How long ago, in words that fit a phone's line: "5 min", "3 h", "2 days".
  const ago = s => { const m = Math.max(0, Math.round((Date.now() / 1000 - s) / 60)); return m < 60 ? `${m} min` : m < 2880 ? `${Math.round(m / 60)} h` : `${Math.round(m / 1440)} days`; };

  // ---------------------------------------------------------------- markdown
  // The parsing and the safety of it (no raw HTML, only http(s) links) are in markdown.js; this draws its HTML into a box.
  const inline = text => markdownView.inline(text);
  // doc: a whole document, with real heading levels (collected in box.headings for its contents list), nested lists and a
  // front matter box; a reply keeps small headings. The asked and reminding lines of a reply are marked where they are.
  function renderMarkdown(text, askLines = [], reminderLines = [], doc = false) {
    const drawn = markdownView.render(text, { ask: askLines, reminder: reminderLines, doc });
    const box = $("div", "md" + (doc ? " doc-md" : ""));
    box.innerHTML = drawn.html;
    box.querySelectorAll(".table-wrap").forEach(tableCue);
    box.headings = drawn.headings.map(h => ({ level: h.level, text: h.text, el: box.querySelector("#" + h.id) }));
    return box;

    const closedHere = lost && handClosed.some(id => id.startsWith(lost));
    link.opening = lost && live.served && !HOSTED && !closedHere ? (data.closed || []).find(c => c.id.startsWith(lost)) || null : null;
    // An address that names a session the reader does not list opens that session, empty, with a note: never another conversation. (This tab's own last
    // conversation, found with no address, going missing still opens the list's first, with the notice.)
    const placeholder = wanted && fromHash < 0 && !link.opening;
    if (lost && !link.opening && !closedHere && !placeholder) link.listing = { text: `Session ${lost.slice(0, 8)} is not on the reader any more, so this is another conversation.` };
    state.session = fromHash >= 0 ? fromHash : placeholder ? noTranscript(wanted, "", closedHere ? "closed" : "none") : fromSaved >= 0 ? fromSaved : LAZY ? waitingFirst() : data.chosen ? 0 : biggest();
    if (wantedDoc && data.documents && data.documents[wantedDoc]) { state.view = "doc"; state.doc = wantedDoc; state.docPage = "file"; docReveal = wantedDoc; }
    // The session the page opened on, by address or by this tab, wins over the first Herdr focus.
    // Decided here, before the page writes its own address below.
    link.keepOpening = fromHash >= 0 || fromSaved >= 0 || Boolean(placeholder);
    // A message address (&m=) is followed once the conversation it names is on screen (openReading, reopenLost); one whose
    // conversation is not on the reader leaves the notice above, and no message is looked for in the conversation that opened instead.
    link.message = asked.message && (fromHash >= 0 || link.opening) ? asked.message : null;  // (never in a session with no transcript)
    return saved;
  }
  function openReading(saved) {
    addressLive = true;
    if (link.opening) { render(); reopenLost(link.opening, saved); return; }
    const opened = data.sessions[state.session];
    const same = saved && opened && (opened.ids || [opened.id]).includes(saved.session);
    if (same) {
      state.open = moveTurns(saved.first, saved.session, opened, saved.open || [], saved.anchor);
      state.showWakes = !!saved.showWakes;
      if (state.view === "reader" && saved.view === "fleet") state.view = "fleet";
    }
    restoreSendHandoff();
    if (state.view === "reader") restoreSearch();
    setAddress();
    render();
    if (same && saved.anchor) restoreAnchor(saved.anchor); else if (state.view === "reader") showLatest();
    followOpeningMessage();
  }
  // ---------------------------------------------------------------- the embed page: one conversation a host hands over (embed.js, README.md "The embed page")
  // A host's web view (Conn's, for a ShopBack Campus conversation) loads this page and calls window.readerEmbed with the conversation's
  // turns as JSON. The turns are drawn by inputBlock and replyCard, the code that draws a Claude or Codex conversation, so markdown, tables,
  // code boxes, "N steps" rows and the step sheet look exactly as they do there. The page asks nothing of Campus or of any server (its content
  // policy allows no connection) and keeps nothing (memoryStorage); Campus data arrives only through this entry point.
  // A call redraws only the blocks whose content changed (a streaming reply is one card), keeps what the reader opened (a clipped reply, the steps
  // list), follows the newest turn while you are at the bottom and otherwise offers "New reply ↓".
  const embed = { conv: null, sid: "campus", blocks: [], live: "", held: new Map(), strip: null, pill: null, newer: false };
  // What a host can hear: window.webkit.messageHandlers.readerEmbed (WKWebView) gets { type: "ready" | "link", ... }. True when someone listened.
  function tell(message) {
    try { const handler = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.readerEmbed; if (handler) { handler.postMessage(message); return true; } } catch (e) { /* no host to tell */ }
    return false;
  }
  function embedLive() {
    const on = Boolean(embed.live);
    embed.strip.hidden = !on;
    embed.strip.querySelector(".txt").textContent = embed.live;
    document.body.classList.toggle("embed-working", on);
    if (embedHost) renderDock();  // the bar and the strip share the foot: the strip sits over the bar, and the conversation's padding is both
    else embedPill();
  }
  const embedStripHeight = () => embed.strip && !embed.strip.hidden ? embed.strip.offsetHeight : 0;
  function embedPill() {
    const bar = document.getElementById("dock");
    embed.pill.hidden = !embed.newer;
    embed.pill.style.bottom = (embedHost && !bar.hidden ? bar.offsetHeight : 0) + embedStripHeight() + 12 + "px";
  }
  const embedUserIds = () => new Set(data.sessions[0].exchanges.filter(e => e.source === "captain" && e.uid).map(e => e.uid));
  // The faded messages (one in its Undo window, one on its way, one the host took) after the host's blocks.
  function embedPaintPending() {
    const main = document.getElementById("main");
    main.querySelectorAll(":scope > .input.pending").forEach(n => n.remove());
    if (embedHost) main.append(...pendingNodes(data.sessions[0]));
  }
  // What the host is asked to type: its answer comes with readerEmbed.sent({ id, ok, error }); no answer in EMBED_ANSWER_MS is a failure that says so.
  function embedSend({ text, comments }) {
    return new Promise((resolve, reject) => {
      const id = newHoldId();
      const timer = setTimeout(() => { embedWaits.delete(id); reject(new Error("The host did not answer, so the message may or may not have gone. Look in the conversation before sending it again.")); }, EMBED_ANSWER_MS);
      embedWaits.set(id, { resolve, reject, timer });
      if (!tell({ type: "send", id, conversation: embed.conv || "", text, comments })) {
        clearTimeout(timer); embedWaits.delete(id);
        reject(new Error("No host is listening, so nothing was sent."));
      }
    });
  }
  const embedBottom = () => window.scrollTo(0, document.documentElement.scrollHeight);
  // Draw embed.blocks into #main: a block whose content is the one already drawn keeps its nodes, a changed one is drawn again where it stands,
  // a new one goes in, a gone one goes out. fresh: a conversation just opened, which starts at its latest turn as the reader does.
  function embedPaint(fresh) {
    const main = document.getElementById("main"), sid = embed.sid;
    const rows = embedModel.view(embed.blocks);
    const session = data.sessions[0];
    session.exchanges = rows.map(r => r.turn);
    stepOutputs.set(sid, { state: "ready", map: Object.assign({}, ...rows.map(r => r.outputs)), error: null, kept: undefined, gen: 0 });
    const stick = fresh || atBottom();
    const was = embed.held, now = new Map();
    let changedEnd = false;
    rows.forEach((row, i) => {
      const old = was.get(row.id);
      if (old && old.sig === row.sig) { now.set(row.id, old); return; }
      const key = `${sid}:${row.id}`;
      const node = row.kind === "user" ? inputBlock(row.turn, row.id, key, sid) : replyCard(row.turn, key, sid);
      now.set(row.id, { sig: row.sig, nodes: node.nodeType === 11 ? [...node.childNodes] : [node] });
      if (i === rows.length - 1) changedEnd = true;
    });
    // What is no longer wanted goes first, so the nodes that stay are never moved (a moved node loses its selection and its scroll).
    for (const [id, old] of was) if (now.get(id) !== old) old.nodes.forEach(n => n.remove());
    main.querySelectorAll(":scope > .empty, :scope > .input.pending").forEach(n => n.remove());
    if (!rows.length) main.append($("div", "empty", "No messages yet."));
    let cursor = main.firstChild;
    for (const row of rows) for (const node of now.get(row.id).nodes) { if (node === cursor) cursor = cursor.nextSibling; else main.insertBefore(node, cursor); }
    embed.held = now;
    embedPaintPending();
    if (fresh) { embed.newer = false; if (rows.length) showLatest(); else window.scrollTo(0, 0); }
    else if (stick) { embed.newer = false; embedBottom(); }
    else if (changedEnd) embed.newer = true;
    embedPill();
  }
  function startEmbed() {
    document.body.classList.add("embed");
    state.view = "embed";  // the reader's keys (j, k, n, w, /) and its redraws act on the reader view alone
    data.sessions = [{ id: embed.sid, ids: [embed.sid], home: "workspace", where: "", agent: "campus", exchanges: [], pane: null, reopened: false }];
    const strip = $("div", "embed-live"); strip.hidden = true; strip.setAttribute("role", "status");
    const inner = $("div", "embed-live-in"); inner.append($("span", "dot"), $("span", "txt")); strip.append(inner);
    const pill = $("button", "embed-new", "New reply ↓"); pill.type = "button"; pill.hidden = true;
    pill.addEventListener("click", () => { embed.newer = false; embedBottom(); embedPill(); });
    window.addEventListener("scroll", () => { if (embed.newer && atBottom()) { embed.newer = false; embedPill(); } }, { passive: true });
    document.body.append(strip, pill);
    Object.assign(embed, { strip, pill });
    // A web address in a reply never takes the view away: the host is told and opens it (or, with no host to tell, a new window does).
    document.addEventListener("click", e => {
      const a = e.target.closest && e.target.closest("a[href]");
      const url = a && a.getAttribute("href");
      if (!url || !/^https?:\/\//i.test(url)) return;
      e.preventDefault();
      if (!tell({ type: "link", url })) window.open(url, "_blank", "noopener");
    }, true);
    // A set with another conversation id starts the page over (and, like any first call, opens at the latest turn); the same id goes on
    // where it was, and so does every upsert.
    const run = (input, replace) => {
      const got = embedModel.parse(input);
      const opening = embed.conv === null || (replace && got.id !== embed.conv);
      if (opening) {
        if (embed.conv !== null) { stepOutputs.delete(embed.sid); embed.held = new Map(); document.getElementById("main").replaceChildren(); state.open.clear(); link.pending = link.pending.filter(p => !p.host); }
        embed.conv = got.id;
        embed.sid = got.id ? `campus:${got.id}` : "campus";
        data.sessions[0].id = embed.sid; data.sessions[0].ids = [embed.sid];
      }
      embed.blocks = replace ? got.blocks : embedModel.upsert(embed.blocks, got.blocks);
      if (replace || got.hasLive) embed.live = got.live;
      embedPaint(opening);
      embedLive();
      if (embedHost) renderDock();  // another conversation has its own box, batch and pointer
      return { ok: true, blocks: embed.blocks.length, skipped: got.skipped };
    };
    // The message bar on or off (README.md, "The composer"). Turning it on or off draws every block again, since a reply card has a Reply button only
    // with it; the place being read is kept.
    const composer = input => {
      const next = embedModel.composer(input), was = Boolean(embedHost);
      embedHost = next;
      document.body.classList.toggle("embed-composer", Boolean(next));
      data.sessions[0].pane = next ? { label: next.name, live: true } : null;
      if (!next) { link.target = null; markTarget(); document.getElementById("float-comment").hidden = true; }
      if (was !== Boolean(next)) {
        const y = window.scrollY, main = document.getElementById("main");
        embed.held = new Map(); main.replaceChildren(); embedPaint(false);
        window.scrollTo(0, y);
      }
      renderDock();
      return { ok: true, on: Boolean(next) };
    };
    // The host's answer to one send (README.md, "The composer"): { id, ok } or { id, ok: false, error }.
    const sent = result => {
      const answer = result && typeof result === "string" ? JSON.parse(result) : result;
      const id = answer && typeof answer === "object" && typeof answer.id === "string" ? answer.id : "";
      const wait = embedWaits.get(id);
      if (!wait) return { ok: false, error: "No send is waiting for that id." };
      clearTimeout(wait.timer); embedWaits.delete(id);
      if (answer.ok === true) wait.resolve({ label: embedHost ? embedHost.name : "the conversation" });
      else wait.reject(new Error(typeof answer.error === "string" && answer.error.trim() ? answer.error.trim() : "The host could not send it."));
      return { ok: true };
    };
    const composerState = () => ({ on: Boolean(embedHost), text: dock("text").value, comments: batchOf(embed.sid).length, holding: Boolean(link.hold), sending: embedWaits.size > 0 });
    window.readerEmbed = Object.freeze({
      version: embedModel.VERSION,
      // The whole conversation: { id?, live?, blocks }, or a JSON string of it. A different id opens another conversation.
      set: input => run(input, true),
      // Blocks to put in: each replaces the block with its id where it stands, any other goes on the end. { live? } when the line changes.
      upsert: input => run(input, false),
      // The working line at the foot ("reading table-a.csv"); "" takes it away.
      live: text => { embed.live = typeof text === "string" ? text.trim() : ""; embedLive(); return { ok: true }; },
      clear: () => run({ id: embed.conv || "", blocks: [], live: "" }, true),
      // The conversation as plain text (CampusTimeline.plainText()'s words).
      plainText: () => embedModel.plain(embed.blocks),
      // The message bar, off until the host asks (README.md, "The composer"), the host's answer to a send, and what the bar holds.
      composer, sent, composerState,
    });
    tell({ type: "ready", version: embedModel.VERSION });
  }
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  if (!EMBED) window.addEventListener("pagehide", () => {
    saveSendHandoff();
    saveSearch();
    const session = data.sessions[state.session];
    try { sessionStorage.setItem("tr-reading", JSON.stringify({ session: session && session.id, first: session && firstTurn(session), view: state.view, open: [...state.open], showWakes: state.showWakes, anchor: readingAnchor() })); } catch (e) { /* the reload starts fresh */ }
  });
  if (!EMBED) {
    pins.load().then(paintPins);
    stars.load().then(paintStars);
    if (canLive) sheetFlags.load().then(paintSheetFixes);
    // The hidden set arrives after the first drawing: draw again at once when this conversation has hidden messages.
    hiddenStore.load().then(() => { if (hiddenStore.count()) render(); });
  }
  hiddenStore.onChange(() => { if (state.view === "reader") render(); });
  if (EMBED) startEmbed();
  else if (!LAZY) openReading(chooseOpening());
  else {
    // A lazy page holds no transcript: a sealed copy is opened first (the hosted copy), then the list comes from index.json, then the
    // conversation opened on. The lite page has nothing to open: its index and objects are served beside it like the page itself.
    if (HOSTED) {
      document.querySelector(".to-sheet").href = "sheet.html";  // the hosted copy's answer sheet
      dock("send").title = "Queue this for the laptop, which sends it to the session's Herdr pane when it is awake and the agent is ready (Enter; Shift+Enter for a new line)";
      document.getElementById("forget").addEventListener("click", forgetDevice);
      document.getElementById("offline-download").addEventListener("click", downloadAll);
      window.addEventListener("online", () => { checkReceipts(); refreshLazy(true).catch(() => {}); });
    }
    (HOSTED ? hosted.prepare().then(state => state === "locked" ? hosted.askPassphrase() : null) : Promise.resolve()).then(() => hosted.index()).then(index => {
      data = hosted.data(index, null);
      if (HOSTED) stars.replace(data.stars || []);
      offline.index = index;
      if (!hosted.offline().fromDevice) { link.syncedAt = Date.now() / 1000; if (HOSTED) hosted.keepFresh(index).then(paintOffline, () => {}); }
      paintSync();
      const saved = chooseOpening();
      whenReady(() => {
        openReading(saved);
        started = true;
        if (!HOSTED) return;  // served: the poll and the wait for builds are already running, and take a build that came while this loaded at their next turn
        hosted.poll(async () => {
          try { await refreshLazy(); } catch (e) { noteSyncFail(e); throw e; }
          await checkReceipts();
        });
        setInterval(() => { if (!document.hidden) checkReceipts(); }, 4000);
        checkReceipts();
      });
    }, e => document.getElementById("main").replaceChildren($("div", "empty", `Could not load the transcripts: ${e.message}`)));
  }

  async function reopenLost(closed, saved) {
    try {
      await live.changeList("reopen", closed.id);
      await refreshData(true);
    } catch (e) {
      link.listing = { text: `Could not open ${closed.label} again: ${e.message}. This is another conversation.` };
    }
    link.opening = null;
    const index = data.sessions.findIndex(s => (s.ids || [s.id]).includes(closed.id));
    if (index >= 0) state.session = index;
    const opened = data.sessions[state.session];
    const same = index >= 0 && saved && (opened.ids || [opened.id]).includes(saved.session);
    if (missing()) await new Promise(resolve => whenReady(resolve));  // a lazy page loads the conversation before it draws it
    if (same) state.open = moveTurns(saved.first, saved.session, opened, saved.open || [], saved.anchor);
    restoreSendHandoff();
    setAddress();
    render();
    if (same && saved.anchor) restoreAnchor(saved.anchor); else showLatest();
    followOpeningMessage();
  }
})();
</script>
</body>
</html>
