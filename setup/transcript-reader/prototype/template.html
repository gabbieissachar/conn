<!doctype html>
<!--
  THROWAWAY PROTOTYPE for the design checkpoint in setup/transcript-reader/DESIGN.md.
  build_prototype.py fills the payload slot below with private transcript text, so the built
  page lives in the gitignored out/ folder. No remote requests or fonts; served by the
  reader's own server (setup/transcript-reader/serve.sh), it calls only that local server
  (live.js) to refresh, follow Herdr's focus and send a reply to a pane.
  The hosted copy's shell (sync.py --build-only) is this page with no payload: it loads its
  own folder's index.json, then one conversation or document at a time (hosted.js), and only reads.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src '__SCRIPT_HASH__'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="reader-token" content="__READER_TOKEN__">
<meta name="template" content="__TEMPLATE_HASH__">
<title>Transcript reader (prototype)</title>
<style>
  :root {
    color-scheme: light dark;
    --ink: #1d2433; --muted: #5d6779; --faint: #8b93a3; --line: #dfe3ea; --paper: #ffffff; --wash: #f4f5f8;
    --you: #1f5fd1; --you-wash: #e9f0fd; --mate: #6b3fc4; --mate-wash: #f1ecfb;
    --ask: #8a5a00; --ask-wash: #fff3d6; --ask-line: #f0c45c; --ok: #2f6b45; --ok-wash: #e8f3ec;
    --open: #b4232d; --code: #f1f3f6;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e7e9ee; --muted: #a3aab8; --faint: #7b8394; --line: #343a46; --paper: #1b1f27; --wash: #12151b;
      --you: #8db4ff; --you-wash: #1d2a44; --mate: #c3a6ff; --mate-wash: #2a2340;
      --ask: #ffd27a; --ask-wash: #3a2f15; --ask-line: #a3802e; --ok: #8fd3a8; --ok-wash: #1b3024;
      --open: #ff8a8a; --code: #252a34;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--wash); color: var(--ink); font: 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--you); overflow-wrap: anywhere; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
  .bar-inner { max-width: 27rem; margin: 0 auto; padding: 8px 12px; }
  .wide .bar-inner { max-width: 44rem; }
  .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
  .to-sheet { margin-left: auto; font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .to-sheet .short { display: none; }
  /* At phone width the title row also holds the search button, and folded to one line the session picker needs the room too: the link is short. */
  @media (max-width: 440px) { .to-sheet .long { display: none; } .to-sheet .short { display: inline; } }
  .bar-toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 30px; height: 28px; padding: 0; color: var(--muted); flex: none; display: grid; place-items: center; }
  /* A chevron drawn with borders: up while the controls show, down once they are hidden. */
  .bar-toggle::before { content: ""; width: 7px; height: 7px; border: solid currentColor; border-width: 2px 0 0 2px; transform: translateY(2px) rotate(45deg); }
  .bar.collapsed .bar-toggle::before { transform: translateY(-2px) rotate(225deg); }
  /* Follow Herdr, kept in reach when the header is folded to one line (the same switch as the one in the controls). */
  .follow-quick { display: none; flex: none; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; height: 28px; padding: 0 9px; font-size: 13px; color: var(--muted); }
  .bar.collapsed .follow-quick:not([hidden]) { display: block; }
  .follow-quick[aria-pressed="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); font-weight: 600; }
  .follow-quick:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .crumb { display: none; flex: 1 1 auto; min-width: 0; border: 0; background: none; padding: 0; text-align: left; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { white-space: nowrap; }
  .bar.collapsed .name, .bar.collapsed .proto, .bar.collapsed #bar-more { display: none; }
  /* The tab title already says prototype; at phone width the badge would push the title onto two lines. */
  @media (max-width: 440px) { .proto { display: none; } }
  .bar.collapsed .crumb { display: block; }
  /* Collapsed on a conversation, the one line is a session picker instead of a plain name. */
  .crumb-session { display: none; flex: 1 1 auto; min-width: 0; max-width: 100%; height: 28px; font: inherit; font-size: 14px; font-weight: 600; padding: 2px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-overflow: ellipsis; }
  .bar.collapsed.pick .crumb { display: none; }
  .bar.collapsed.pick .crumb-session { display: block; }
  .proto { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--open); border: 1px solid currentColor; border-radius: 99px; padding: 1px 6px; }
  .tabs { display: flex; gap: 4px; margin-top: 6px; }
  .tab { flex: 1 1 auto; white-space: nowrap; border: 1px solid var(--line); background: var(--wash); border-radius: 8px; padding: 5px 8px; font-size: 14px; }
  .tab[aria-selected="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .controls select { flex: 1 1 100%; min-width: 0; max-width: 100%; font: inherit; font-size: 14px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px 9px; font-size: 13px; }
  .btn[aria-pressed="true"] { background: var(--ask-wash); border-color: var(--ask-line); }
  .btn:focus-visible, .tab:focus-visible, .fold:focus-visible, .bar-toggle:focus-visible, .crumb:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .summary { font-size: 12px; color: var(--muted); margin-top: 4px; }
  /* The hosted copy says when the laptop built it, and says so louder once that is old. */
  .asof { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .asof span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asof.stale span { color: var(--ask); font-weight: 600; }
  .asof button { flex: none; border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; }
  .asof span { font-variant-numeric: tabular-nums; }
  .asof button.sync { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 1px 9px; color: var(--ink); text-decoration: none; }
  .asof button.sync:disabled { opacity: .6; cursor: default; }
  .asof button.sync:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  /* A sealed copy asks for its passphrase before anything else; the tabs wait until it opens. */
  .locked #bar-more, .locked .bar-toggle { display: none; }
  main { max-width: 27rem; margin: 0 auto; padding: 10px 12px 80px; }
  .wide main { max-width: 44rem; }

  /* View A: conversation reader */
  .divider { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); margin: 14px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .input { margin: 18px 0 6px; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .input.captain { background: var(--you-wash); border: 1px solid color-mix(in srgb, var(--you) 30%, transparent); margin-left: 2.2rem; }
  .input.firstmate { background: var(--mate-wash); border: 1px solid color-mix(in srgb, var(--mate) 30%, transparent); margin-right: 1.2rem; }
  .input.peer { background: var(--wash); border: 1px solid var(--line); margin-right: 1.2rem; }
  .who { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 12px; color: var(--muted); margin-bottom: 2px; white-space: normal; }
  .who > b, .who > span, .who > button { white-space: nowrap; }
  .who > span.note { white-space: normal; flex: 1 1 12ch; min-width: 0; }
  .wake-who { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who b { color: var(--ink); }
  .input.captain .who b { color: var(--you); }
  .input.firstmate .who b { color: var(--mate); }
  .clip { max-height: 13.5em; overflow: hidden; position: relative; }
  .clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em; background: linear-gradient(transparent, var(--paper)); }
  .input .clip::after { background: none; }
  .more { border: 0; background: none; color: var(--you); padding: 2px 0; font-size: 13px; }
  .reply { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 6px 0 4px; overflow-wrap: anywhere; }
  .reply.needs { border-left: 4px solid var(--ask-line); }
  .chip { display: inline-block; white-space: nowrap; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
  .chip.needs { background: var(--ask-wash); color: var(--ask); }
  .chip.none { background: var(--ok-wash); color: var(--ok); }
  .chip.reminder { background: var(--code); color: var(--muted); font-weight: 600; }
  .chip.open { background: color-mix(in srgb, var(--open) 15%, transparent); color: var(--open); }
  .asks { background: var(--ask-wash); border-radius: 8px; padding: 6px 9px; margin: 6px 0; font-size: 15px; }
  .asks div + div { margin-top: 4px; }
  .asks code, .input code { font: 13px var(--mono); background: color-mix(in srgb, var(--code) 70%, transparent); border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }
  .md p { margin: 0 0 .55em; }
  .md .li { padding-left: 1.1em; text-indent: -.8em; margin: 0 0 .25em; }
  .md .li.l2 { padding-left: 2.1em; }
  .md h4 { margin: .6em 0 .3em; font-size: 15px; }
  .md .ask { background: var(--ask-wash); box-shadow: -4px 0 0 var(--ask-wash), 4px 0 0 var(--ask-wash); border-radius: 3px; }
  .md .reminder { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .md code { font: 13px var(--mono); background: var(--code); border-radius: 4px; padding: 0 3px; overflow-wrap: anywhere; }
  .md pre { font: 12px/1.45 var(--mono); background: var(--code); border-radius: 6px; padding: 7px 9px; overflow-x: auto; white-space: pre; margin: 0 0 .55em; }
  .md i { font-style: italic; }
  .md .local-link { text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .md .li + p, .md .li + .codebox, .md .li + .table-wrap { margin-top: .55em; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: .8em 0; }
  .md .quote { border-left: 3px solid var(--line); padding-left: 9px; color: var(--muted); margin: 0 0 .3em; }
  .codebox { position: relative; margin: 0 0 .55em; }
  /* Wrapped, not scrolled sideways, so a whole command shows at once and stays clear of Copy. */
  .codebox pre { margin: 0; padding-right: 4.4rem; min-height: 2.2rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .code-label { position: absolute; left: 9px; top: -7px; font: 10px var(--sans); color: var(--faint); background: var(--paper); border-radius: 4px; padding: 0 4px; }
  .copy { position: absolute; top: 4px; right: 4px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 6px; padding: 1px 8px; font-size: 12px; user-select: none; -webkit-user-select: none; }
  .copy::before { content: attr(data-label); }
  .copy:hover { color: var(--you); border-color: var(--you); }
  .table-wrap { overflow-x: auto; margin: 0 0 .7em; border: 1px solid var(--line); border-radius: 8px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.4; }
  .md th, .md td { text-align: left; vertical-align: top; padding: 5px 8px; border-top: 1px solid var(--line); min-width: 5.5rem; }
  .md th { background: var(--wash); border-top: 0; font-weight: 650; white-space: nowrap; }
  .md td:first-child, .md th:first-child { min-width: 2.5rem; }
  .md tr.ask td { background: var(--ask-wash); }
  .doc-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .doc-chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--you); background: var(--you-wash); color: var(--you); border-radius: 8px; padding: 3px 10px; font-size: 13px; font-weight: 600; max-width: 100%; }
  .doc-chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc-icon { font-weight: 400; }

  /* Documents: a file a message names, beside its contents list */
  .docmode .bar-inner, .docmode main { max-width: 76rem; }
  .docview { display: block; }
  .toc { position: sticky; top: var(--bar-h, 120px); z-index: 3; background: var(--wash); margin: 0 0 10px; }
  .toc summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 6px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
  .toc nav { display: flex; flex-direction: column; max-height: 60vh; overflow-y: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; padding: 6px 0; }
  .toc a { color: var(--muted); text-decoration: none; font-size: 13px; line-height: 1.35; padding: 4px 10px; border-left: 3px solid transparent; overflow-wrap: anywhere; }
  .toc a:hover { color: var(--ink); background: var(--wash); }
  .toc a[aria-current="true"] { color: var(--you); border-left-color: var(--you); background: var(--you-wash); font-weight: 600; }
  .toc .toc-l1 { padding-left: 22px; }
  .toc .toc-l2 { padding-left: 34px; font-size: 12px; }
  .doc-body { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; overflow-wrap: anywhere; }
  #main > [id^="ex-"] { scroll-margin-top: calc(var(--bar-h, 120px) + 8px); }
  .doc-md h1, .doc-md h2, .doc-md h3, .doc-md h4, .doc-md h5, .doc-md h6 { scroll-margin-top: calc(var(--bar-h, 120px) + 12px); line-height: 1.3; margin: 1.1em 0 .45em; }
  .doc-md > :first-child { margin-top: 0; }
  .doc-md h1 { font-size: 24px; }
  .doc-md h2 { font-size: 20px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .doc-md h3 { font-size: 17px; }
  .doc-md h4, .doc-md h5, .doc-md h6 { font-size: 15px; }
  .doc-md .li.l3 { padding-left: 3.1em; }
  @media (min-width: 820px) {
    .docview { display: grid; grid-template-columns: minmax(13rem, 17rem) minmax(0, 1fr); gap: 16px; align-items: start; }
    .toc { margin: 0; background: none; }
    .toc summary { display: none; }
    .toc nav { margin: 0; max-height: calc(100vh - var(--bar-h, 120px) - 24px); }
  }
  .btn.sheet { display: inline-block; margin: 6px 0 2px; text-decoration: none; color: var(--you); border-color: var(--you); font-weight: 600; }
  .notes { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .notes button { border: 0; background: none; color: var(--muted); padding: 0; text-decoration: underline; font-size: 12px; }
  .note-body { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; margin: 4px 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .fold { display: flex; width: 100%; gap: 6px; align-items: baseline; text-align: left; border: 0; border-top: 1px dashed var(--line); background: none; padding: 5px 2px; font-size: 13px; color: var(--muted); }
  .fold .t { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
  .fold .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .foldrun { margin: 8px 0; }
  .is-target { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--you); } to { box-shadow: 0 0 0 0 transparent; } }

  /* View B: fleet timeline */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-bottom: 12px; }
  .panel h3 { font-size: 14px; margin: 0 0 4px; }
  .panel summary { cursor: pointer; font-size: 14px; }
  .waiting-item { font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); }
  .waiting-item small { color: var(--muted); }
  .day { position: sticky; top: var(--bar-h, 120px); z-index: 2; background: var(--wash); font-size: 12px; font-weight: 700; color: var(--muted); padding: 6px 0 3px; }
  .gap { font-size: 11px; color: var(--faint); padding: 2px 0 2px 3.6rem; }
  .ev { display: grid; grid-template-columns: 3.2rem 1fr; gap: 0 .4rem; padding: 6px 0; border-top: 1px solid var(--line); }
  .ev .t { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .ev.is-open { box-shadow: inset 3px 0 0 var(--open); padding-left: 6px; }
  .route { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .actor { font-weight: 600; color: var(--ink); }
  .actor.you { color: var(--you); }
  .state { font-size: 11px; font-weight: 700; border-radius: 99px; padding: 0 6px; background: var(--code); color: var(--muted); }
  .state.ask { background: var(--ask-wash); color: var(--ask); }
  .state.done { background: var(--ok-wash); color: var(--ok); }
  .state.you { background: var(--you-wash); color: var(--you); }
  .ev .text { font-size: 14px; overflow-wrap: anywhere; cursor: pointer; }
  .ev .text.collapsed { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ev .detail { grid-column: 2; margin-top: 4px; }
  .filters { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }

  /* Replying to a reply: the Reply button, the selection button and the composer */
  .reply-to { margin-left: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--you); }
  /* Pin: on a message and on a reply, then the list of pins in the header. */
  .pin { margin-left: auto; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .pin + .reply-to { margin-left: 0; }
  .pin[aria-pressed="true"] { background: var(--ask-wash); border-color: var(--ask-line); color: var(--ask); font-weight: 600; }
  .pin:focus-visible, .pin-item:focus-visible, .pin-x:focus-visible, .reply-to:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  #pins-panel { flex: 1 1 100%; min-width: 0; }
  .pins { margin-top: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 6px 8px; }
  .pins-scope { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pins-scope .where { margin-left: auto; font-size: 11px; color: var(--faint); }
  .pins-list { list-style: none; margin: 6px 0 0; padding: 0; max-height: min(38vh, 22rem); overflow-y: auto; overscroll-behavior: contain; }
  .pins-list li { display: flex; gap: 4px; align-items: flex-start; border-top: 1px solid var(--line); }
  .pin-item { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 6px 2px; }
  .pin-meta { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pin-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; }
  .pin-item.gone .pin-text { color: var(--muted); font-style: italic; }
  .pin-x { flex: none; border: 0; background: none; color: var(--muted); font-size: 12px; padding: 8px 6px; text-decoration: underline; }
  .pins-note { font-size: 12px; color: var(--muted); padding: 6px 2px 2px; }
  .reply.is-target-reply { box-shadow: 0 0 0 2px var(--you); }
  .live { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .live.on { color: var(--ok); }
  .follow-note { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .kept-note { font-size: 12px; margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
  .kept-note .btn { margin-left: 4px; padding: 2px 8px; font-size: 12px; }
  .float-comment { position: absolute; z-index: 7; border: 1px solid var(--you); background: var(--you); color: var(--paper); border-radius: 99px; padding: 3px 11px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -2px 10px rgb(0 0 0 / .08); padding-bottom: env(safe-area-inset-bottom); }
  .dock-inner { max-width: 27rem; margin: 0 auto; padding: 6px 12px 8px; }
  .docmode .dock-inner { max-width: 76rem; }
  .dock-chip { border: 1px solid color-mix(in srgb, var(--you) 35%, transparent); background: var(--you-wash); border-radius: 8px; padding: 5px 8px; margin-bottom: 5px; }
  .dock-head { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--muted); }
  .dock-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-head button, .dock-passage button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 13px; }
  .dock-passage { display: flex; gap: 6px; align-items: baseline; font-size: 13px; color: var(--muted); border-left: 3px solid var(--ask-line); padding-left: 7px; margin-top: 5px; }
  .dock-passage span { flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dock-label { font-size: 11px; color: var(--faint); margin-top: 4px; }
  .dock-fold { display: inline; font: inherit; color: var(--you); background: none; border: 0; padding: 0; margin: 0 4px 0 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .dock-line { font: 12px/1.4 var(--mono); background: var(--paper); border-radius: 6px; padding: 4px 7px; overflow-wrap: anywhere; white-space: pre-wrap; max-height: 4.2em; overflow-y: auto; }
  .dock-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .dock-acts { display: flex; gap: 8px; align-items: baseline; min-height: 20px; }
  .dock-acts .why { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-acts .why.bad { color: var(--open); white-space: normal; }
  .dock-acts .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dock-acts .count.bad { color: var(--open); font-weight: 600; }
  .dock-acts button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
  .dock-worker { font-size: 12px; color: var(--ask); }
  .dock-row { display: flex; gap: 6px; align-items: flex-end; margin-top: 4px; }
  /* 16px keeps a phone from zooming in when the box is tapped. */
  .dock textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; background: var(--paper); color: var(--ink); font: 16px/1.4 var(--sans); resize: none; overflow-y: auto; }
  .dock textarea:focus { outline: 2px solid var(--you); outline-offset: -1px; }
  .dock textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dock-row button { background: var(--you); border: 1px solid var(--you); color: var(--paper); font-weight: 600; border-radius: 10px; padding: 7px 14px; font-size: 14px; white-space: nowrap; }
  .dock-row button.alt { background: var(--paper); color: var(--you); padding: 7px 10px; }
  .dock-batch { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; margin-bottom: 5px; }
  .dock-batch .dock-head button:first-child { flex: 1; min-width: 0; text-align: left; color: var(--ink); font-weight: 600; }
  .dock-batch ol { list-style: none; margin: 3px 0 0; padding: 0; max-height: 28vh; overflow-y: auto; }
  .dock-batch li { display: flex; gap: 6px; align-items: baseline; font-size: 13px; padding: 4px 0; border-top: 1px solid var(--line); }
  .dock-batch .n { color: var(--faint); font-variant-numeric: tabular-nums; }
  .dock-batch .what { flex: 1; min-width: 0; }
  .dock-batch .what small { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock-batch .what span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .dock-batch li button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
  /* The whole message a batch sends, on demand: numbering, every pointer and comment in full. */
  .dock-preview { margin: 0 0 5px; max-height: 30vh; overflow-y: auto; }
  .dock-preview .dock-line { max-height: none; overflow: visible; border: 1px solid var(--line); }
  @media (max-width: 440px) { .dock-batch ol { max-height: 18vh; } }
  .dock button:disabled { opacity: .45; cursor: default; }
  .input.pending { opacity: .6; border-style: dashed; }
  .input.pending.refused { opacity: 1; border-color: var(--open); }
  .new-reply { position: fixed; left: 50%; transform: translateX(-50%); z-index: 6; border: 1px solid var(--you); background: var(--you); color: var(--paper); border-radius: 99px; padding: 4px 13px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }

  /* Search: the button in the title row, the row under it and the list of matches. Opening it folds the tabs and controls,
     as the folded header already does, so on a phone the row and the list have the screen. */
  .search-toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; width: 30px; height: 28px; padding: 0; color: var(--muted); flex: none; display: grid; place-items: center; }
  .search-toggle[aria-expanded="true"] { background: var(--you-wash); border-color: var(--you); color: var(--you); }
  .search-toggle:focus-visible, .search-row button:focus-visible, .search-chips .btn:focus-visible, .hit:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  .locked .search-toggle, .locked .search { display: none; }
  .search { margin-top: 6px; }
  .search-row { display: flex; gap: 6px; align-items: center; }
  /* 16px keeps a phone from zooming in when the box is tapped. */
  .search-row input { flex: 1 1 auto; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px; background: var(--paper); color: var(--ink); font: 16px/1.3 var(--sans); }
  .search-row input:focus { outline: 2px solid var(--you); outline-offset: -1px; }
  .search-count { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .search-row button { flex: none; height: 30px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 0 8px; font-size: 13px; color: var(--ink); }
  .search-row button[aria-pressed="true"] { background: var(--ask-wash); border-color: var(--ask-line); }
  .search-row button:disabled { opacity: .45; cursor: default; }
  .search-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; align-items: center; }
  .search-chips .btn { font-size: 12px; padding: 3px 7px; }
  .search-chips .brk { flex-basis: 100%; height: 0; }
  @media (max-width: 440px) { .search-chips .long { display: none; } .bar.searching .asof { display: none; } }
  .search-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .search-results { margin-top: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); max-height: min(58vh, 32rem); overflow-y: auto; overscroll-behavior: contain; }
  .hit-group { position: sticky; top: 0; display: flex; gap: 6px; background: var(--wash); border-bottom: 1px solid var(--line); padding: 3px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .hit-group span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; padding: 6px 9px; }
  .hit-group + .hit { border-top: 0; }
  .hit[aria-current="true"] { background: var(--you-wash); }
  .hit-meta { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: baseline; font-size: 12px; color: var(--muted); }
  .hit-meta b { color: var(--ink); }
  .hit-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; font-size: 14px; }
  .hit-text mark { background: var(--hit); color: inherit; border-radius: 2px; }
  .hit-more { padding: 6px 9px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  /* Where the words are on the page. The page's own text is never rewrapped: these are ranges over it. */
  :root { --hit: #ffe066; }
  @media (prefers-color-scheme: dark) { :root { --hit: #6b5a12; } }
  ::highlight(find-hit) { background-color: #ffe066; color: #1d2433; }
  ::highlight(find-current) { background-color: #ff9632; color: #1d2433; }
  @media (prefers-color-scheme: dark) { ::highlight(find-hit) { background-color: #6b5a12; color: #ffffff; } ::highlight(find-current) { background-color: #c2641a; color: #ffffff; } }
</style>
</head>

<header class="bar" id="bar">
  <div class="bar-inner">
    <div class="title"><span class="name">Transcript reader</span><span class="proto">prototype</span><button class="crumb" id="crumb" type="button"></button><select class="crumb-session" id="crumb-session" aria-label="Session"></select><span class="live" id="live"></span><a class="to-sheet" href="questionnaire.html" title="Answer sheet"><span class="long">Answer sheet</span><span class="short">Sheet</span> →</a><button class="follow-quick" id="follow-quick" type="button" hidden>Follow</button><button class="search-toggle" id="search-toggle" type="button" aria-controls="search" aria-expanded="false" aria-label="Search" title="Search this conversation or all of them (/ or Cmd/Ctrl+F)" hidden><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 10l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="bar-toggle" id="bar-toggle" type="button" aria-controls="bar-more"></button></div>

<main id="main"></main>

<div class="dock" id="dock" hidden><div class="dock-inner">
  <div class="dock-batch" id="dock-batch" hidden>
    <div class="dock-head"><button id="dock-batch-toggle" type="button" aria-expanded="true" aria-controls="dock-batch-list"></button><button id="dock-batch-clear" type="button" title="Remove every comment from the batch">Clear all</button></div>
    <ol id="dock-batch-list"></ol>

    <div class="dock-head"><span id="dock-chip-title"></span><button id="dock-chip-drop" type="button" aria-label="Remove the pointer" title="Send a plain message instead (Esc)">✕</button></div>

  </div>

  <div class="dock-row"><textarea id="dock-text" rows="1" placeholder="Message" aria-label="Message"></textarea><button class="alt" id="dock-add" type="button" title="Add to the batch and write the next comment (Cmd+Enter or Ctrl+Enter)">Add</button><button id="dock-send" type="button" title="Send to the session's Herdr pane (Enter; Shift+Enter for a new line)">Send</button></div>
</div></div>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(() => {
  "use strict";
  // The hosted copy's shell has no payload: it loads index.json, then what the view needs. It has no
  // Follow, Reopen or Close; its message bar queues a send (hosted.enqueue) for the laptop's sync to
  // deliver when it is awake, and shows what the laptop answered.
  const HOSTED = "__MODE__" === "hosted";
/*__LIVE__*/
/*__HOSTED__*/
  // What needs the local server: refreshing, following Herdr, sending, reopening and closing.
  const canLive = live.served && !HOSTED;
/*__PINS__*/
/*__PICKER__*/
/*__FIND__*/
  // The hosted shell starts empty until its index.json arrives.
  let data = HOSTED ? hosted.data({}, null) : JSON.parse(document.getElementById("payload").textContent);
  const $ = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  let detailCount = 0;
  // What hides text on screen, each with its own opener, so a pin or a search match opens only what hides it, in place,
  // and never redraws the conversation: a run of folded wake-ups, a folded wake-up, a clipped message or reply, working
  // notes. Keyed like state.open (the key a click on the button adds), and filled again by each render.
  // { open(), close(), shown() }
  const reveals = new Map();
  // open: what the reader expanded (long replies, folded wake-ups, working notes), so a refresh keeps it.
  const state = { view: "reader", session: 0, showWakes: false, open: new Set(), fleetHome: "all", hideRoutine: true, openOnly: false, follow: true, barOpen: true, pinsOpen: false, pinsScope: "here" };
  try { state.follow = localStorage.getItem("tr-follow") !== "0"; } catch (e) { /* default: follow */ }
  try { state.barOpen = localStorage.getItem("tr-bar") !== "0"; } catch (e) { /* default: open */ }
  const homeName = id => id === "main" ? "Main" : id === "captain" ? "You" : id.replace(/^secondmate-/, "").replace(/ · \d{4}-\d{2}-\d{2}-/, " · ");
  const fmtTime = s => new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(s * 1000));
  const fmtClock = s => new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).format(new Date(s * 1000));
  const fmtDay = s => new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short" }).format(new Date(s * 1000));
  const fmtShortDay = s => new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short" }).format(new Date(s * 1000));
  const fmtWhen = s => s ? `${fmtDay(s)} ${fmtTime(s)}` : "";
  // When the hosted copy was built: the time alone today, with the day before that.
  const builtAt = s => fmtShortDay(s) === fmtShortDay(Date.now() / 1000) ? fmtTime(s) : fmtWhen(s);

  // ---------------------------------------------------------------- tiny safe markdown
  // Transcripts and documents carry text from outside (pages, Slack, tool output), so every
  // quote is escaped too: an escaped URL can never close the href attribute it is placed in.
  const esc = text => text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  function inline(text) {
    return text.split(/(`[^`]+`)/).map((part, i) => i % 2 ? `<code>${esc(part.slice(1, -1))}</code>` : esc(part)
      .replace(/\[([^\]]+)\]\(([^\s)]+)\)|(https?:\/\/[^\s<>)]*[^\s<>).,;:!?])/g, (m, label, href, bare) =>
        // A link to a local file cannot open from here: its words stay, its target shows on hover.
        href && !/^https?:\/\//.test(href) ? `<span class="local-link" title="${href}">${label}</span>`
          : `<a href="${href || bare}" target="_blank" rel="noopener noreferrer">${label || bare}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[\s(])[*_]([^*_\s][^*_]*?)[*_](?=$|[\s).,;:!?])/g, "$1<i>$2</i>")).join("");
  }
  // A code block in a box with a Copy button. The button's label is drawn by CSS, so
  // selecting the code never picks it up.
  function codeBox(label) {
    const wrap = $("div", "codebox"), pre = $("pre"), copy = $("button", "copy");
    copy.type = "button"; copy.dataset.label = "Copy"; copy.setAttribute("aria-label", "Copy");
    copy.title = "Copy this to the clipboard";
    if (label) wrap.append($("span", "code-label", label));
    wrap.append(copy, pre);
    return { wrap, pre, lines: [] };
  }
  const tableCells = line => line.trim().replace(/^\|/, "").replace(/(?<!\\)\|\s*$/, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
  const isTableRule = line => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  function tableNode(rows) {
    const wrap = $("div", "table-wrap"), table = $("table"), thead = $("thead"), tbody = $("tbody");
    const head = rows.length > 1 && isTableRule(rows[1].line);
    rows.forEach((row, i) => {
      if (head && i === 1) return;
      const tr = $("tr", row.mark || null);
      tableCells(row.line).forEach(cell => { const td = $(head && i === 0 ? "th" : "td"); td.innerHTML = inline(cell); tr.append(td); });
      (head && i === 0 ? thead : tbody).append(tr);
    });
    if (head) table.append(thead);
    table.append(tbody); wrap.append(table);
    return wrap;
  }
  // doc: a whole document, with real heading levels (collected in box.headings for its
  // contents list), nested list levels and front matter; a reply keeps small headings.
  function renderMarkdown(text, askLines = [], reminderLines = [], doc = false) {
    const asks = new Set(askLines), reminders = new Set(reminderLines);
    const box = $("div", "md" + (doc ? " doc-md" : ""));
    box.headings = [];
    let para = null, code = null, rows = null;
    const closeCode = () => { code.pre.textContent = code.lines.join("\n"); code = null; };
    const closeTable = () => { if (rows) box.append(tableNode(rows)); rows = null; };
    text.split("\n").forEach((line, n) => {
      const mark = asks.has(n) ? "ask" : reminders.has(n) ? "reminder" : "";
      const fence = line.trimStart().match(/^(```+|~~~+)\s*([\w+#.-]*)/);
      if (code) {
        if (code.until ? line.trim() === code.until : fence && line.trim().startsWith(code.fence)) closeCode(); else code.lines.push(line);
        return;
      }
      if (doc && n === 0 && line.trim() === "---") { code = { ...codeBox("front matter"), until: "---" }; box.append(code.wrap); return; }
      if (fence) { closeTable(); para = null; code = { ...codeBox(fence[2]), fence: fence[1] }; box.append(code.wrap); return; }
      if (line.trimStart().startsWith("|")) { para = null; (rows = rows || []).push({ line, mark }); return; }
      closeTable();
      if (!line.trim()) { para = null; return; }
      const heading = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
      const item = line.match(/^(\s*)(?:([-*+])|(\d+[.)]))\s+(.*)/);
      const quote = line.match(/^\s*>\s?(.*)/);
      let el;
      if (heading) {
        el = $(doc ? "h" + heading[1].length : "h4"); el.innerHTML = inline(heading[2]); para = null;
        if (doc) { el.id = "doc-h-" + n; box.headings.push({ level: heading[1].length, text: el.textContent, el }); }
      } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { el = $("hr"); para = null; }
      else if (quote) { el = $("div", "quote"); el.innerHTML = inline(quote[1]); para = null; }
      else if (item) {
        const depth = item[1].replace(/\t/g, "    ").length;
        el = $("div", "li" + (depth >= 4 && doc ? " l3" : depth >= 2 ? " l2" : ""));
        const check = item[4].match(/^\[([ xX])\]\s+(.*)/);
        const bullet = item[3] ? item[3] + " " : check ? (check[1] === " " ? "☐ " : "☑ ") : "• ";
        el.innerHTML = esc(bullet) + inline(check ? check[2] : item[4]); para = null;
      }
      else if (para) { para.append(document.createElement("br")); const span = $("span", mark); span.innerHTML = inline(line); para.append(span); return; }
      else { el = $("p"); para = el; const span = $("span", mark); span.innerHTML = inline(line); el.append(span); box.append(el); return; }
      if (mark) el.classList.add(mark);
      box.append(el);
    });
    if (code) closeCode();
    closeTable();
    return box;
  }
  function clipped(node, words, limitWords, label, key) {
    const wrap = $("div");
    if (words <= limitWords || state.open.has(key)) { wrap.append(node); return wrap; }
    const inner = $("div", "clip"); inner.append(node); wrap.append(inner);
    const more = $("button", "more", `${label} (${words} words)`);
    const show = () => { inner.classList.remove("clip"); more.remove(); if (key) state.open.add(key); };
    more.addEventListener("click", show);
    wrap.append(more);
    if (key) reveals.set(key, { open: show, close: () => { inner.classList.add("clip"); wrap.append(more); state.open.delete(key); }, shown: () => !inner.classList.contains("clip") });
    return wrap;
  }

  // ---------------------------------------------------------------- View A pieces
  function verdictChip(ex) {
    if (ex.verdict === "needs-you") return $("span", "chip needs", "Needs you");

    if (el) window.scrollBy(0, el.getBoundingClientRect().top - anchor.top); else window.scrollTo(0, anchor.y || 0);
  }
  // Turns are keyed and anchored by position, and a /clear joins the cleared session's turns
  // under a divider at the top, moving every turn down. A conversation's first real turn (a
  // divider shares its time) shows how far they moved, so what was open and the place read
  // can follow them to the conversation's newest id.
  const isDivider = e => e.source === "session" && (e.kind === "cleared" || e.kind === "current");
  const firstTurn = session => { const i = session.exchanges ? session.exchanges.findIndex(e => !isDivider(e)) : -1; return i < 0 ? null : { i, at: session.exchanges[i].at }; };
  function moveTurns(first, fromSid, session, open, anchor) {
    const j = first ? session.exchanges.findIndex(e => !isDivider(e) && e.at === first.at) : -1;
    const shift = j < 0 ? 0 : j - first.i;
    const keyRe = new RegExp("^" + fromSid + ":(\\d+)(.*)$");
    const keys = new Set([...open].map(k => { const m = k.match(keyRe); return m ? `${session.id}:${Number(m[1]) + shift}${m[2]}` : k; }));
    if (anchor && anchor.id) anchor.id = "ex-" + (Number(anchor.id.slice(3)) + shift);
    return keys;
  }
  async function refreshData(now = false) {
    const sel = window.getSelection();
    if (!now && sel && !sel.isCollapsed) return;  // a passage is being picked; refresh on a later tick
    const html = await live.page(location.pathname.split("/").pop());
    const next = new DOMParser().parseFromString(html, "text/html");
    const template = doc => (doc.querySelector('meta[name="template"]') || {}).content;
    // A different template hash means the page's own code or styles changed: load it fresh.
    if (template(next) !== template(document)) { location.reload(); return; }
    const payload = JSON.parse(next.getElementById("payload").textContent);
    if (payload.generated <= data.generated) return;
    applyPayload(payload);
  }
  // A newer build in place of the one on screen, keeping the conversation read, what was open and the place.
  function applyPayload(payload) {
    const sid = data.sessions[state.session] && data.sessions[state.session].id;
    const mark = s => s ? `${s.exchanges.length}:${(s.exchanges[s.exchanges.length - 1] || {}).reply_words || 0}` : "";
    const before = mark(data.sessions[state.session]);
    const anchor = readingAnchor();
    const barHeight = document.getElementById("bar").offsetHeight;
    const first = data.sessions[state.session] ? firstTurn(data.sessions[state.session]) : null;
    const reading = data.sessions[state.session];
    const builtAt = data.generated;
    data = payload;
    let index = data.sessions.findIndex(s => (s.ids || [s.id]).includes(sid));
    // A session closed by hand leaves the page instead.
    if (index < 0 && reading && !(link.closing && (reading.ids || [reading.id]).includes(link.closing))) {
      // The conversation on screen is no longer on the reading list (its Herdr pane closed).
      // It stays on screen, as it was, with a notice and Send off, rather than moving the page to
      // another conversation and the bar to another pane; it leaves when another one is picked.
      index = Math.min(state.session, data.sessions.length);
      data.sessions.splice(index, 0, { ...reading, kept: reading.kept || builtAt, reopened: false, pane: reading.pane && { ...reading.pane, live: false } });
    }
    state.session = index >= 0 ? index : 0;
    if (index >= 0 && data.sessions[index].id !== sid) {  // a /clear gave the conversation a newer session
      state.open = moveTurns(first, sid, data.sessions[index], state.open, anchor);
      setAddress();
    }
    render();
    if (anchor.top != null) anchor.top += document.getElementById("bar").offsetHeight - barHeight;  // a taller header must not cover the turn being read
    restoreAnchor(anchor);
    if (state.view === "reader" && !anchor.bottom && index >= 0 && mark(data.sessions[state.session]) !== before) { link.newer = true; placeNewReply(); }
  }
  // Switch to the session Herdr focused, once per focus change. An address that names a
  // session (#s=...) wins over the focus found when the page opens.
  function applyFocus() {
    const f = link.focus;
    if (!state.follow || !f) { link.held = null; return; }
    if (f.seq !== link.seenSeq) {
      const keep = link.first && link.keepOpening;
      link.seenSeq = f.seq;
      if (!keep) link.want = f.session_id;
    }
    link.first = false;
    if (!link.want) return;
    const index = data.sessions.findIndex(s => (s.ids || [s.id]).includes(link.want));
    if (index < 0) return;  // the server adds it; the next refresh brings it in
    // A message being written stays with its session: the switch waits until the box is
    // left or emptied, so the next Enter cannot go to the pane Herdr moved to.
    link.held = index !== state.session && (writing() || look.open) ? f.label : null;
    if (link.held) { renderDock(); return; }
    link.want = null;
    if (index === state.session && state.view !== "fleet") return;  // reading its conversation or a document already
    state.session = index; state.view = "reader";
    setAddress();
    render();
    showLatest();
  }
  const writing = () => document.activeElement === dock("text") && Boolean(dockTyped());
  // What the server answered about Herdr and the build, from the poll or from Sync.
  function takeState(s) {
    link.panes = s.panes || {}; link.focus = s.focus; link.build = s.build;
    link.syncedAt = Date.now() / 1000; link.syncFail = null;
    pins.refresh(s.stamps && s.stamps.pins);
  }
  // The server (or the hosted copy's folder) stopped answering: after a few seconds the page says so, with since when.
  const syncFailing = () => Boolean(link.syncFail) && Date.now() - link.syncFail.since > 8000;
  function noteSyncFail(e) {
    link.syncFail = link.syncFail || { since: Date.now(), message: e.message };
    if (syncFailing()) { renderLive(); paintSync(); }
  }
  if (!HOSTED) live.poll(async () => {
    let s;
    try { s = await live.state(state.follow); } catch (e) { noteSyncFail(e); throw e; }
    takeState(s);
    markRead();
    labelSessions();
    if (s.stamps && s.stamps.reader && s.stamps.reader > data.generated) await refreshData();
    applyFocus();
    renderLive();
    paintSync();
  });
  // The Sync button: take everything again now, not at the next poll. The local page asks the server to read
  // Herdr again and rebuild from the session logs and the fleet records (all read-only; it writes only out/),
  // then swaps in the list (a live Claude pane not yet on it is added first), each session's live or ended state and
  // every listed session's newest turns, keeping the place in the conversation you are reading. The hosted copy cannot make the laptop build: it reads the newest copy the laptop wrote.
  async function syncNow() {
    if (link.syncing || !(canLive || HOSTED)) return;
    link.syncing = true; link.listing = null; paintSync(); renderLive();
    try {
      if (HOSTED) await refreshHosted(true);
      else {
        let answer;
        try { answer = await live.sync(state.follow); } catch (e) {
          if (e.status !== 404) throw e;
          // A server started before this page's code has no Sync route: read what it does offer.
          answer = await live.state(state.follow);
          link.listing = { text: "This server has no Sync yet (restart it: serve.sh restart). Read what it can." };
        }
        takeState(answer);
        await refreshData(true);
        markRead(); labelSessions(); applyFocus();
      }
    } catch (e) {
      link.listing = { text: `Sync failed: ${e.message}` };
    } finally { link.syncing = false; paintSync(); renderLive(); }
  }
  document.getElementById("sync").addEventListener("click", syncNow);

  // ---------------------------------------------------------------- hosted copy: load what the view needs
  // Whether the view on screen needs an object not loaded yet: the conversation, its document or
  // the fleet records. Never on the local page, whose payload holds everything.
  function missing() {
    if (!HOSTED) return false;
    if (state.view === "fleet") return !data.fleet;
    const session = data.sessions[state.session];
    if (!session) return false;
    if (!session.exchanges) return true;
    const id = state.view === "doc" ? pickDoc(session) : null;
    return Boolean(id && data.documents[id].text == null);
  }
  async function ensure() {
    if (state.view === "fleet") { await hosted.fleet(data); return; }
    const session = data.sessions[state.session];
    if (!session) return;
    await hosted.conversation(session);
    const id = state.view === "doc" ? pickDoc(session) : null;
    if (id) await hosted.documentText(data.documents[id]);
  }
  // Runs show once the view has what it needs: at once when it has (always on the local page).
  function whenReady(show) {
    if (!missing()) { show(); return; }
    document.getElementById("main").replaceChildren($("div", "empty", "Loading…"));
    ensure().then(show, e => document.getElementById("main").replaceChildren($("div", "empty", `Could not load this: ${e.message}`)));
  }
  // The line under the title, in both copies: when this page last heard from where it reads (the local server, or the
  // hosted copy's folder), and the Sync button. The hosted copy also says when the laptop built what it holds, and
  // says so louder once that is older than the sync's heartbeat.
  function paintSync() {
    const line = document.getElementById("asof"), text = document.getElementById("asof-text"), button = document.getElementById("sync");
    line.hidden = HOSTED ? !data.generated : !canLive;
    if (line.hidden) return;
    const when = data.generated, synced = link.syncedAt ? `synced ${fmtClock(link.syncedAt)}` : "not synced yet";
    button.disabled = Boolean(link.syncing);
    button.textContent = link.syncing ? "Syncing…" : "Sync";
    if (HOSTED) {
      const old = hosted.stale(when), at = builtAt(when);
      const failing = syncFailing();
      line.classList.toggle("stale", old || failing || Boolean(hosted.outdated()));
      text.setAttribute("aria-live", "polite");
      text.textContent = (failing ? `Not syncing since ${fmtClock(link.syncFail.since / 1000)}: ${link.syncFail.message}`
        : hosted.outdated() || (old ? `Laptop asleep or not syncing since ${at}` : `As of ${at}`)) + (failing ? "" : ` · ${synced}`);
      text.title = `The laptop built this copy at ${fmtWhen(when)}; Herdr states are as of then. ${synced}: when this page last read the copy.`;
      document.getElementById("forget").hidden = !hosted.isSealed();
      return;
    }
    // The text changes with every poll, so it is not announced; the button says when a sync it asked for is under way.
    const failing = syncFailing();
    line.classList.toggle("stale", failing);
    text.setAttribute("aria-live", "off");
    text.textContent = failing ? `Not syncing since ${fmtClock(link.syncFail.since / 1000)}: ${link.syncFail.message}` : `${synced[0].toUpperCase()}${synced.slice(1)}`;
    text.title = `Built ${fmtWhen(when)}. Each sync lists live Claude panes not yet on the list, and reads the session list, each session's live or ended state and every session's newest turns again.`;
  }
  // Every 30 seconds while visible: a newer index brings the new list, and the conversation on
  // screen again when its stamp changed, swapped in where you are reading. New page code reloads.
  async function refreshHosted(now = false) {
    const sel = window.getSelection();
    const next = sel && !sel.isCollapsed && !now ? null : await hosted.index();  // a passage is being picked: later
    if (next) { link.syncedAt = Date.now() / 1000; link.syncFail = null; }
    if (next && next.template !== document.querySelector('meta[name="template"]').content) { hosted.pageChanged(next.template); if (!hosted.outdated()) return; }
    if (next && next.as_of > data.generated) {
      const fresh = hosted.data(next, data);
      const sid = data.sessions[state.session] && data.sessions[state.session].id;
      const reading = fresh.sessions.find(s => (s.ids || [s.id]).includes(sid));
      if (reading) await hosted.conversation(reading);
      const doc = state.view === "doc" && fresh.documents[state.doc];
      if (doc) await hosted.documentText(doc);
      if (state.view === "fleet") await hosted.fleet(fresh);
      applyPayload(fresh);
    }
    paintSync();
    labelSessions();
  }

  // ---------------------------------------------------------------- shell
  // A conversation kept on screen after its pane closed leaves the list once another one is shown.
  function pruneKept() {
    const current = data.sessions[state.session];
    const rest = data.sessions.filter(s => !s.kept || s === current);
    if (rest.length === data.sessions.length) return;
    data.sessions = rest;
    state.session = Math.max(0, rest.indexOf(current));
  }
  function render() {
    if (missing()) { whenReady(render); return; }  // the hosted copy loads first
    pruneKept();
    reveals.clear();
    if (look.open && (state.view !== "reader" || !data.sessions[state.session])) endSearch();  // the search is for the conversation on screen
    document.body.classList.toggle("wide", state.view === "fleet");
    document.body.classList.toggle("docmode", state.view === "doc");
    for (const view of ["reader", "fleet", "doc"]) document.getElementById("tab-" + view).setAttribute("aria-selected", String(state.view === view));
    const docCount = sessionDocuments(data.sessions[state.session]).length;
    document.getElementById("tab-doc").textContent = docCount ? `Documents (${docCount})` : "Documents";
    // The live badge too: a page with no poll to paint it (a file copy, the hosted shell) may open on a document.
    if (state.view === "reader") renderReader(); else { if (state.view === "doc") renderDocView(); else renderFleet(); renderLive(); }
    paintBar();
    refreshSearch();  // the page was drawn again: the query runs on it as it is now
    markRead();
    renderDock();
  }
  // A collapsed bar keeps one line: where you are, the live badge and the way back to the controls.
  function paintBar() {
    const bar = document.getElementById("bar"), toggle = document.getElementById("bar-toggle");
    // While searching, the tabs and controls fold away as in the folded header, so the search row and its list have the screen.
    const folded = !state.barOpen || look.open;
    bar.classList.toggle("collapsed", folded);
    bar.classList.toggle("searching", look.open);
    toggle.setAttribute("aria-expanded", String(!folded));
    toggle.setAttribute("aria-label", look.open ? "Close the search" : state.barOpen ? "Hide the tabs and controls" : "Show the tabs and controls");
    toggle.title = toggle.getAttribute("aria-label");
    const session = data.sessions[state.session];
    const find = document.getElementById("search-toggle");
    find.hidden = state.view !== "reader" || !session;
    find.setAttribute("aria-expanded", String(look.open));
    document.getElementById("search").hidden = !look.open;
    const doc = state.view === "doc" && state.doc && data.documents && data.documents[state.doc];
    const pick = state.view === "reader" && data.sessions.length > 1;
    bar.classList.toggle("pick", pick);
    const quick = document.getElementById("follow-quick");
    quick.hidden = !canLive || state.view !== "reader";
    quick.setAttribute("aria-pressed", String(state.follow));
    quick.title = "Follow Herdr: show the session of the pane Herdr has focused (the same switch as Follow Herdr in the controls)";
    if (pick && folded) fillSessions(document.getElementById("crumb-session"));
    const crumb = document.getElementById("crumb");
    crumb.textContent = state.view === "fleet" ? "Fleet timeline"
      : doc ? `Documents · ${doc.name}` : session ? sessionName(session) : "Conversation";
    crumb.title = `${crumb.textContent} · show the tabs and controls`;
    document.documentElement.style.setProperty("--bar-h", bar.offsetHeight + "px");
  }
  // The search row and its list change the header's height without a call to paintBar.
  if (window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty("--bar-h", document.getElementById("bar").offsetHeight + "px")).observe(document.getElementById("bar"));
  function setBarOpen(open) {
    const anchor = readingAnchor();
    state.barOpen = open;
    try { localStorage.setItem("tr-bar", open ? "1" : "0"); } catch (e) { /* not kept */ }
    paintBar(); restoreAnchor(anchor);
  }
  document.getElementById("bar-toggle").addEventListener("click", () => { if (look.open) closeSearch(); else setBarOpen(!state.barOpen); });
  document.getElementById("crumb").addEventListener("click", () => { if (look.open) closeSearch(); else setBarOpen(true); });
  document.getElementById("crumb-session").addEventListener("change", e => pickSession(e.target.value));
  document.getElementById("tab-reader").addEventListener("click", () => {
    const opening = state.view !== "reader";
    state.view = "reader";
    whenReady(() => { render(); if (opening) showLatest(); });
  });
  document.getElementById("tab-fleet").addEventListener("click", () => { state.view = "fleet"; whenReady(render); });
  document.getElementById("tab-doc").addEventListener("click", () => { state.view = "doc"; setAddress(); whenReady(() => { render(); window.scrollTo(0, 0); }); });
  document.addEventListener("keydown", e => {
    if (["SELECT", "TEXTAREA", "INPUT"].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey || state.view !== "reader") return;
    if (e.key === "j") jump("captain", 1);
    if (e.key === "k") jump("captain", -1);
    if (e.key === "n") jump("needs", 1);
    if (e.key === "w") { state.showWakes = !state.showWakes; render(); }
    if (e.key === "/" && data.sessions[state.session]) { e.preventDefault(); openSearch("here"); }
  });
  const biggest = () => data.sessions.reduce((best, s, i) => s.exchanges.filter(e => e.source === "captain").length > (data.sessions[best]?.exchanges.filter(e => e.source === "captain").length ?? -1) ? i : best, 0);
  // The hosted copy opens on the newest conversation with a reply that waits on you (hosted.waiting),
  // else the newest one (it cannot follow Herdr).
  const waitingFirst = () => Math.max(0, data.sessions.findIndex(s => hosted.waiting(s) > 0));
  // The conversation and view the page opens on; returns what this tab saved before a reload.
  function chooseOpening() {
    const [, wanted, wantedDoc] = location.hash.match(/^#s=([0-9a-f-]+)(?:&d=([0-9a-f]{10}))?$/) || [];
    const fromHash = wanted ? data.sessions.findIndex(s => (s.ids || [s.id]).some(id => id.startsWith(wanted))) : -1;
    // A reload (new page code, a restarted server, or the browser's own) keeps what was
    // expanded and the place being read, in this tab only.
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem("tr-reading") || "null"); } catch (e) { saved = null; }
    // With no address (the answer sheet's "← Reader", or a link without #s=), this tab's
    // last conversation wins over the list's order, which changes whenever a session writes.
    const fromSaved = !wanted && saved && saved.session ? data.sessions.findIndex(s => (s.ids || [s.id]).includes(saved.session)) : -1;
    // A conversation kept on screen after its pane closed is not on the list, so a reload (new page
    // code, a restarted server) or its address would land on another one, with the bar aimed at that
    // pane. A closed pane's conversation is opened again instead, as "Keep it on the reader" does.
    const lost = wanted && fromHash < 0 ? wanted : !wanted && saved && saved.session && fromSaved < 0 ? saved.session : null;
    const closedHere = lost && handClosed.some(id => id.startsWith(lost));
    link.opening = lost && live.served && !HOSTED && !closedHere ? (data.closed || []).find(c => c.id.startsWith(lost)) || null : null;
    if (lost && !link.opening && !closedHere) link.listing = { text: `Session ${lost.slice(0, 8)} is not on the reader any more, so this is another conversation.` };
    state.session = fromHash >= 0 ? fromHash : fromSaved >= 0 ? fromSaved : HOSTED ? waitingFirst() : data.chosen ? 0 : biggest();
    if (wantedDoc && data.documents && data.documents[wantedDoc]) { state.view = "doc"; state.doc = wantedDoc; }
    // The session the page opened on, by address or by this tab, wins over the first Herdr focus.
    // Decided here, before the page writes its own address below.
    link.keepOpening = fromHash >= 0 || fromSaved >= 0;
    return saved;
  }
  function openReading(saved) {
    if (link.opening) { render(); reopenLost(link.opening, saved); return; }
    const opened = data.sessions[state.session];
    const same = saved && opened && (opened.ids || [opened.id]).includes(saved.session);
    if (same) {
      state.open = moveTurns(saved.first, saved.session, opened, saved.open || [], saved.anchor);
      state.showWakes = !!saved.showWakes;
      if (state.view === "reader" && saved.view === "fleet") state.view = "fleet";
    }
    if (state.view === "reader") restoreSearch();
    setAddress();
    render();
    if (same && saved.anchor) restoreAnchor(saved.anchor); else if (state.view === "reader") showLatest();
  }
  if ("scrollRestoration" in history) history.scrollRestoration = "manual";
  window.addEventListener("pagehide", () => {
    saveSearch();
    const session = data.sessions[state.session];
    try { sessionStorage.setItem("tr-reading", JSON.stringify({ session: session && session.id, first: session && firstTurn(session), view: state.view, open: [...state.open], showWakes: state.showWakes, anchor: readingAnchor() })); } catch (e) { /* the reload starts fresh */ }
  });
  pins.load().then(paintPins);
  if (!HOSTED) openReading(chooseOpening());
  else {
    // The shell holds no transcript: a sealed copy is opened first, then the list comes from
    // index.json, then the conversation opened on.
    document.querySelector(".to-sheet").href = "sheet.html";  // the hosted copy's answer sheet
    dock("send").title = "Queue this for the laptop, which sends it to the session's Herdr pane when it is awake and the agent is ready (Enter; Shift+Enter for a new line)";
    document.getElementById("forget").addEventListener("click", () => hosted.forget().then(() => location.reload()));
    hosted.prepare().then(state => state === "locked" ? hosted.askPassphrase() : null).then(() => hosted.index()).then(index => {
      data = hosted.data(index, null);
      link.syncedAt = Date.now() / 1000;
      paintSync();
      const saved = chooseOpening();
      whenReady(() => {
        openReading(saved);
        hosted.poll(async () => {
          try { await refreshHosted(); } catch (e) { noteSyncFail(e); throw e; }
          await checkReceipts();
        });
        setInterval(() => { if (!document.hidden) checkReceipts(); }, 4000);
        checkReceipts();
      });
    }, e => document.getElementById("main").replaceChildren($("div", "empty", `Could not load the transcripts: ${e.message}`)));
  }

  async function reopenLost(closed, saved) {
    try {
      await live.changeList("reopen", closed.id);
      await refreshData(true);
    } catch (e) {
      link.listing = { text: `Could not open ${closed.label} again: ${e.message}. This is another conversation.` };
    }
    link.opening = null;
    const index = data.sessions.findIndex(s => (s.ids || [s.id]).includes(closed.id));
    if (index >= 0) state.session = index;
    const opened = data.sessions[state.session];
    const same = index >= 0 && saved && (opened.ids || [opened.id]).includes(saved.session);
    if (same) state.open = moveTurns(saved.first, saved.session, opened, saved.open || [], saved.anchor);
    setAddress();
    render();
    if (same && saved.anchor) restoreAnchor(saved.anchor); else showLatest();
  }
})();
</script>
</body>
</html>
