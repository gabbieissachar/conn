  <header class="topbar">
    <div class="topline">
      <div><h1>Workspace organizer</h1><p class="subtitle">Check Herdr sessions before a restart, review tabs, and copy commands to run in your terminal</p></div>

    <nav class="view-tabs" aria-label="Organizer views">
      <button class="view-tab" type="button" data-view="restart" aria-selected="true">Restart</button>
      <button class="view-tab" type="button" data-view="workspaces" aria-selected="false">Workspaces</button>
      <button class="view-tab" type="button" data-view="archives" aria-selected="false">Archives</button>
      <button class="view-tab" type="button" data-view="group" aria-selected="false">Archive group</button>
      <button class="view-tab" type="button" data-view="context" aria-selected="false">Context</button>
    </nav>
    <div class="controls" id="snapshot-controls" hidden>
      <input id="search" class="search" type="search" placeholder="Filter workspaces, tabs, or archives" aria-label="Filter organizer data">
      <select id="snapshot-session" class="select" aria-label="Herdr session for the snapshot"></select>
      <button id="reload" type="button">Refresh snapshot</button>
    </div>
  </header>
  <main>
    <section class="move-panel" id="move-panel" aria-live="polite"></section>
    <section id="restart-section" class="view-panel"></section>
    <section id="workspaces-section" hidden>
      <section class="summary" id="summary"></section>
      <div id="archive-all"></div>
      <div id="cleanup-all"></div>
      <div class="section-heading"><h2>Live workspaces</h2><span class="updated" id="updated">No snapshot loaded</span></div>
      <div class="workspaces" id="workspaces"></div>
    </section>
    <section id="group-section" hidden>
      <div id="batches"></div>
    </section>
    <section id="context-section" hidden></section>
    <section id="archives-section" hidden>
      <div class="section-heading"><h2>Archives</h2><span class="updated">Layouts and resumable identities only</span></div>
      <div class="archives" id="archives"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const state = { data: null, query: '', selectedTabs: new Set(), selectedArchivedTabs: new Set(), destinationWorkspace: '', selectedTabsArchive: '', selectedTabsBatch: '', archiveDestinations: {}, groupTabDestinations: {}, selectedTabsAction: 'move', view: 'restart', snapshotSession: '' };
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    const searchText = value => String(value ?? '').toLowerCase();
    const matches = value => !state.query || searchText(value).includes(state.query);
    const copy = async (text, message = 'Command copied') => {
      try { await navigator.clipboard.writeText(text); showToast(message); }
      catch { showToast(message.startsWith('Report') ? 'Could not copy. Select the report text and copy it.' : message.startsWith('Session') ? `Copy this session id: ${text}` : `Copy this command: ${text}`); }
    };
    let toastTimer;
    const showToast = message => { const toast = document.querySelector('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2600); };
    const tabStatuses = statuses => Object.entries(statuses || {}).map(([name, count]) => `<span class="status ${escapeHtml(name)}">${escapeHtml(name)} ${count}</span>`).join('');
    const resumeStatuses = agents => (agents || []).map(agent => {
      const resumable = agent.status === 'resumable';
      const label = resumable ? `${agent.client} resumable` : `${agent.client} needs registration`;
      const detail = resumable
        ? `${agent.pane_id}: verified from ${agent.source}`
        : `${agent.pane_id}: no verified resumable session. Archive and move will stop until it is registered.`;
      return `<span class="status ${resumable ? 'resumable' : 'needs-registration'}" title="${escapeHtml(detail)}">${escapeHtml(label)}</span>`;
    }).join('');
    // A cd command for a working folder. A plain path stays readable, anything else is single-quoted so it cannot run extra commands.
    const shellQuote = value => (/^[A-Za-z0-9_@%+=:,./~-]+$/.test(value) ? value : `'${value.replace(/'/g, `'\\''`)}'`);
    const folderCommand = folder => (typeof folder?.path === 'string' && folder.path.startsWith('/') && !/[\u0000-\u001f\u007f]/.test(folder.path) ? `cd ${shellQuote(folder.path)}` : '');
    // One line per distinct working folder of the tab. When panes differ, each line names its panes.
    const workingFoldersView = tab => {
      const folders = (tab.working_folders || []).filter(folder => folderCommand(folder));
      if (!folders.length) return '<div class="tab-meta">Working folder not reported</div>';
      const labelled = folders.length > 1 || folders.some(folder => folder.source === 'agent_files');
      return folders.map(folder => {
        const command = folderCommand(folder);
        const agent = folder.source === 'agent_files';
        const label = labelled ? `<span class="folder-source${agent ? ' agent' : ''}" title="${agent ? 'Worked out from the files this agent touched most recently in its session log. Herdr only reports the folder the shell started in.' : 'The folder Herdr reports for the pane\'s shell.'}">${agent ? 'agent works in' : 'shell folder'}</span>` : '';
        const panes = Number(tab.pane_count) > 1 ? ` <span class="pane-id">${(folder.pane_ids || []).map(escapeHtml).join(', ')}</span>` : '';
        return `<div class="folder-line">${label}<code class="folder-path" title="${escapeHtml(folder.path)}">${escapeHtml(command)}</code>${panes}<button type="button" class="small-btn" data-command="${escapeHtml(command)}" title="Copies this cd command. Paste it in a terminal to go to this folder.">Copy cd</button></div>`;
      }).join('');
    };
    // One line per agent in the tab whose client session id is verified, with a button that copies the bare id.
    const SESSION_ID_PATTERN = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    const agentSessionsView = tab => (tab.agent_sessions || []).filter(item => SESSION_ID_PATTERN.test(item?.session_id || '')).map(item => {
      const panes = Number(tab.pane_count) > 1 ? ` <span class="pane-id">${escapeHtml(item.pane_id)}</span>` : '';
      return `<div class="folder-line"><span class="folder-source">${escapeHtml(item.client)} session</span><code class="folder-path" title="${escapeHtml(item.session_id)}">${escapeHtml(item.session_id.slice(0, 8))}…</code>${panes}<button type="button" class="small-btn" data-command="${escapeHtml(item.session_id)}" data-copied="Session id copied" title="Copies this agent's full session id.">Copy session id</button></div>`;
    }).join('');
    const tabView = (tab, total) => {
      const before = Math.max(0, Number(tab.index) - 1);
      const after = Math.min(total - 1, Number(tab.index) + 1);
      return `<article class="tab">
        <div class="tab-line"><span class="tab-name">${escapeHtml(tab.label)}</span>${tab.focused ? '<span class="focused">focused</span>' : ''}</div>
        <div class="tab-meta">${escapeHtml(tab.id)} · ${tab.pane_count} pane${tab.pane_count === 1 ? '' : 's'}${tabStatuses(tab.agent_statuses)}${resumeStatuses(tab.agent_resume)}</div>
        ${workingFoldersView(tab)}
        ${agentSessionsView(tab)}
        <label class="tab-select"><input type="checkbox" data-select-tab="${escapeHtml(tab.id)}" ${state.selectedTabs.has(tab.id) ? 'checked' : ''}> Select this tab to move, archive or add to the archive group</label>
        <div class="tab-actions">
          <button type="button" title="Copy a command that places this tab one position closer to the first tab in this workspace" data-command="herdr-organizer reorder-tab --tab ${escapeHtml(tab.id)} --index ${before} --execute">Copy move tab left</button>
          <button type="button" title="Copy a command that places this tab one position closer to the last tab in this workspace" data-command="herdr-organizer reorder-tab --tab ${escapeHtml(tab.id)} --index ${after} --execute">Copy move tab right</button>
        </div>
      </article>`;
    };
    const workspaceView = workspace => `<article class="workspace">
      <div class="workspace-head"><div class="workspace-title"><strong>${escapeHtml(workspace.label)}</strong>${workspace.focused ? '<span class="focused">focused</span>' : ''}</div><span class="counts">${plural(workspace.tab_count, 'tab')} · ${plural(workspace.pane_count, 'pane')}</span></div>
      <div class="tabs">${workspace.tabs.map(tab => tabView(tab, workspace.tab_count)).join('') || '<div class="tab-meta">No tabs</div>'}</div>
      <div class="tab-actions" style="padding: 0 16px 14px"><button type="button" title="Copies a preview command. It only identifies shell-only tabs and protects tabs with running agents or verified resumable sessions." data-command="herdr-organizer cleanup-empty-tabs --workspace ${escapeHtml(workspace.id)}">Copy cleanup preview</button><button type="button" data-command="herdr-organizer archive --workspace ${escapeHtml(workspace.id)}">Copy archive preview</button><button type="button" title="Copies a command that captures this layout and closes this workspace. Its processes will stop." data-command="herdr-organizer archive --workspace ${escapeHtml(workspace.id)} --execute --confirm ${escapeHtml(workspace.id)}">Copy archive and close</button></div>
    </article>`;
    const groupedArchiveIds = () => new Set((state.data?.batches || []).flatMap(batch => (batch.members || []).map(member => member.archive_id)));
    const TAB_ID_PATTERN = /^w[A-Za-z0-9]{1,10}:[A-Za-z0-9]{1,10}$/;
    const TAB_MODES = [['move', 'Move'], ['archive', 'Archive'], ['batch', 'Add to archive group']];
    // Only a finished group from the session this snapshot came from can take tabs. The command refuses the rest anyway.
    const batchChoicesFor = data => (data.batches || []).filter(batch => BATCH_ID_PATTERN.test(batch.batch_id || '')
      && ['completed', 'completed_with_failures'].includes(batch.status)
      && SESSION_NAME_PATTERN.test(batch.herdr_session || '')
      && (!data.herdr_session || batch.herdr_session === data.herdr_session));
    const batchStamp = batch => `${batch.herdr_session || 'session'} archive group`;
    const movePanelView = data => {
      const allTabs = data.workspaces.flatMap(workspace => workspace.tabs.map(tab => ({ ...tab, workspace })));
      const selected = allTabs.filter(tab => state.selectedTabs.has(tab.id));
      if (!selected.length) return '';
      const mode = TAB_MODES.some(([key]) => key === state.selectedTabsAction) ? state.selectedTabsAction : 'move';
      const sourceWorkspaces = new Set(selected.map(tab => tab.workspace.id));
      const tabArgs = selected.map(tab => `--tab ${tab.id}`).join(' ');
      const validTabs = selected.every(tab => TAB_ID_PATTERN.test(tab.id));
      const batchChoices = mode === 'batch' ? batchChoicesFor(data) : [];
      const destinationChoices = mode === 'archive'
        ? (data.archives || []).filter(archive => ['archived', 'restored', 'resumed', 'restore_partial'].includes(archive.status))
        : mode === 'batch' ? batchChoices : data.workspaces.filter(workspace => !sourceWorkspaces.has(workspace.id));
      if (mode === 'archive' && !destinationChoices.some(archive => archive.archive_id === state.selectedTabsArchive)) state.selectedTabsArchive = destinationChoices[0]?.archive_id || '';
      if (mode === 'batch' && !batchChoices.some(batch => batch.batch_id === state.selectedTabsBatch)) state.selectedTabsBatch = batchChoices[0]?.batch_id || '';
      if (mode === 'move' && !destinationChoices.some(workspace => workspace.id === state.destinationWorkspace)) state.destinationWorkspace = destinationChoices[0]?.id || '';
      const destination = mode === 'archive' ? state.selectedTabsArchive : mode === 'batch' ? state.selectedTabsBatch : state.destinationWorkspace;
      const chosenBatch = mode === 'batch' ? batchChoices.find(batch => batch.batch_id === destination) : null;
      // A session with no archive group yet gets one from the first add. Its id is chosen when the command runs, so that run is confirmed with the session name.
      const newGroupSession = mode === 'batch' && !batchChoices.length && SESSION_NAME_PATTERN.test(data.herdr_session || '')
        && !(data.batches || []).some(batch => batch.herdr_session === data.herdr_session) ? data.herdr_session : '';
      const batchBase = chosenBatch && validTabs ? `herdr-organizer --session ${chosenBatch.herdr_session} add-tabs-to-batch --batch ${destination} ${tabArgs}`
        : newGroupSession && validTabs ? `herdr-organizer --session ${newGroupSession} add-tabs-to-batch ${tabArgs}` : '';
      const command = mode === 'batch' && newGroupSession ? (batchBase ? `${batchBase} --execute --confirm ${newGroupSession}` : '')
        : !destination ? ''
        : mode === 'archive' ? `herdr-organizer archive-tabs ${tabArgs} --into-archive ${destination} --execute --confirm ${destination}`
        : mode === 'batch' ? (batchBase ? `${batchBase} --execute --confirm ${destination}` : '')
        : `herdr-organizer move-tabs ${tabArgs} --to-workspace ${destination} --execute --confirm ${destination}`;
      const detail = mode === 'archive'
        ? `${selected.length} selected. The command adds them to the archive, then closes only their live tabs. Each live workspace keeps at least one tab.`
        : mode === 'batch'
          ? (batchChoices.length
            ? `${selected.length} selected. The command captures them into the archive group, then closes them and stops their processes. A workspace that already has an entry in the group merges into it. Copy the preview first.`
            : newGroupSession
              ? `${selected.length} selected. This session has no archive group yet. The command starts it with these tabs, then closes them and stops their processes. Copy the preview first.`
              : `${selected.length} selected. The archive group's last run did not finish, so it cannot take tabs yet. Run Archive all again to finish it.`)
          : `${selected.length} selected. The command rebuilds their layouts, closes the originals, then resumes any Codex or Claude sessions whose real CLI session can be identified before the move.`;
      const title = mode === 'archive' ? 'Archive selected tabs' : mode === 'batch' ? 'Add selected tabs to the archive group' : 'Move selected tabs to another workspace';
      const label = mode === 'archive' ? 'Existing archive' : mode === 'batch' ? 'Archive group' : 'Destination workspace';
      const options = mode === 'archive'
        ? destinationChoices.map(archive => `<option value="${escapeHtml(archive.archive_id)}" ${archive.archive_id === destination ? 'selected' : ''}>${escapeHtml(archive.workspace_label || archive.archive_id)} (${escapeHtml(archive.archive_id)})</option>`).join('')
        : mode === 'batch'
          ? (newGroupSession ? `<option value="" selected>New archive group for ${escapeHtml(newGroupSession)}</option>`
            : batchChoices.map(batch => `<option value="${escapeHtml(batch.batch_id)}" title="${escapeHtml(batch.batch_id)}" ${batch.batch_id === destination ? 'selected' : ''}>${escapeHtml(batchStamp(batch))}</option>`).join(''))
          : destinationChoices.map(workspace => `<option value="${escapeHtml(workspace.id)}" ${workspace.id === destination ? 'selected' : ''}>${escapeHtml(workspace.label)} (${escapeHtml(workspace.id)})</option>`).join('');
      const modes = TAB_MODES.map(([key, text]) => `<button class="mode-switch" type="button" data-tabs-mode="${key}" aria-pressed="${key === mode}">${text}</button>`).join('');
      const buttons = mode === 'batch'
        ? `<div class="panel-actions"><button type="button" id="copy-batch-preview" ${batchBase ? '' : 'disabled'} data-command="${escapeHtml(batchBase)}" title="Copies a read-only command. It shows which entry each workspace joins, or that it starts the group, and warns about duplicates. Nothing is closed.">Copy preview</button><button class="primary" type="button" id="copy-move-tabs" ${command ? '' : 'disabled'} data-command="${escapeHtml(command)}" title="Copies a command that captures the selected tabs into the group, then closes them.">Copy add + close tabs</button></div>`
        : `<button class="primary" type="button" id="copy-move-tabs" ${command ? '' : 'disabled'} data-command="${escapeHtml(command)}">${mode === 'archive' ? 'Copy archive selected tabs' : 'Copy move + resume'}</button>`;
      return `<div><strong>${title}</strong><p>${escapeHtml(detail)}</p><div class="mode-row" role="group" aria-label="What to do with the selected tabs">${modes}</div></div>
        <label>${label}<select id="move-destination" ${chosenBatch ? `title="${escapeHtml(chosenBatch.batch_id)}"` : ''} ${destinationChoices.length || newGroupSession ? '' : 'disabled'}>${newGroupSession ? '' : '<option value="">Choose destination</option>'}${options}</select></label>
        ${buttons}`;
    };
    const archiveTabKey = (archiveId, tabId) => `${archiveId}::${tabId}`;
    const restorePanelView = data => {
      const selected = data.archives.flatMap(archive => (archive.tabs || []).map(tab => ({ archive, tab }))).filter(({ archive, tab }) => state.selectedArchivedTabs.has(archiveTabKey(archive.archive_id, tab.id)));
      if (!selected.length) return '';
      const archiveIds = new Set(selected.map(({ archive }) => archive.archive_id));
      if (archiveIds.size !== 1) return '<div><strong>Restore selected archived tabs</strong><p>Select tabs from one archive at a time.</p></div><button type="button" disabled>Choose one archive</button>';
      const archiveId = selected[0].archive.archive_id;
      const destinations = data.workspaces || [];
      if (!destinations.some(workspace => workspace.id === state.archiveDestinations[archiveId])) state.archiveDestinations[archiveId] = destinations[0]?.id || '';
      const destination = state.archiveDestinations[archiveId];
      const unavailable = selected.filter(({ tab }) => tab.unresumable_agent_count > 0);
      const command = destination && !unavailable.length
        ? `herdr-organizer restore-tabs --archive ${archiveId} ${selected.map(({ tab }) => `--tab ${tab.id}`).join(' ')} --to-workspace ${destination} --execute --confirm ${archiveId}`
        : '';
      const detail = unavailable.length
        ? `${unavailable.length} selected tab${unavailable.length === 1 ? ' has' : 's have'} an unavailable agent session. Register it before restoring.`
        : `${selected.length} selected from this archive. The command rebuilds them in the destination and resumes verified Codex or Claude sessions.`;
      return `<div><strong>Restore selected archived tabs</strong><p>${escapeHtml(detail)}</p></div>
        <label>Destination workspace<select id="restore-destination" ${destinations.length ? '' : 'disabled'}><option value="">Choose destination</option>${destinations.map(workspace => `<option value="${escapeHtml(workspace.id)}" ${workspace.id === destination ? 'selected' : ''}>${escapeHtml(workspace.label)} (${escapeHtml(workspace.id)})</option>`).join('')}</select></label>
        <button class="primary" type="button" ${command ? '' : 'disabled'} data-command="${escapeHtml(command)}">Copy restore + resume</button>`;
    };
    const archivedTabView = (archive, tab) => {
      const key = archiveTabKey(archive.archive_id, tab.id);
      const canDelete = (archive.tabs || []).length > 1;
      const deleteCommand = canDelete ? `herdr-organizer delete-archived-tab --archive ${archive.archive_id} --tab ${tab.id} --execute --confirm ${archive.archive_id}:${tab.id}` : '';
      return `<div class="tab" style="margin: 10px 0">
        <div class="tab-line"><span class="tab-name">${escapeHtml(tab.label)}</span></div>
        <div class="tab-meta">${escapeHtml(tab.id)} · ${tab.pane_count} pane${tab.pane_count === 1 ? '' : 's'} · ${tab.resumable_agent_count} resumable${tab.unresumable_agent_count ? ` · ${tab.unresumable_agent_count} unavailable` : ''}</div>
        <label class="tab-select"><input type="checkbox" data-select-archive-tab="${escapeHtml(key)}" data-archive-id="${escapeHtml(archive.archive_id)}" ${state.selectedArchivedTabs.has(key) ? 'checked' : ''}> Select this tab for restore</label>
        <div class="tab-actions"><button class="danger" type="button" ${deleteCommand ? '' : 'disabled'} title="Permanently removes this tab from the saved archive only. It does not change any active or restored workspace." data-command="${escapeHtml(deleteCommand)}">${canDelete ? 'Copy delete archived tab' : 'Delete archive instead'}</button></div>
      </div>`;
    };
    const archiveView = archive => {
      const restore = `herdr-organizer restore --archive ${archive.archive_id}`;
      const execute = `${restore} --execute --confirm ${archive.archive_id}`;
      const resume = `${restore} --resume-agents --execute --confirm ${archive.archive_id}`;
      const remove = `herdr-organizer delete-archive --archive ${archive.archive_id} --execute --confirm ${archive.archive_id}`;
      return `<article class="archive">
        <div class="archive-line"><div><div class="archive-name">${escapeHtml(archive.workspace_label || archive.archive_id)}</div><div class="archive-meta">${escapeHtml(archive.archive_id)}</div></div><span class="archive-state">${escapeHtml(archive.status || 'unknown')}</span></div>
        <div class="archive-meta">${plural(archive.tab_count, 'tab')} · ${plural(archive.pane_count, 'pane')} · ${archive.resumable_pane_count} resumable · ${archive.shell_only_pane_count} unavailable${groupedArchiveIds().has(archive.archive_id) ? ` · <span class="archive-chip" title="This archive is in the session's archive group. It leaves the group when it is restored.">in archive group</span>` : ''}</div>
        <div class="archive-actions"><button type="button" data-command="${escapeHtml(restore)}">Copy restore preview</button><button class="primary" type="button" data-command="${escapeHtml(execute)}">Copy restore layout</button><button type="button" data-command="${escapeHtml(resume)}">Copy restore + resume agents</button><button class="danger" type="button" title="Permanently removes this saved archive only. It does not change any active or restored workspace." data-command="${escapeHtml(remove)}">Copy delete archive</button></div>
        <div class="archive-meta" style="margin-top: 12px">Select one or more archived tabs to restore into an active workspace</div>${(archive.tabs || []).map(tab => archivedTabView(archive, tab)).join('')}
      </article>`;
    };
    const VIEW_BADGES = { restart: 'restart tools', workspaces: 'live snapshot', archives: 'live snapshot', group: 'live snapshot', context: 'context gauge' };
    const render = () => {
      const data = state.data;
      document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.view === state.view)));
      document.querySelector('#restart-section').hidden = state.view !== 'restart';
      document.querySelector('#snapshot-controls').hidden = state.view === 'restart' || state.view === 'context';
      document.querySelector('#context-section').hidden = state.view !== 'context';
      document.querySelector('#view-badge').textContent = VIEW_BADGES[state.view] || '';
      if (state.view === 'context') {
        document.querySelector('#restart-section').hidden = true;
        document.querySelector('#workspaces-section').hidden = true;
        document.querySelector('#archives-section').hidden = true;
        document.querySelector('#group-section').hidden = true;
        document.querySelector('#move-panel').innerHTML = '';
        renderContext();
        return;
      }
      if (state.view === 'restart') {
        document.querySelector('#workspaces-section').hidden = true;
        document.querySelector('#archives-section').hidden = true;
        document.querySelector('#group-section').hidden = true;
        document.querySelector('#move-panel').innerHTML = '';
        renderRestart();
        return;
      }
      if (!data) return;
      const workspaces = (data.workspaces || []).filter(workspace => matches(`${workspace.label} ${workspace.id} ${workspace.tabs.map(tab => `${tab.label} ${tab.id}`).join(' ')}`));
      const archives = (data.archives || []).filter(archive => matches(`${archive.workspace_label} ${archive.archive_id} ${archive.status} ${groupedArchiveIds().has(archive.archive_id) ? 'in archive group' : ''}`));
      const allTabIds = new Set((data.workspaces || []).flatMap(workspace => workspace.tabs.map(tab => tab.id)));
      state.selectedTabs = new Set([...state.selectedTabs].filter(tabId => allTabIds.has(tabId)));
      const archivedTabKeys = new Set((data.archives || []).flatMap(archive => (archive.tabs || []).map(tab => archiveTabKey(archive.archive_id, tab.id))));
      state.selectedArchivedTabs = new Set([...state.selectedArchivedTabs].filter(key => archivedTabKeys.has(key)));
      const paneCount = workspaces.reduce((total, workspace) => total + workspace.pane_count, 0);
      document.querySelector('#summary').innerHTML = [
        ['Visible workspaces', workspaces.length], ['Visible tabs', workspaces.reduce((total, workspace) => total + workspace.tab_count, 0)], ['Visible panes', paneCount]
      ].map(([label, value]) => `<article class="metric"><span>${label}</span><strong>${value}</strong></article>`).join('');
      document.querySelector('#move-panel').innerHTML = state.view === 'archives' ? restorePanelView(data) : state.view === 'group' ? '' : movePanelView(data);
      document.querySelector('#workspaces-section').hidden = state.view !== 'workspaces';
      document.querySelector('#archives-section').hidden = state.view !== 'archives';
      document.querySelector('#group-section').hidden = state.view !== 'group';
      if (state.cleanup.result && state.cleanup.result.session !== cleanupSession()) state.cleanup = { loading: false, result: null, error: '' };
      document.querySelector('#cleanup-all').innerHTML = cleanupAllView(data);
      if (state.archiveAll.result && state.archiveAll.result.session !== cleanupSession()) state.archiveAll = freshArchiveAll();
      renderArchiveAll();
      document.querySelector('#batches').innerHTML = batchesView(data);
      document.querySelector('#workspaces').innerHTML = workspaces.length ? workspaces.map(workspaceView).join('') : '<div class="empty">No workspaces match this filter.</div>';
      document.querySelector('#archives').innerHTML = archives.length ? archives.map(archiveView).join('') : '<div class="empty">No archives yet. Preview an archive from a workspace when you are ready to close it.</div>';
      document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => copy(button.dataset.command, button.dataset.copied)));
      document.querySelectorAll('[data-select-tab]').forEach(input => input.addEventListener('change', event => {
        if (event.target.checked) state.selectedTabs.add(event.target.dataset.selectTab);
        else state.selectedTabs.delete(event.target.dataset.selectTab);
        render();
      }));
      document.querySelectorAll('[data-select-archive-tab]').forEach(input => input.addEventListener('change', event => {
        const key = event.target.dataset.selectArchiveTab;
        const archiveId = event.target.dataset.archiveId;
        if (event.target.checked) {
          const hasAnotherArchive = [...state.selectedArchivedTabs].some(item => !item.startsWith(`${archiveId}::`));
          if (hasAnotherArchive) state.selectedArchivedTabs.clear();
          state.selectedArchivedTabs.add(key);
