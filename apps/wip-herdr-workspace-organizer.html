      const list = problemBundles();
      if (!list.length) return '';
      return `<div class="scope-note">${list.length === 1 ? 'One bundle cannot' : `${list.length} bundles cannot`} be used here, so ${list.length === 1 ? 'it is' : 'they are'} left out: ${list.map(bundle => `…${escapeHtml(bundle.bundle_id.slice(-10))} (${escapeHtml(BUNDLE_PROBLEMS[bundle.problem] || 'not compatible')})`).join('; ')}.</div>`;
    };
    const activeBundle = () => readyBundles().find(bundle => bundle.bundle_id === restart.selectedBundle) || readyBundles()[0] || null;
    // The bundle the checklist follows. A bundle whose reconcile has already been recorded is a finished cycle,
    // so a fresh check on this page starts a new one instead of showing the old bundle as this restart's.
    const cycleBundle = () => {
      const bundle = activeBundle();
      return bundle && bundle.journal_status && restart.checkedAt ? null : bundle;
    };
    const attachCommand = name => `herdr session attach ${name}`;

    // Every step is derived from what the machine reports (checks, bundles on disk, running sessions, journals),
    // never from boxes the page remembers, so it still reads correctly after a restart.
    const checklistSteps = () => {
      const names = selectedSessionNames();
      const verifyEntries = names.map(name => restart.verify[name]?.data).filter(Boolean);
      const checked = names.length > 0 && verifyEntries.length === names.length && Boolean(restart.preflight?.data);
      const manualLeft = verifyEntries.reduce((total, data) => total + data.rows.filter(row => !row.verified && !restart.manual[manualKey(data.session, row.pane_id)]?.saved).length, 0);
      const preflight = restart.preflight?.data;
      const bundle = cycleBundle();
      const covered = Boolean(bundle && !bundle.journal_status);
      const restarted = Boolean(bundle && bundle.before_boot === true);
      const notRunning = bundle ? bundle.sessions.filter(session => !session.running).map(session => session.name) : [];
      const previewed = Boolean(bundle && restart.reconcile?.data && restart.reconcile.data.bundle_id === bundle.bundle_id);
      const steps = [
        { title: 'Check identities and preflight', done: checked || covered, detail: checked ? `${plural(names.length, 'session')} checked.` : (covered ? 'Covered by the sealed bundle.' : 'Select the sessions above and check them.') },
        { title: 'Resolve agents that stay manual', done: checked ? manualLeft === 0 : covered, wait: !checked && !covered, detail: checked ? (manualLeft ? `${plural(manualLeft, 'agent pane')} still without a verified identity. Apply verified identities, then set the rest by hand.` : 'Every agent pane has an identity.') : (covered ? 'Covered by the sealed bundle.' : 'Needs the check first.') },
        { title: 'Preflight passes', done: checked ? Boolean(preflight?.ready_to_seal) : covered, wait: !checked && !covered, detail: checked ? (preflight?.ready_to_seal ? 'Nothing blocks sealing a bundle.' : `${plural(failureTotal(preflight), 'thing')} to resolve or acknowledge.`) : (covered ? 'Covered by the sealed bundle.' : 'Needs the check first.') },
        { title: 'Seal a restart bundle', done: Boolean(bundle), wait: !preflight?.ready_to_seal && !bundle, detail: bundle ? `Sealed ${fmtTime(bundle.created_at)} for ${bundle.sessions.map(session => session.name).join(', ') || 'no sessions'}.` : (preflight?.ready_to_seal ? 'Ready. Seal it from the preflight card.' : 'Needs a passing preflight.') },
        { title: 'Restart the computer', done: restarted, wait: !bundle, detail: restarted ? 'The computer has booted since the bundle was sealed.' : (bundle ? 'Your move. Restart only after the bundle shows as sealed.' : 'Only after a bundle is sealed.') },
        { title: 'Attach each bundled session', done: restarted && !notRunning.length, wait: !restarted, detail: !restarted ? 'After the restart, attach each bundled session in a terminal.' : (notRunning.length ? `Not running yet: ${notRunning.join(', ')}. Attach each in a terminal.` : 'Every bundled session is running.') },
        { title: 'Preview the reconcile', done: previewed, wait: !restarted || Boolean(notRunning.length), detail: previewed ? 'Preview ran. Read the counts below.' : 'Read-only. Shows what would be adopted, rebuilt or left alone.' },
        { title: 'Confirm in a terminal', done: Boolean(bundle && bundle.journal_status), wait: !previewed && !(bundle && bundle.journal_status), detail: bundle && bundle.journal_status ? `A reconcile journal exists (${bundle.journal_status.replace(/_/g, ' ')}). Check its recorded verification result.` : 'The page shows the exact command. You run it.' }
      ];
      const next = steps.findIndex(step => !step.done);
      return steps.map((step, index) => ({ ...step, state: step.done ? 'done' : (index === next ? 'current' : 'pending') }));
    };
    const checklistView = () => {
      const steps = checklistSteps();
      return `<article class="card"><div class="card-head"><h3>Restart checklist</h3><span class="pill">from what the machine reports</span></div><div class="card-body"><div class="checklist">${steps.map((step, index) => `<div class="step ${step.state}"><span class="dot">${step.state === 'done' ? '✓' : index + 1}</span><div><strong>${escapeHtml(step.title)}</strong><div class="detail">${escapeHtml(step.detail)}</div></div><div class="tail">${step.state === 'current' ? '<span class="pill">next</span>' : ''}</div></div>`).join('')}</div></div></article>`;
    };

    const restoreCardView = () => {
      const all = readyBundles();
      if (!all.length) return problemBundles().length ? `<article class="card"><div class="card-head"><h3>Sealed bundle</h3><span class="pill warn">bundle problem</span></div><div class="card-body">${problemNote()}</div></article>` : '';
      const bundle = activeBundle();
      const notRunning = bundle.sessions.filter(session => !session.running).map(session => session.name);
      const reconcile = restart.reconcile && restart.reconcile.bundle_id === bundle.bundle_id ? restart.reconcile : null;
      const options = all.map(item => `<option value="${escapeHtml(item.bundle_id)}" ${item.bundle_id === bundle.bundle_id ? 'selected' : ''}>${escapeHtml(fmtTime(item.created_at))} · ${escapeHtml(item.sessions.map(session => session.name).join(', '))}</option>`).join('');
      const chips = bundle.sessions.map(session => `<span class="status ${session.running ? 'idle' : 'needs-registration'}">${escapeHtml(session.name)} ${session.running ? 'running' : 'not running'}</span>`).join(' ');
      let body = '';
      if (reconcile && reconcile.loading) body = '<div class="skeleton" style="margin-top:12px"></div>';
      else if (reconcile && reconcile.error) body = `<div class="scope-note error" style="margin-top:12px">${escapeHtml(reconcile.error)}</div>`;
      else if (reconcile && reconcile.data) {
        const data = reconcile.data;
        const outcome = (value, label, text, tone) => `<div class="mini ${tone}"><span>${label}</span><strong>${value}</strong><span style="margin-top:4px">${text}</span></div>`;
        const commandRow = (label, command, kind) => `<div class="btn-row"><button type="button" ${kind === 'danger' ? 'class="danger"' : (kind === 'primary' ? 'class="primary-btn"' : '')} data-command="${escapeHtml(command)}">${escapeHtml(label)}</button></div><pre class="command-box">${escapeHtml(command)}</pre>`;
        body = `<div class="outcome-grid">${outcome(data.totals.adopt, 'Adopt', 'Herdr already restored these workspaces. Nothing is rebuilt.', 'good')}${outcome(data.totals.rebuild, 'Rebuild', 'Proven missing. Confirming recreates them.', data.totals.rebuild ? 'warn' : '')}${outcome(data.totals.ambiguous, 'Ambiguous', 'More than one possible match. Left alone unless you choose an extra copy.', data.totals.ambiguous ? 'bad' : '')}</div>
          <div class="tab-meta" style="margin:0 0 10px">${data.sessions.map(item => `${escapeHtml(item.session)}: ${item.adopt} adopt, ${item.rebuild} rebuild, ${item.ambiguous} ambiguous`).join(' &nbsp;|&nbsp; ')}</div>
          <div class="scope-note">Confirming changes live Herdr: it rebuilds the workspaces listed above. The page never runs it. Run it in a terminal, then check the recorded verification result.</div>
          ${commandRow('Copy confirm command (layouts only)', data.commands.confirm, 'primary')}
          ${commandRow('Copy confirm and resume agents', data.commands.confirm_resume, 'plain')}
          <details class="fold" data-fold="restore-more" ${restart.open['restore-more'] ? 'open' : ''} style="margin-top:14px"><summary><span class="group-title">Other commands <span class="count-pill">rollback and extra copy</span></span></summary>
            <div class="tab-meta" style="margin:6px 0">Rollback closes only workspaces this bundle's journal created. It never closes adopted workspaces. Preview it first.</div>
            ${commandRow('Copy rollback preview', data.commands.rollback_preview, 'plain')}
            ${commandRow('Copy rollback (closes created workspaces)', data.commands.rollback, 'danger')}
            ${data.commands.confirm_extra_copy ? `<div class="tab-meta" style="margin:10px 0 6px">Ambiguous workspaces are skipped. A deliberate extra copy rebuilds them next to the existing ones.</div>${commandRow('Copy confirm with extra copies', data.commands.confirm_extra_copy, 'danger')}` : ''}
          </details>`;
      }
      const attach = notRunning.length ? `<div class="scope-note">Attach ${escapeHtml(notRunning.join(', '))} before the preview. Recovery never starts a session for you.</div>${notRunning.map(name => `<div class="attach-row"><code>${escapeHtml(attachCommand(name))}</code><button type="button" class="small-btn" data-command="${escapeHtml(attachCommand(name))}">Copy</button></div>`).join('')}` : '';
      return `<article class="card"><div class="card-head"><h3>Sealed bundle</h3><span class="pill ${bundle.before_boot ? 'good' : ''}">${bundle.before_boot ? 'computer restarted' : 'sealed this boot'}</span></div><div class="card-body">
        <p class="lede">The sealed bundle is how the page knows where you are. After the restart, attach each bundled session in a terminal, preview the reconcile here, then confirm it in a terminal.</p>
        ${problemNote()}
        <div class="share-options">${all.length > 1 ? `<label class="field" style="min-width:260px">Bundle<select data-action="bundle-select">${options}</select></label>` : `<span class="tab-meta" style="margin:0">Sealed ${escapeHtml(fmtTime(bundle.created_at))}</span>`}<span class="tab-meta" style="margin:0">${chips}</span></div>
        ${attach}
        <div class="btn-row"><button type="button" class="primary-btn" data-action="reconcile-preview" ${notRunning.length || (reconcile && reconcile.loading) ? 'disabled' : ''}>${reconcile && reconcile.loading ? 'Previewing…' : (reconcile && reconcile.data ? 'Preview again' : 'Run reconcile preview')}</button><button type="button" data-action="bundles-refresh">Refresh</button><button type="button" data-action="copy-bundle-id" data-id="${escapeHtml(bundle.bundle_id)}">Copy bundle ID</button></div>
        ${body}
        <div class="tab-meta" style="margin-top:14px">Keep the bundle and the reconcile journal until you accept the result, then delete them under your own retention policy. They hold folders and resume details, so never commit, upload or share them.</div>
      </div></article>`;
    };
    const loadBundles = async () => {
      try {
        restart.bundles = await api.run('bundles');
        restart.bundlesError = '';
        if (!readyBundles().some(bundle => bundle.bundle_id === restart.selectedBundle)) restart.selectedBundle = readyBundles()[0]?.bundle_id || '';
      } catch (error) { restart.bundlesError = error.message; }
      renderRestart();
    };
    const previewReconcile = async () => {
      const bundle = activeBundle();
      if (!bundle) return;
      restart.reconcile = { bundle_id: bundle.bundle_id, loading: true };
      renderRestart();
      try { restart.reconcile = { bundle_id: bundle.bundle_id, data: await api.run('reconcile-preview', { bundle: bundle.bundle_id }) }; }
      catch (error) { restart.reconcile = { bundle_id: bundle.bundle_id, error: error.message }; }
      await loadBundles();
    };
    const renderRestart = () => {
      const root = document.querySelector('#restart-section');
      if (!root) return;
      const focus = document.activeElement && root.contains(document.activeElement) ? document.activeElement.dataset.focus : '';
      const names = selectedSessionNames();
      const restore = restoreCardView();
      const stamp = restart.checkedAt ? `Checked ${restart.checkedAt.toLocaleTimeString()}` : 'Not checked yet';
      root.innerHTML = `<div class="restart">
        <div><div class="section-heading" style="margin-top:0"><h2>Sessions in this restart</h2><span class="updated">${escapeHtml(stamp)}</span></div>${scopeView()}</div>
        ${checklistView()}
        ${names.length && !restart.checking && !restart.checkedAt && !cycleBundle() ? '<article class="card"><div class="card-head"><h3>Before you restart</h3><span class="pill">nothing is changed</span></div><div class="card-body"><p class="lede">Check the selected sessions. The page runs two read-only checks: which agents have an identity it can prove, so they can be resumed after the restart, and whether a restart bundle could be sealed right now. The identity check can take a few minutes on a busy machine.</p></div></article>' : ''}
        ${names.length && (restart.checking || restart.checkedAt) ? `<div><div class="section-heading" style="margin-top:0"><h2>Identities</h2><span class="updated">The check is read only. Applying is a separate step.</span></div><div class="restart">${names.map(identityCardView).join('')}</div></div>
        <div><div class="section-heading" style="margin-top:0"><h2>Preflight</h2><span class="updated">The check is read only. Sealing is a separate step.</span></div>${preflightCardView()}</div>
        <div><div class="section-heading" style="margin-top:0"><h2>Share</h2></div>${shareCardView()}</div>` : ''}
        ${restore ? `<div><div class="section-heading" style="margin-top:0"><h2>After the restart</h2><span class="updated">Preview is read only. Confirming is yours to run.</span></div>${restore}</div>` : ''}
        ${restart.bundlesError ? `<div class="scope-note error">${escapeHtml(restart.bundlesError)}</div>` : ''}
      </div>`;
      if (focus) root.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus();
    };

    const loadSessions = async ({ keepSelection } = {}) => {
      try {
        const known = new Set((restart.sessions || []).map(session => session.name));
        restart.sessions = await api.run('sessions');
        const running = restart.sessions.filter(session => session.selectable).map(session => session.name);
        // Fail-safe default: every running non-default session is selected. A session that started since the
        // last look is added rather than silently left out.
        restart.selected = keepSelection
          ? new Set(running.filter(name => restart.selected.has(name) || !known.has(name)))
          : new Set(running);
        restart.error = '';
      } catch (error) {
        restart.sessions = restart.sessions || [];
        restart.error = error.message;
      }
      renderRestart();
    };

    const runCheck = async () => {
      if (restart.checking) return;
      await loadSessions({ keepSelection: true });
      const names = selectedSessionNames();
      if (!names.length) return;
      restart.checking = true;
      restart.checkStarted = Date.now();
      restart.timer = setInterval(renderRestart, 1000);
      restart.share = null;
      restart.acks = { volatile: new Set(), mixed: new Set() };
      restart.ackKey = ackKeyOf(restart.acks);
      restart.seal = null;
      restart.confirm = null;
      restart.verify = Object.fromEntries(names.map(name => [name, { loading: true }]));
      restart.preflight = { loading: true };
      renderRestart();
      await Promise.all([
        ...names.map(async name => {
          try { restart.verify[name] = { data: await api.run('verify', { session: name }) }; }
          catch (error) { restart.verify[name] = { error: error.message }; }
          renderRestart();
        }),
        (async () => {
          try { restart.preflight = { data: await api.run('preflight', { sessions: names }) }; }
          catch (error) { restart.preflight = { error: error.message }; }
          renderRestart();
        })()
      ]);
      clearInterval(restart.timer);
      restart.checking = false;
      restart.checkedAt = new Date();
      renderRestart();
    };

    const recheckPreflight = async () => {
      const names = selectedSessionNames();
      if (!names.length || restart.checking) return;
      restart.checking = true;
      restart.checkStarted = Date.now();
      restart.timer = setInterval(renderRestart, 1000);
      restart.preflight = { loading: true };
      restart.seal = null;
      renderRestart();
      try {
        const sent = ackKeyOf(restart.acks);
        restart.preflight = { data: await api.run('preflight', { sessions: names, acknowledgements: acksPayload() }) };
        restart.ackKey = sent;
      } catch (error) { restart.preflight = { error: error.message }; }
      clearInterval(restart.timer);
      restart.checking = false;
      renderRestart();
    };
    const applyIdentities = async session => {
      restart.applying = true;
      renderRestart();
      try {
        restart.applyResult[session] = await api.run('verify-apply', { session, confirm: `apply:${session}` });
        showToast(`Applied verified identities for ${session}`);
      } catch (error) { restart.applyResult[session] = { error: error.message }; }
      restart.applying = false;
      restart.confirm = null;
      renderRestart();
    };
    const sealBundle = async () => {
      const names = selectedSessionNames();
      if (!names.length || restart.sealing) return;
      restart.sealing = true;
      renderRestart();
      try { restart.seal = { data: await api.run('seal-bundle', { sessions: names, acknowledgements: acksPayload(), confirm: `seal:${names.join(',')}` }) }; }
      catch (error) { restart.seal = { error: error.message }; }
      restart.sealing = false;
      restart.confirm = null;
      renderRestart();
      loadBundles();
    };
    // The manual identity form also appears in the Archive all card, so a change re-renders both places.
    const rerenderManual = () => { renderRestart(); renderArchiveAll(); };
    const saveManualIdentity = async key => {
      const entry = restart.manual[key];
      if (!entry || entry.saving) return;
      const [session, pane] = key.split('|');
      entry.saving = true;
      entry.error = '';
      rerenderManual();
      try {
        const data = await api.run('save-manual-identity', { session, pane_id: pane, client: entry.client, session_id: String(entry.draft || '').trim(), folder_override: entry.override === true, confirm: `save:${pane}` });
        restart.manual[key] = { saved: data.masked_id };
        showToast(`Identity saved for ${pane}`);
      } catch (error) {
        entry.saving = false;
        entry.error = error.message;
        if (error.code === 'folder_differs' || error.code === 'folder_unknown') entry.needsOverride = error.code;
      }
      rerenderManual();
    };
    const openManual = (session, pane, client, scroll) => {
      const key = manualKey(session, pane);
      const entry = restart.manual[key];
      if (entry && entry.open && !scroll) restart.manual[key] = { ...entry, open: false };
      else restart.manual[key] = { ...(entry || {}), open: true, client: (entry && entry.client) || (client === 'codex' ? 'codex' : 'claude'), draft: (entry && entry.draft) || '' };
      renderRestart();
      if (scroll) document.querySelector(`#restart-section [data-pane-key="${CSS.escape(key)}"]`)?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };
    const buildShare = async () => {
      const names = selectedSessionNames();
      if (!names.length || restart.sharing) return;
      restart.sharing = true;
      restart.share = null;
      renderRestart();
      try { restart.share = { data: await api.run('share-report', { sessions: names, include_labels: restart.includeLabels, ...(ackKeyOf(restart.acks) === restart.ackKey && (restart.acks.volatile.size || restart.acks.mixed.size) ? { acknowledgements: acksPayload() } : {}) }) }; }
      catch (error) { restart.share = { error: error.message }; }
      restart.sharing = false;
      renderRestart();
    };

    const downloadText = (filename, text) => {
      const url = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };

    const restartRoot = document.querySelector('#restart-section');
    restartRoot.addEventListener('click', event => {
      const command = event.target.closest('[data-command]');
      if (command) { copy(command.dataset.command); return; }
      const target = event.target.closest('[data-action]');
      if (!target || target.tagName === 'INPUT') return;
      const action = target.dataset.action;
      if (action === 'check') runCheck();
      else if (action === 'apply-ask') { restart.confirm = { kind: 'apply', session: target.dataset.session }; renderRestart(); }
      else if (action === 'apply-confirm') applyIdentities(target.dataset.session);
      else if (action === 'seal-ask') { restart.confirm = { kind: 'seal' }; renderRestart(); }
      else if (action === 'seal-confirm') sealBundle();
      else if (action === 'confirm-cancel') { restart.confirm = null; renderRestart(); }
      else if (action === 'preflight-recheck') recheckPreflight();
      else if (action === 'reconcile-preview') previewReconcile();
      else if (action === 'bundles-refresh') loadBundles();
      else if (action === 'copy-bundle-id') copy(target.dataset.id, 'Bundle ID copied');
      else if (action === 'copy-bundle' && restart.seal?.data) copy(restart.seal.data.bundle_id, 'Bundle ID copied');
      else if (action === 'manual-open') openManual(target.dataset.session, target.dataset.pane, target.dataset.client, false);
      else if (action === 'manual-goto') openManual(target.dataset.session, target.dataset.pane, target.dataset.client, true);
      else if (action === 'manual-cancel') { delete restart.manual[target.dataset.key]; renderRestart(); }
      else if (action === 'build-share') buildShare();
      else if (action === 'copy-share' && restart.share?.data) copy(restart.share.data.markdown, 'Report copied');
      else if (action === 'download-share' && restart.share?.data) downloadText(restart.share.data.filename, restart.share.data.markdown);
    });
    restartRoot.addEventListener('submit', event => {
      const form = event.target.closest('[data-manual-form]');
      if (!form) return;
      event.preventDefault();
      saveManualIdentity(form.dataset.manualForm);
    });
    // The typed id lives only in this in-memory draft until it is saved or cancelled; it is never stored or logged.
    restartRoot.addEventListener('input', event => {
      const key = event.target.dataset?.manualId;
      if (key && restart.manual[key]) restart.manual[key].draft = event.target.value;
    });
    restartRoot.addEventListener('change', event => {
      const clientKey = event.target.dataset?.manualClient;
      if (clientKey && restart.manual[clientKey]) { restart.manual[clientKey].client = event.target.value; renderRestart(); return; }
      const target = event.target.closest('[data-action]');
      if (!target) return;
      if (target.dataset.action === 'toggle-session') {
        if (target.checked) restart.selected.add(target.dataset.session); else restart.selected.delete(target.dataset.session);
        renderRestart();
      } else if (target.dataset.action === 'bundle-select') {
        restart.selectedBundle = target.value;
        renderRestart();
      } else if (target.dataset.action === 'ack-toggle') {
        const set = target.dataset.flag === 'volatile-pane' ? restart.acks.volatile : restart.acks.mixed;
        if (target.checked) set.add(target.dataset.value); else set.delete(target.dataset.value);
        restart.seal = null;
        renderRestart();
      } else if (target.dataset.action === 'manual-override') {
        if (restart.manual[target.dataset.key]) restart.manual[target.dataset.key].override = target.checked;
        renderRestart();
      } else if (target.dataset.action === 'toggle-labels') {
        restart.includeLabels = target.checked;
        restart.share = null;
        renderRestart();
      }
    });
    restartRoot.addEventListener('toggle', event => {
      const key = event.target.dataset?.fold;
      if (key) restart.open[key] = event.target.open;
    }, true);

    // ---- Clean up empty shell tabs in every workspace ----
    // The preview is read-only and runs on the server. Closing tabs is not run by the page: the exact command is copied for the terminal.
    const WORKSPACE_ID_PATTERN = /^w[A-Za-z0-9]{1,10}$/;
    const SESSION_NAME_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/;
    const PROTECTED_REASONS = { agent_detected: 'with an agent', resumable_session: 'with a resumable session', non_shell_process: 'running something other than a shell' };
    state.cleanup = { loading: false, result: null, error: '' };
    const cleanupSession = () => state.snapshotSession || state.data?.herdr_session || '';
    // Used before any preview has run, from the snapshot the page already shows.
    const cleanupPreviewAllCommand = data => {
      const ids = (data.workspaces || []).map(workspace => workspace.id).filter(id => WORKSPACE_ID_PATTERN.test(id));
      if (!ids.length) return '';
      const session = SESSION_NAME_PATTERN.test(data.herdr_session || '') ? ` --session ${data.herdr_session}` : '';
      return `for ws in ${ids.join(' ')}; do herdr-organizer${session} cleanup-empty-tabs --workspace "$ws"; done`;
    };
    const cleanupAllView = data => {
      const cleanup = state.cleanup;
      const result = cleanup.result;
      const labels = new Map((data.workspaces || []).map(workspace => [workspace.id, workspace.label]));
      const previewAll = result?.commands?.preview_all || cleanupPreviewAllCommand(data);
      let body = '';
      if (cleanup.loading) body = '<div class="skeleton" style="margin-top:14px"></div>';
      else if (cleanup.error) body = `<div class="scope-note error" style="margin-top:14px">${escapeHtml(cleanup.error)}</div>`;
      else if (result) {
        const totals = result.totals;
        const closable = result.workspaces.filter(workspace => workspace.tabs_to_close.length);
        const clean = result.workspaces.filter(workspace => !workspace.tabs_to_close.length && !workspace.error);
        const failed = result.workspaces.filter(workspace => workspace.error);
        const rows = closable.map(workspace => `<div class="failure"><h4>${escapeHtml(labels.get(workspace.workspace_id) || workspace.workspace_id)} <span class="count-pill">${workspace.close_workspace ? 'closes entirely' : `${workspace.tabs_to_close.length} to close`}</span></h4>
          ${workspace.tabs_to_close.map(tab => `<div class="failure-entry"><span class="pane-id">${escapeHtml(tab.tab_id)}</span><span class="names">${escapeHtml(tab.label)}</span><span class="status">${plural(tab.pane_count, 'pane')}</span></div>`).join('')}
          ${workspace.close_workspace ? '<div class="tab-meta" style="margin-top:6px">Every tab here is an empty shell, so the whole workspace closes with its last tab.</div>' : ''}
          ${workspace.kept_tab_id ? `<div class="tab-meta" style="margin-top:6px">Every tab here is empty, but ${escapeHtml(workspace.kept_tab_id)} stays open because ${workspace.kept_reason === 'running_inside' ? 'the command would run inside this workspace' : 'it is the only workspace in the session'}.</div>` : ''}</div>`).join('');
        const protectedCounts = {};
        result.workspaces.forEach(workspace => workspace.protected_tabs.forEach(tab => { protectedCounts[tab.reason] = (protectedCounts[tab.reason] || 0) + 1; }));
        const keptLast = result.workspaces.filter(workspace => workspace.kept_tab_id).length;
        const protectedText = [...Object.entries(protectedCounts).map(([reason, count]) => `${count} ${PROTECTED_REASONS[reason] || reason.replace(/_/g, ' ')}`), keptLast ? `${keptLast} as the last tab of ${keptLast === 1 ? 'a workspace that must stay' : 'workspaces that must stay'}` : ''].filter(Boolean).join(', ');
        body = `<div class="cleanup-totals"><span><strong>${totals.tabs_to_close}</strong> empty shell ${totals.tabs_to_close === 1 ? 'tab' : 'tabs'} to close in <strong>${totals.workspaces_with_empty_tabs}</strong> of ${plural(totals.workspaces, 'workspace')}${totals.workspaces_to_close ? `, ${plural(totals.workspaces_to_close, 'workspace')} closing entirely` : ''}</span>${protectedText ? `<span class="updated">Kept: ${escapeHtml(protectedText)}</span>` : ''}</div>
          ${rows || '<div class="tab-meta">Nothing to close. Every tab has an agent, a resumable session or a running process.</div>'}
          ${clean.length && rows ? `<div class="tab-meta">${plural(clean.length, 'workspace')} have nothing to close.</div>` : ''}
          ${failed.length ? `<div class="scope-note error">Preview failed for ${escapeHtml(failed.map(workspace => workspace.workspace_id).join(', '))}. Run the preview command for those workspaces in a terminal.</div>` : ''}
          ${result.commands.execute_all ? `<div class="group-title" style="margin-top:14px">Closes ${plural(totals.tabs_to_close, 'tab')}${totals.workspaces_to_close ? ` and ${plural(totals.workspaces_to_close, 'whole workspace')}` : ''}. Run it in your terminal when you are ready</div><pre class="command-box">${escapeHtml(result.commands.execute_all)}</pre>` : ''}`;
      }
      const canPreview = Boolean(cleanupSession()) && !cleanup.loading;
      return `<article class="card cleanup-all"><div class="card-head"><h3>Clean up empty tabs in every workspace</h3><span class="pill">${result ? 'previewed' : 'preview only'}</span></div><div class="card-body">
        <p class="lede">Finds shell-only tabs in ${(data.workspaces || []).length ? `all ${plural(data.workspaces.length, 'workspace')}` : 'every workspace'} at once: no agent, no resumable session, nothing running. A tab with an agent or a resumable session is never touched. A workspace whose tabs are all empty closes entirely, unless it is the one the command runs in or the only one left. Previewing closes nothing.</p>
        <div class="btn-row"><button type="button" class="primary-btn" data-cleanup="preview" ${canPreview ? '' : 'disabled'} title="${cleanupSession() ? 'Runs the read-only preview for every workspace' : 'Select a running session first'}">${cleanup.loading ? 'Previewing…' : (result ? 'Preview again' : 'Preview all workspaces')}</button>
          <button type="button" data-command="${escapeHtml(previewAll)}" ${previewAll ? '' : 'disabled'} title="Copies one command that runs the preview for every workspace in your terminal">Copy cleanup preview for all workspaces</button>
          ${result?.commands?.execute_all ? `<button type="button" class="danger" data-command="${escapeHtml(result.commands.execute_all)}" title="Copies the commands that close the empty shell tabs listed above, and the workspaces that hold nothing else. Their processes are shells only.">Copy cleanup and close for all</button>` : ''}</div>
        ${body}
      </div></article>`;
    };
    const runCleanupPreview = async () => {
      const session = cleanupSession();
      if (!session || state.cleanup.loading) return;
      state.cleanup = { loading: true, result: null, error: '' };
      render();
      try { state.cleanup = { loading: false, result: await api.run('cleanup-preview', { session }), error: '' }; }
      catch (error) { state.cleanup = { loading: false, result: null, error: error.message }; }
      render();
    };
    document.querySelector('#cleanup-all').addEventListener('click', event => {
      if (event.target.closest('[data-cleanup="preview"]')) runCleanupPreview();
    });

    // ---- Archive all workspaces ----
    // The preview is read-only and runs on the server. Archiving closes workspaces, so the page never runs it:
    // the exact command is copied for a terminal outside Herdr. The tool re-checks every workspace when it runs.
    const SKIP_TEXT = {
      active_agent: 'Has a working or blocked agent. Let it finish, then preview again.',
      unverified_agent_session: 'Has an agent whose session is not registered, so it could not be resumed. Check its identity below, then preview again.',
      capture_failed: 'Could not be captured. Run the single archive preview for it in a terminal to see why.',
      workspace_gone: 'No longer exists.',
      workspace_changed: 'Changed since the preview.'
    };
    const freshArchiveAll = () => ({ loading: false, result: null, error: '', checking: {}, checkStarted: {}, checkError: '', snapshotAt: '', applyConfirm: '', applying: false, applied: {}, readyOpen: false });
    state.archiveAll = freshArchiveAll();
    // What the identity check says about one skipped pane. The archive tool skips an agent that is not registered,
    // which is a different test from the identity check, so a pane the check proves is verified but not yet registered.
    const archivePaneState = (verifyData, paneId) => {
      if (!verifyData) return { kind: 'unchecked' };
      const row = (verifyData.rows || []).find(item => item.pane_id === paneId);
      if (!row) return { kind: 'not_found' };
      return { kind: row.verified ? 'verified' : 'manual', row };
    };
    const archiveVerifiedCount = session => {
      const data = restart.verify[session]?.data;
      return data?.summary?.safe_to_apply ?? (data?.rows || []).filter(row => row.verified).length;
    };
    const archiveCheckSeconds = session => (state.archiveAll.checkStarted[session] ? Math.round((Date.now() - state.archiveAll.checkStarted[session]) / 1000) : 0);
    const archiveAllPaneView = (session, pane) => {
      const key = manualKey(session, pane.pane_id);
      const entry = restart.manual[key] || {};
      const aa = state.archiveAll;
      const verify = restart.verify[session];
      const found = archivePaneState(verify?.data, pane.pane_id);
      // The apply result kept here belongs to this card and to the identity check it followed. A result from the
      // Restart tab, or from before a new check, says nothing about this pane.
      const applied = aa.applied[session];
      let note = '';
      let control = '';
      let form = '';
      if (entry.saved) control = `<span class="pill good" title="Saved to the registry. Preview again to include this workspace.">Saved · ${escapeHtml(entry.saved)}</span>`;
      else if (aa.checking[session]) control = `<span class="pill">checking identities… ${archiveCheckSeconds(session)}s</span>`;
      else if (found.kind === 'unchecked' || found.kind === 'not_found') {
        control = `<button type="button" class="small-btn" style="margin-left:auto" data-aa="check" data-session="${escapeHtml(session)}">${found.kind === 'not_found' ? 'Check again' : 'Check identity'}</button>`;
        if (found.kind === 'not_found') note = 'The identity check did not list this pane. Preview again to refresh the list.';
        else if (verify?.error) note = verify.error;
      } else if (found.kind === 'verified') {
        const done = applied && !applied.error;
        control = done
          ? '<span class="pill">applied, preview again</span>'
          : `<button type="button" class="small-btn" style="margin-left:auto" data-aa="apply-ask" data-session="${escapeHtml(session)}" ${aa.applying ? 'disabled' : ''}>Apply verified identities</button>`;
        note = done
          ? `Applied for the whole ${session} session: the tool wrote ${plural(applied.written, 'identity', 'identities')}. That does not show this pane was one of them. Preview again to see whether this workspace is now included.`
          : `The identity check proved this agent's session, but it is not registered yet, and archive only trusts registered sessions. The tool can only apply for the whole ${session} session, so this registers every verified agent in it, not just this pane. A session id cannot be typed for a verified pane.`;
        if (applied?.error) note = `${applied.error} ${note}`;
      } else {
        const [label, tone] = CLASS_LABELS[found.row.classification] || [found.row.classification, ''];
        control = `<span class="pill ${tone}">${escapeHtml(label)}</span><button type="button" class="small-btn" data-aa="manual" data-session="${escapeHtml(session)}" data-pane="${escapeHtml(pane.pane_id)}" data-client="${escapeHtml(pane.client || '')}">${entry.open ? 'Close form' : 'Set session id'}</button>`;
        note = `${plural(found.row.candidates, 'candidate session')}. Paste the right session id below.`;
        form = entry.open ? `<div class="inline-form">${manualFormView(session, { pane_id: pane.pane_id, client: pane.client })}</div>` : '';
      }
      return `<div class="failure-entry"><span class="pane-id">${escapeHtml(pane.pane_id)}</span><span class="names">${escapeHtml(pane.client || 'agent')}</span><span style="margin-left:auto;display:inline-flex;gap:6px;align-items:center">${control}</span>${note ? `<div class="tab-meta inline-form" style="margin:0">${escapeHtml(note)}</div>` : ''}${form}</div>`;
    };
    const archiveAllSkippedView = (item, session) => {
      const why = item.reasons.map(reason => SKIP_TEXT[reason] || reason.replace(/_/g, ' ')).join(' ');
      const panes = item.unverified_panes.map(pane => archiveAllPaneView(session, pane)).join('');
      return `<div class="failure"><h4>${escapeHtml(item.label || item.workspace_id)} <span class="count-pill">${escapeHtml(item.workspace_id)}</span></h4><p>${escapeHtml(why)}</p>${panes}</div>`;
    };
    const archiveAllView = data => {
      const aa = state.archiveAll;
      const result = aa.result;
      const session = cleanupSession();
      const stale = Boolean(result) && Boolean(aa.snapshotAt) && aa.snapshotAt !== (data.generated_at || '');
      const previewCommand = result?.commands?.preview || (SESSION_NAME_PATTERN.test(session) ? `herdr-organizer --session ${session} archive-all` : '');
      let body = '';
      if (aa.loading) body = '<div class="skeleton" style="margin-top:14px"></div>';
      else if (aa.error) body = `<div class="scope-note error" style="margin-top:14px">${escapeHtml(aa.error)}</div>`;
      else if (result) {
        const totals = result.totals;
        const ready = result.to_archive.length
          ? `<details class="fold" data-fold="aa-ready"${aa.readyOpen ? ' open' : ''} style="margin-top:6px"><summary><span class="group-title">Will be archived <span class="count-pill">${totals.to_archive}</span></span></summary>${result.to_archive.map(item => `<div class="member-line"><span class="pane-id">${escapeHtml(item.workspace_id)}</span><span class="names">${escapeHtml(item.label)}</span><span class="tab-meta" style="margin:0 0 0 auto">${plural(item.tab_count, 'tab')} · ${plural(item.pane_count, 'pane')}</span></div>`).join('')}</details>`
          : '<div class="tab-meta">Nothing passes the safety checks, so there is nothing to archive.</div>';
        const skipped = result.skipped.length ? `<div class="group-title" style="margin-top:14px">Skipped <span class="count-pill">${totals.skipped}</span></div>${result.skipped.map(item => archiveAllSkippedView(item, result.session)).join('')}` : '';
        const waiting = Object.keys(aa.checking).some(name => aa.checking[name]);
        const confirm = aa.applyConfirm
          ? `<div class="confirm-box"><strong>Register ${plural(archiveVerifiedCount(aa.applyConfirm), 'verified agent')} across the whole ${escapeHtml(aa.applyConfirm)} session?</strong>This is every verified agent in the session, not only the skipped workspaces above. The verifier re-reads each live pane right before writing and skips any that changed. This writes the private registry file only; Herdr is not changed. Then preview again.<div class="btn-row"><button type="button" class="primary-btn" data-aa="apply-confirm" ${aa.applying ? 'disabled' : ''}>${aa.applying ? 'Applying…' : 'Apply'}</button><button type="button" data-aa="apply-cancel">Cancel</button></div></div>` : '';
        const command = result.commands.execute
          ? `<div class="confirm-box warn" style="margin-top:14px"><strong>Closes ${plural(totals.to_archive, 'workspace')} and stops their processes.</strong>Run this in a terminal outside Herdr. It stops before closing anything if it is run inside a workspace it would archive, and it checks each workspace again just before closing it. Skipped workspaces stay open. A second run makes a second group for them.</div><pre class="command-box">${escapeHtml(stale ? 'The snapshot changed since this preview. Preview again for a fresh command.' : result.commands.execute)}</pre>`
          : '';
        body = `<div class="cleanup-totals"><span><strong>${totals.to_archive}</strong> of ${plural(totals.workspaces, 'workspace')} would be archived and closed</span><span class="updated">${totals.skipped} skipped</span></div>${totals.omitted ? `<div class="scope-note error">${plural(totals.omitted, 'workspace')} could not be read from the tool output and ${totals.omitted === 1 ? 'is' : 'are'} missing from this list. Run the preview command in a terminal to see everything before you archive.</div>` : ''}${stale ? '<div class="scope-note">The snapshot changed since this preview. Preview again before you copy the command.</div>' : ''}${ready}${skipped}${waiting ? '<div class="tab-meta">The identity check inspects every agent pane, so it can take a few minutes when the machine is busy.</div>' : ''}${confirm}${aa.checkError ? `<div class="scope-note error">${escapeHtml(aa.checkError)}</div>` : ''}${command}`;
      }
      const canPreview = Boolean(session) && !aa.loading;
      const canCopy = Boolean(result?.commands?.execute) && !stale;
      return `<article class="card cleanup-all"><div class="card-head"><h3>Archive all workspaces</h3><span class="pill">${result ? 'previewed' : 'preview only'}</span></div><div class="card-body">
        <p class="lede">Archives every live workspace that passes the safety checks and closes it, into the session's archive group, which you can restore together from the Archive group tab. A workspace with a working agent, or an agent without a registered session id, is skipped and listed with the reason. Previewing closes nothing.</p>
        <div class="btn-row"><button type="button" class="primary-btn" data-aa="preview" ${canPreview ? '' : 'disabled'} title="${session ? 'Runs the read-only preview for every workspace' : 'Select a running session first'}">${aa.loading ? 'Previewing…' : (result ? 'Preview again' : 'Preview archive all')}</button>
          <button type="button" data-aa-copy="${escapeHtml(previewCommand)}" ${previewCommand ? '' : 'disabled'} title="Copies the preview command to run in your terminal">Copy archive all preview</button>
          <button type="button" class="danger" data-aa-copy="${escapeHtml(canCopy ? result.commands.execute : '')}" ${canCopy ? '' : 'disabled'} title="${canCopy ? 'Copies the command that archives and closes the workspaces listed above' : 'Preview first. The command is built from the preview'}">Copy archive all</button></div>
        ${body}
      </div></article>`;
    };
    const renderArchiveAll = () => {
      const root = document.querySelector('#archive-all');
      if (!root || !state.data) return;
      const focus = document.activeElement && root.contains(document.activeElement) ? document.activeElement.dataset.focus : '';
      root.innerHTML = archiveAllView(state.data);
      if (focus) root.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus();
    };
    const runArchiveAllPreview = async () => {
      const session = cleanupSession();
      if (!session || state.archiveAll.loading) return;
      state.archiveAll = { ...freshArchiveAll(), loading: true };
      renderArchiveAll();
      try {
        const result = await api.run('archive-all-preview', { session });
        state.archiveAll = { ...freshArchiveAll(), result, snapshotAt: state.data?.generated_at || '' };
      } catch (error) { state.archiveAll = { ...freshArchiveAll(), error: error.message }; }
      renderArchiveAll();
    };
    // The identity check is the Restart tab's own `verify` action. The manual identity flow only accepts a pane that
    // check found unverified, so the check runs first and each skipped pane then gets what it needs: nothing to type
    // for a verified pane (apply registers it), an id form for an ambiguous or unresolved one.
    let archiveCheckTimer = null;
    const checkArchiveIdentities = async session => {
      const aa = state.archiveAll;
      if (aa.checking[session]) return;
      aa.checkError = '';
      delete aa.applied[session];
      aa.checking[session] = true;
      aa.checkStarted[session] = Date.now();
      clearInterval(archiveCheckTimer);
      archiveCheckTimer = setInterval(renderArchiveAll, 1000);
      renderArchiveAll();
      try { restart.verify[session] = { data: await api.run('verify', { session }) }; }
      catch (error) { restart.verify[session] = { error: error.message }; aa.checkError = error.message; }
      aa.checking[session] = false;
      if (!Object.values(aa.checking).some(Boolean)) clearInterval(archiveCheckTimer);
      renderArchiveAll();
    };
    const openArchiveManual = (session, pane, client) => {
      const key = manualKey(session, pane);
      const existing = restart.manual[key];
      restart.manual[key] = existing?.open ? { ...existing, open: false }
        : { ...(existing || {}), open: true, client: client === 'codex' ? 'codex' : 'claude', draft: existing?.draft || '' };
      renderArchiveAll();
    };
    const applyFromArchiveAll = async () => {
      const aa = state.archiveAll;
      const session = aa.applyConfirm;
      if (!session || aa.applying) return;
      aa.applying = true;
      renderArchiveAll();
      try {
        aa.applied[session] = await api.run('verify-apply', { session, confirm: `apply:${session}` });
        showToast(`Applied verified identities for ${session}`);
      } catch (error) { aa.applied[session] = { error: error.message }; }
      aa.applying = false;
      aa.applyConfirm = '';
      renderArchiveAll();
    };
    const archiveAllRoot = document.querySelector('#archive-all');
    archiveAllRoot.addEventListener('click', event => {
      const copyButton = event.target.closest('[data-aa-copy]');
      if (copyButton) { if (copyButton.dataset.aaCopy) copy(copyButton.dataset.aaCopy); return; }
      const target = event.target.closest('[data-aa]');
      if (target?.dataset.aa === 'preview') runArchiveAllPreview();
      else if (target?.dataset.aa === 'check') checkArchiveIdentities(target.dataset.session);
      else if (target?.dataset.aa === 'apply-ask') { state.archiveAll.applyConfirm = target.dataset.session; renderArchiveAll(); }
      else if (target?.dataset.aa === 'apply-confirm') applyFromArchiveAll();
      else if (target?.dataset.aa === 'apply-cancel') { state.archiveAll.applyConfirm = ''; renderArchiveAll(); }
      else if (target?.dataset.aa === 'manual') openArchiveManual(target.dataset.session, target.dataset.pane, target.dataset.client);
      else if (event.target.closest('[data-action="manual-cancel"]')) { delete restart.manual[event.target.closest('[data-action="manual-cancel"]').dataset.key]; rerenderManual(); }
    });
    archiveAllRoot.addEventListener('submit', event => {
      const form = event.target.closest('[data-manual-form]');
      if (!form) return;
      event.preventDefault();
      saveManualIdentity(form.dataset.manualForm);
    });
    archiveAllRoot.addEventListener('input', event => {
      const key = event.target.dataset?.manualId;
      if (key && restart.manual[key]) restart.manual[key].draft = event.target.value;
    });
    archiveAllRoot.addEventListener('change', event => {
      const clientKey = event.target.dataset?.manualClient;
      if (clientKey && restart.manual[clientKey]) { restart.manual[clientKey].client = event.target.value; rerenderManual(); return; }
      if (event.target.dataset?.action === 'manual-override' && restart.manual[event.target.dataset.key]) { restart.manual[event.target.dataset.key].override = event.target.checked; rerenderManual(); }
    });
    archiveAllRoot.addEventListener('toggle', event => {
      if (event.target.dataset?.fold === 'aa-ready') state.archiveAll.readyOpen = event.target.open;
    }, true);

    // ---- Archive group (its own tab) ----
    // A session has one group. It holds only workspaces that are still archived: a restored workspace leaves it.
    // Restore all acts only on members still archived and is copy-only.
    const BATCH_ID_PATTERN = /^batch-[0-9]{8}-[0-9]{6}(-[0-9]+)?$/;
    const MEMBER_STATUS = { archived: ['archived', ''], restored: ['restored', 'good'], resumed: ['restored', 'good'], restore_partial: ['restore partial', 'warn'], deleted: ['deleted', ''], close_failed: ['close failed', 'bad'], prepared: ['not closed', 'bad'] };
    const SKIP_SHORT = { active_agent: 'working agent', unverified_agent_session: 'no verified session id', capture_failed: 'could not be captured', workspace_gone: 'gone before it was archived', workspace_changed: 'changed during the run' };
    state.batchOpen = {};
    const batchTitle = batch => (SESSION_NAME_PATTERN.test(batch.herdr_session || '') ? `Archive group · ${batch.herdr_session}` : 'Archive group');
    const batchUpdated = batch => {
      const when = batch.updated_at || batch.completed_at || batch.created_at;
      const date = when ? new Date(when) : null;
      return date && !Number.isNaN(date.getTime()) ? date.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
    };
    const ARCHIVE_ID_PATTERN = /^[0-9]{8}-[0-9]{6}-[a-z0-9][a-z0-9-]*$/;
    // The command for one member: the single-archive restore, with the session the group was captured from.
    const memberRestoreCommand = (member, session) => (ARCHIVE_ID_PATTERN.test(member.archive_id || '')
      ? `herdr-organizer${session} restore --archive ${member.archive_id} --resume-agents --execute --confirm ${member.archive_id}` : '');
    // A layout-only restore leaves the archive archived and an open workspace behind. It counts only while that workspace is still listed.
    const hasOpenLayout = (member, liveIds) => member.status === 'archived' && Boolean(member.layout_workspace_id) && liveIds.has(member.layout_workspace_id);
    // The tabs an archived workspace holds, by name, so the group shows what each workspace stores.
    // The open workspaces a single archived tab can be resumed into: only those of the session the group belongs to.
    const groupDestinations = (batch, data) => (SESSION_NAME_PATTERN.test(batch.herdr_session || '') && batch.herdr_session === data.herdr_session ? (data.workspaces || []) : []);
    const groupTabDestination = (batch, destinations) => {
      if (!destinations.some(workspace => workspace.id === state.groupTabDestinations[batch.batch_id])) state.groupTabDestinations[batch.batch_id] = destinations[0]?.id || '';
      return state.groupTabDestinations[batch.batch_id];
    };
    // The command for one tab: the single-tab restore into an open workspace, with the session the group was captured from.
    const memberTabCommand = (member, tab, session, destination) => (member.status === 'archived' && destination && ARCHIVE_ID_PATTERN.test(member.archive_id || '') && TAB_ID_PATTERN.test(tab.id || '') && WORKSPACE_ID_PATTERN.test(destination) && !(tab.unresumable_agent_count > 0)
      ? `herdr-organizer${session} restore-tab --archive ${member.archive_id} --tab ${tab.id} --to-workspace ${destination} --execute --confirm ${member.archive_id}` : '');
    // The tabs an archived workspace holds, by name, so the group shows what each workspace stores. A still-archived
    // workspace also offers to resume just one of its tabs into an open workspace; the tab stays in the archive.
    const memberTabsView = (member, session, destination) => {
      const tabs = (member.tabs || []).filter(tab => tab && typeof tab.label === 'string' && tab.label);
      if (!tabs.length) return '';
      const offer = member.status === 'archived';
      const button = tab => {
        if (!offer) return '';
        const command = memberTabCommand(member, tab, session, destination);
        const why = !destination ? 'No open workspace to resume into. Refresh the snapshot, or open the workspace first.'
          : tab.unresumable_agent_count > 0 ? 'This tab has an agent session that is not verified, so it cannot be resumed from here. Register it first.'
          : !TAB_ID_PATTERN.test(tab.id || '') ? 'This tab has an unexpected id, so no command is built.' : '';
        return `<button type="button" class="tab-resume" ${command ? `data-command="${escapeHtml(command)}"` : 'disabled'} title="${escapeHtml(command ? 'Copies a command that rebuilds only this tab in the chosen workspace and resumes its verified agents. The tab then leaves the archive; the rest of the archived workspace stays. When its last tab leaves, the archived workspace leaves the group.' : why)}">Copy resume tab</button>`;
      };
      return `<div class="member-tabs" aria-label="Tabs in ${escapeHtml(member.workspace_label || member.archive_id)}">${tabs.map(tab => `<span class="member-tab" title="${escapeHtml(tab.id || '')}">${escapeHtml(tab.label)}<span class="tab-panes">${plural(Number(tab.pane_count) || 0, 'pane')}</span>${button(tab)}</span>`).join('')}</div>`;
    };
    const batchMemberView = (member, session, liveIds, destination) => {
      const [label, tone] = MEMBER_STATUS[member.status] || [member.status || 'unknown', ''];
      const restoreCommand = member.status === 'archived' ? memberRestoreCommand(member, session) : '';
      const openLayout = hasOpenLayout(member, liveIds);
      const flag = member.status === 'restore_partial' ? '<span class="member-flag">Restore stopped part-way. Restore all leaves it alone. Check it in the archive list below.</span>'
        : (member.status === 'close_failed' || member.status === 'prepared') ? '<span class="member-flag">Closing was not confirmed. Restore all leaves it alone. For tabs added to a group, finish-tab-add finishes it.</span>' : '';
      return `<div class="member-line"><span class="pane-id">${escapeHtml(member.workspace_id || '')}</span><span class="names">${escapeHtml(member.workspace_label || member.archive_id)}</span><span class="member-state"><span class="pill ${tone}">${escapeHtml(label)}</span>${openLayout ? `<span class="pill" title="A layout-only restore left workspace ${escapeHtml(member.layout_workspace_id)} open. The archive is not marked restored.">layout open</span>` : ''}${restoreCommand ? `<button type="button" class="small-btn" data-command="${escapeHtml(restoreCommand)}" title="${openLayout ? 'Copies a command that resumes this workspace\'s agents in the layout copy that is already open, then marks it restored. Other members of the group are not touched.' : 'Copies a command that restores only this workspace as fresh shells and resumes its verified agents. Other members of the group are not touched.'}">Copy restore + resume agents</button>` : ''}</span>${flag}</div>${memberTabsView(member, session, destination)}`;
    };
    const batchView = (batch, liveIds) => {
      const counts = batch.counts || {};
      const id = batch.batch_id;
      const valid = BATCH_ID_PATTERN.test(id);
      const session = SESSION_NAME_PATTERN.test(batch.herdr_session || '') ? ` --session ${batch.herdr_session}` : '';
      const base = `herdr-organizer${session} restore-batch --batch ${id}`;
      const resume = `${base} --resume-agents --execute --confirm ${id}`;
      const layout = `${base} --execute --confirm ${id}`;
      const remove = `herdr-organizer delete-batch --batch ${id} --execute --confirm ${id}`;
      const removeAll = `herdr-organizer delete-batch --batch ${id} --archives --execute --confirm delete-archives:${id}`;
      const removable = (batch.members || []).filter(member => member.status !== 'deleted').length;
      const canRestore = valid && counts.archived > 0;
      const archivedMembers = (batch.members || []).filter(member => member.status === 'archived');
      const layoutOpen = archivedMembers.filter(member => hasOpenLayout(member, liveIds)).length;
      const canLayout = canRestore && layoutOpen < archivedMembers.length;
      const why = !valid ? 'This group has an unexpected id, so no command is built' : 'No member is still archived';
      const parts = [[counts.archived, 'archived'], [layoutOpen, 'layout open'], [counts.restore_partial, 'restore partial'], [counts.other, 'not closed'], [counts.skipped, 'skipped at last capture']]
        .filter(([count]) => count > 0).map(([count, label]) => `${count} ${label}`);
      const summaryLabel = batch.empty ? 'nothing archived' : (counts.archived ? `${counts.archived} to restore` : 'nothing to restore');
      const skipped = (batch.skipped || []).map(item => `<div class="member-line"><span class="pane-id">${escapeHtml(item.workspace_id || '')}</span><span class="names">${escapeHtml(item.label || '')}</span><span class="tab-meta" style="margin:0 0 0 auto">${escapeHtml((item.reasons || []).map(reason => SKIP_SHORT[reason] || reason.replace(/_/g, ' ')).join(', '))}</span></div>`).join('');
      const open = key => (state.batchOpen[`${id}:${key}`] ? ' open' : '');
      // Resuming one tab needs an open workspace to rebuild it in. Only workspaces of this group's own session qualify.
      const tabDestinations = groupDestinations(batch, state.data);
      const tabDestination = groupTabDestination(batch, tabDestinations);
      const offersTabs = archivedMembers.some(member => (member.tabs || []).length);
      const destinationPicker = offersTabs ? `<div class="group-destination"><label for="group-dest-${escapeHtml(id)}">Resume a single tab into</label><select class="select" id="group-dest-${escapeHtml(id)}" data-group-destination="${escapeHtml(id)}" ${tabDestinations.length ? '' : 'disabled'}>${tabDestinations.length ? tabDestinations.map(workspace => `<option value="${escapeHtml(workspace.id)}" ${workspace.id === tabDestination ? 'selected' : ''}>${escapeHtml(workspace.label)} (${escapeHtml(workspace.id)})</option>`).join('') : '<option value="">No open workspace in this session</option>'}</select></div>` : '';
      return `<article class="archive batch">
        <div class="archive-line"><div><div class="archive-name">${escapeHtml(batchTitle(batch))}</div><div class="archive-meta">${escapeHtml(id)}${batchUpdated(batch) ? ` · updated ${escapeHtml(batchUpdated(batch))}` : ''}${batch.status && batch.status !== 'completed' ? ` · last run ${escapeHtml(String(batch.status).replace(/_/g, ' '))}` : ''}</div></div><span class="archive-state">${escapeHtml(summaryLabel)}</span></div>
        <div class="batch-counts">${escapeHtml(parts.join(' · ') || 'No members')}</div>
        ${batch.empty ? '<div class="archive-meta" style="margin-top:8px">No workspace is archived in this group. A workspace leaves the group when it is restored, and Archive all or adding tabs puts workspaces back in.</div>' : ''}
        <div class="archive-actions">
          <button class="primary" type="button" ${canRestore ? `data-command="${escapeHtml(resume)}"` : 'disabled'} title="${canRestore ? 'Copies one command that restores every member still archived and resumes their verified agents. A member whose layout copy is still open is resumed there, not duplicated. Members already restored are skipped.' : why}">Copy restore all + resume agents</button>
          <button type="button" ${canLayout ? `data-command="${escapeHtml(layout)}"` : 'disabled'} title="${canLayout ? 'Copies one command that rebuilds the layout of every archived member that has no open copy, as fresh shells. Nothing is marked restored and every restore command stays.' : (canRestore ? 'Every archived member already has its layout open' : why)}">Copy restore all (layout only)</button>
          ${valid && !removable ? `<button class="danger" type="button" data-command="${escapeHtml(remove)}" title="Removes this empty group record. The next Archive all starts the group again.">Copy delete group</button>` : ''}
          ${valid && removable ? `<button class="danger" type="button" data-command="${escapeHtml(removeAll)}" title="Permanently deletes this group and its ${plural(removable, 'archive')}.${counts.archived ? ` ${counts.archived} still ${counts.archived === 1 ? 'is' : 'are'} archived, so their saved layouts and agent identities would be lost.` : ''} No live or restored workspace is changed.">Copy delete group + ${plural(removable, 'archive')}</button><button type="button" data-command="${escapeHtml(remove)}" title="Removes this group record only. Its archives stay as single archives.">Copy delete group record only</button>` : ''}
        </div>
        ${valid && removable ? `<div class="archive-meta" style="margin-top:8px;color:#a9273b">Delete group + ${plural(removable, 'archive')} is permanent.${counts.archived ? ` ${plural(counts.archived, 'member')} ${counts.archived === 1 ? 'is' : 'are'} still archived, so ${counts.archived === 1 ? 'its' : 'their'} saved layout and agent identity would be lost.` : ''} Delete group record only keeps the archives.</div>` : ''}
        <details class="fold" data-batch-fold="${escapeHtml(id)}:members"${open('members')} style="margin-top:12px"><summary><span class="group-title">Archived workspaces <span class="count-pill">${batch.member_count || 0}</span></span></summary>${destinationPicker}${(batch.members || []).map(member => batchMemberView(member, session, liveIds, tabDestination)).join('') || '<div class="tab-meta">No archived workspaces</div>'}</details>
        ${skipped ? `<details class="fold" data-batch-fold="${escapeHtml(id)}:skipped"${open('skipped')}><summary><span class="group-title">Skipped at last capture <span class="count-pill">${batch.skipped.length}</span></span></summary>${skipped}</details>` : ''}
      </article>`;
    };
    const batchesView = data => {
      const all = data.batches || [];
      const list = all.filter(batch => matches(`${batch.batch_id} ${batch.herdr_session || ''} ${(batch.members || []).map(member => `${member.workspace_label} ${member.archive_id} ${member.status} ${(member.tabs || []).map(tab => tab.label).join(' ')}`).join(' ')}`));
      const liveIds = new Set((data.workspaces || []).map(workspace => workspace.id));
      const body = list.length ? `<div class="archives">${list.map(batch => batchView(batch, liveIds)).join('')}</div>`
        : `<div class="empty" style="min-height:90px">${all.length ? 'The archive group does not match this filter.' : 'No archive group yet. Preview Archive all on the Workspaces tab to start this session\'s group.'}</div>`;
      return `<div class="section-heading" style="margin-top:0"><h2>Archive group</h2><span class="updated">One group per session, holding only workspaces that are still archived</span></div>${body}<div style="height:26px"></div>`;
    };
    document.querySelector('#batches').addEventListener('toggle', event => {
      const key = event.target.dataset?.batchFold;
      if (key) state.batchOpen[key] = event.target.open;
    }, true);

    // ---- Context view: how full each agent session's context window is ----
    // Read-only. Restarting a session stays manual; this only says which tab is due.
    const context = { loading: false, data: null, error: '', at: null };
    const contextAge = seconds => seconds === null || seconds === undefined ? 'no record' : seconds < 90 ? 'just now' : seconds < 5400 ? `${Math.round(seconds / 60)} min ago` : seconds < 172800 ? `${Math.round(seconds / 3600)} h ago` : `${Math.round(seconds / 86400)} d ago`;
    const contextRow = (row, thresholds) => {
      const level = row.percent === null || !row.pane_id ? '' : row.percent >= thresholds.high ? 'bad' : row.percent >= thresholds.warn ? 'warn' : 'good';
      const percent = row.percent === null ? '<span class="pill">no percent yet</span>' : `<span class="pill ${level}">${row.estimated ? '~' : ''}${row.percent}%</span>`;
      const where = row.pane_id ? `${escapeHtml(row.herdr_session)} · ${escapeHtml(row.pane_id)}${row.title ? ` · ${escapeHtml(row.title)}` : ''}` : '<span class="tab-meta">no live pane</span>';
      const tokens = row.tokens === null ? 'unknown' : `${Math.round(row.tokens / 1000)}k`;
      return `<tr class="ctx-row ${level}"><td>${percent}</td><td><strong>${escapeHtml(row.map)}</strong><div class="tab-meta">${escapeHtml(row.kind)} · ${escapeHtml(row.id)}</div></td><td>${where}</td><td>${tokens}</td><td>${escapeHtml(row.busy)}</td><td>${escapeHtml(contextAge(row.age_s))}</td></tr>`;
    };
    const renderContext = () => {
      const section = document.querySelector('#context-section');
      const head = `<div class="section-heading"><h2>Context window</h2><span class="ctx-tools"><span class="updated">${context.at ? `read ${escapeHtml(context.at)}` : 'not read yet'}</span><button id="context-reload" type="button" ${context.loading ? 'disabled' : ''}>${context.loading ? 'Reading…' : 'Refresh'}</button></span></div>`;
      let body;
      if (context.error) body = `<div class="scope-note error">${escapeHtml(context.error)}</div>`;
      else if (!context.data) body = '<div class="skeleton"></div><div class="skeleton"></div>';
      else {
        const { rows, thresholds } = context.data;
        const due = rows.filter(row => row.pane_id && row.percent !== null && row.percent >= thresholds.warn).length;
        body = rows.length ? `<article class="card"><div class="card-head"><h3>Sessions by context used</h3><span class="pill ${due ? 'warn' : 'good'}">${due ? `${plural(due, 'session')} over ${thresholds.warn}%` : `none over ${thresholds.warn}%`}</span></div><div class="card-body"><table class="ctx-table"><thead><tr><th>Used</th><th>Session</th><th>Where</th><th>Tokens</th><th>State</th><th>Record</th></tr></thead><tbody>${rows.map(row => contextRow(row, thresholds)).join('')}</tbody></table><div class="tab-meta" style="margin-top:12px">Amber from ${thresholds.warn}%, red from ${thresholds.high}%. A ~ means estimated from the transcript; a row with no live pane is a finished or closed session and is not counted; it becomes exact after the session restarts onto the gauge. Restart an idle session; leave a busy one. Nothing here restarts anything.</div></div></article>` : '<div class="empty">No gauge records yet.</div>';
      }
      section.innerHTML = head + body;
      document.querySelector('#context-reload').addEventListener('click', loadContext);
    };
    const loadContext = async () => {
      if (context.loading) return;
      context.loading = true; context.error = '';
      renderContext();
      try {
        context.data = await api.run('context-gauge');
        context.at = new Date().toLocaleTimeString();
      } catch (error) {
        context.error = error.message;
      } finally {
        context.loading = false;
        if (state.view === 'context') renderContext();
      }
    };

    // ---- Snapshot-backed views (Workspaces and Archives) ----
    const syncSnapshotSelect = () => {
      const select = document.querySelector('#snapshot-session');
      const names = (restart.sessions || []).filter(session => session.selectable).map(session => session.name);
      if (!names.includes(state.snapshotSession)) state.snapshotSession = names.includes(state.data?.herdr_session) ? state.data.herdr_session : (names[0] || '');
      select.innerHTML = names.length ? names.map(name => `<option value="${escapeHtml(name)}" ${name === state.snapshotSession ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('') : '<option value="">No running session</option>';
      select.disabled = !names.length;
    };
    const load = async () => {
      // The snapshot only comes through the server, which refuses one that carries a private value.
      // There is deliberately no fallback to the raw file.
      try {
        state.data = await api.run('snapshot-data'); render();
      } catch (error) {
        state.data = { workspaces: [], archives: [] }; render();
        document.querySelector('#workspaces').innerHTML = `<div class="empty">${escapeHtml(error.message)} The viewer never changes Herdr itself.</div>`;
        document.querySelector('#updated').textContent = 'Snapshot unavailable';
      }
    };
    const refreshSnapshot = async () => {
      const button = document.querySelector('#reload');
      button.disabled = true;
      button.textContent = 'Refreshing…';
      try {
        if (!restart.sessions) await loadSessions();
        syncSnapshotSelect();
        if (state.snapshotSession) await api.run('snapshot', { session: state.snapshotSession });
        else {
          const response = await fetch('/api/herdr-workspace-organizer/snapshot', { method: 'POST' });
          const result = await response.json();
          if (!response.ok || result.status !== 'ok') throw new Error(result.message || `HTTP ${response.status}`);
        }
        await load();
        showToast('Live snapshot refreshed');
      } catch (error) {
        await load();
        showToast(`Could not refresh live snapshot: ${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = 'Refresh snapshot';
      }
    };
    document.querySelector('#search').addEventListener('input', event => { state.query = event.target.value.trim().toLowerCase(); render(); });
    document.querySelector('#reload').addEventListener('click', refreshSnapshot);
    document.querySelector('#snapshot-session').addEventListener('change', event => { state.snapshotSession = event.target.value; refreshSnapshot(); });
    let snapshotRequested = false;
    document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
      state.view = button.dataset.view;
      render();
      if (state.view === 'context') { if (!context.data && !context.loading) loadContext(); return; }
      if (state.view !== 'restart') {
        syncSnapshotSelect();
        if (!snapshotRequested) { snapshotRequested = true; refreshSnapshot(); }
      }
    }));
    (async () => { await loadSessions(); loadBundles(); load(); })();
  </script>
</body>
</html>
