<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdr Workspace Organizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2234;
      --muted: #69758a;
      --line: #dce2ec;
      --wash: #f4f6fb;
      --paper: #ffffff;
      --navy: #202f54;
      --purple: #6f55d9;
      --mint: #35b99a;
      --amber: #e99b2e;
      --red: #cd5164;
      --shadow: 0 10px 28px rgba(33, 47, 83, .08);
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--wash); font-family: "DM Sans", system-ui, sans-serif; }
    button, input { font: inherit; }
    .topbar { position: sticky; top: 0; z-index: 3; padding: 18px max(24px, calc((100vw - 1240px) / 2)); background: rgba(244,246,251,.92); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(220,226,236,.8); }
    .topline, .controls, .view-tabs, .section-heading, .workspace-head, .tab-line, .archive-line, .empty { display: flex; align-items: center; }
    .topline { justify-content: space-between; gap: 20px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 22px; letter-spacing: -.04em; color: var(--navy); }
    .subtitle { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .badge { padding: 5px 9px; border-radius: 999px; background: #e7e2fb; color: #514194; font: 500 11px "DM Mono", monospace; text-transform: uppercase; letter-spacing: .04em; }
    .controls { margin-top: 16px; gap: 10px; }
    .view-tabs { gap: 5px; margin-top: 12px; }
    .view-tab { padding: 7px 10px; color: var(--muted); background: transparent; font-size: 12px; }
    .view-tab[aria-selected="true"] { color: #514194; background: #e7e2fb; }
    .search { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--paper); outline-color: var(--purple); }
    button { cursor: pointer; border: 0; border-radius: 7px; padding: 10px 12px; color: var(--navy); background: #e7ebf4; font-weight: 600; font-size: 12px; }
    button:hover { background: #dce2ed; }
    button:focus-visible, input:focus-visible { outline: 3px solid #bcb1ed; outline-offset: 2px; }
    main { max-width: 1240px; margin: 0 auto; padding: 26px 24px 60px; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 30px; }
    .move-panel { position: fixed; right: 24px; bottom: 22px; z-index: 4; display: grid; grid-template-columns: minmax(220px, 1fr) 190px auto; align-items: end; gap: 11px; width: min(720px, calc(100vw - 48px)); padding: 15px 16px; border: 1px solid #cfd7e7; border-radius: 10px; background: rgba(255,255,255,.96); backdrop-filter: blur(14px); box-shadow: 0 14px 34px rgba(33, 47, 83, .18); }
    .move-panel:empty { display: none; }
    .move-panel strong { display: block; font-size: 14px; }
    .move-panel p { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .move-panel label { display: block; color: var(--muted); font: 11px "DM Mono", monospace; }
    .move-panel select { width: 100%; margin-top: 6px; padding: 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: var(--paper); }
    .move-panel .primary { color: white; background: var(--purple); }
    .move-panel .primary:disabled { cursor: not-allowed; opacity: .45; }
    .metric { min-height: 100px; padding: 17px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .metric span { color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 10px; color: var(--navy); font-size: 29px; letter-spacing: -.05em; }
    .section-heading { justify-content: space-between; margin: 28px 0 12px; }
    h2 { font-size: 15px; letter-spacing: -.01em; }
    .updated { color: var(--muted); font: 11px "DM Mono", monospace; }
    .workspaces { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
    .workspace, .archive { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
    .workspace-head { justify-content: space-between; padding: 15px 16px; background: linear-gradient(110deg, #fbfcff, #f1effc); border-bottom: 1px solid var(--line); }
    .workspace-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .workspace-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .id { color: var(--muted); font: 11px "DM Mono", monospace; }
    .counts { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .tabs { padding: 8px; }
    .tab { padding: 10px 8px; border-bottom: 1px solid #eef1f6; }
    .tab:last-child { border-bottom: 0; }
    .tab-line { justify-content: space-between; gap: 8px; }
    .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: 13px; }
    .tab-meta, .archive-meta { margin-top: 4px; color: var(--muted); font: 11px "DM Mono", monospace; }
    .tab-actions { display: flex; gap: 5px; margin-top: 8px; }
    .tab-actions button, .archive button { padding: 6px 8px; font-size: 11px; }
    .status { display: inline-block; padding: 2px 5px; margin-left: 4px; border-radius: 4px; color: #506079; background: #edf0f5; font: 10px "DM Mono", monospace; }
    .status.working, .status.blocked { color: #925a08; background: #fff0d9; }
    .status.idle { color: #27806b; background: #dcf5ee; }
    .status.resumable { color: #27806b; background: #dcf5ee; }
    .status.needs-registration { color: #a9273b; background: #ffe6ea; }
    .focused { color: var(--purple); font: 10px "DM Mono", monospace; text-transform: uppercase; }
    .tab-select { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 11px; cursor: pointer; }
    .tab-select input { margin: 0; accent-color: var(--purple); }
    .archives { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
    .archive { padding: 14px 15px; }
    .archive-line { justify-content: space-between; gap: 10px; }
    .archive-name { font-weight: 700; font-size: 13px; }
    .archive-state { color: #514194; background: #e9e5fc; border-radius: 999px; padding: 4px 7px; font: 10px "DM Mono", monospace; white-space: nowrap; }
    .archive-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .archive-actions button.primary { color: white; background: var(--purple); }
    .archive-actions button.primary:hover { background: #5a43ba; }
    .archive-actions button.danger, .tab-actions button.danger { color: #a9273b; background: #ffe6ea; }
    .archive-actions button.danger:hover, .tab-actions button.danger:hover { background: #ffd7dd; }
    .empty { min-height: 140px; justify-content: center; padding: 20px; color: var(--muted); text-align: center; background: var(--paper); border: 1px dashed #cbd3e0; border-radius: 10px; }
    .toast { position: fixed; right: 24px; bottom: 22px; z-index: 5; padding: 10px 13px; color: white; background: var(--navy); border-radius: 7px; box-shadow: var(--shadow); font-size: 12px; transform: translateY(80px); opacity: 0; transition: .2s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 640px) { .summary, .move-panel { grid-template-columns: 1fr; } .move-panel { right: 16px; bottom: 16px; width: calc(100vw - 32px); } .topline { align-items: flex-start; } .badge { margin-top: 4px; } main { padding-inline: 16px; } .topbar { padding-inline: 16px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <div><h1>Workspace organizer</h1><p class="subtitle">Review Herdr tabs, then copy a command to run in your terminal</p></div>
      <span class="badge">live snapshot</span>
    </div>
    <div class="controls">
      <input id="search" class="search" type="search" placeholder="Filter workspaces, tabs, or archives" aria-label="Filter organizer data">
      <button id="reload" type="button">Refresh snapshot</button>
    </div>
    <nav class="view-tabs" aria-label="Organizer views">
      <button class="view-tab" type="button" data-view="workspaces" aria-selected="true">Workspaces</button>
      <button class="view-tab" type="button" data-view="archives" aria-selected="false">Archives</button>
    </nav>
  </header>
  <main>
    <section class="move-panel" id="move-panel" aria-live="polite"></section>
    <section id="workspaces-section">
      <section class="summary" id="summary"></section>
      <div class="section-heading"><h2>Live workspaces</h2><span class="updated" id="updated">No snapshot loaded</span></div>
      <div class="workspaces" id="workspaces"></div>
    </section>
    <section id="archives-section" hidden>
      <div class="section-heading"><h2>Archives</h2><span class="updated">Layouts and resumable identities only</span></div>
      <div class="archives" id="archives"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const DATA_URL = '../personal/01-System/setup/herdr/state/workspace-organizer/live-snapshot.json';
    const state = { data: null, query: '', selectedTabs: new Set(), selectedArchivedTabs: new Set(), destinationWorkspace: '', archiveDestinations: {}, view: 'workspaces' };
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    const searchText = value => String(value ?? '').toLowerCase();
    const matches = value => !state.query || searchText(value).includes(state.query);
    const copy = async text => {
      try { await navigator.clipboard.writeText(text); showToast('Command copied'); }
      catch { showToast(`Copy this command: ${text}`); }
    };
    let toastTimer;
    const showToast = message => { const toast = document.querySelector('#toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2600); };
    const tabStatuses = statuses => Object.entries(statuses || {}).map(([name, count]) => `<span class="status ${escapeHtml(name)}">${escapeHtml(name)} ${count}</span>`).join('');
    const resumeStatuses = agents => (agents || []).map(agent => {
      const resumable = agent.status === 'resumable';
      const label = resumable ? `${agent.client} resumable` : `${agent.client} needs registration`;
      const detail = resumable
        ? `${agent.pane_id}: verified from ${agent.source}`
        : `${agent.pane_id}: no verified resumable session. Archive and move will stop until it is registered.`;
      return `<span class="status ${resumable ? 'resumable' : 'needs-registration'}" title="${escapeHtml(detail)}">${escapeHtml(label)}</span>`;
    }).join('');
    const tabView = (tab, total) => {
      const before = Math.max(0, Number(tab.index) - 1);
      const after = Math.min(total - 1, Number(tab.index) + 1);
      return `<article class="tab">
        <div class="tab-line"><span class="tab-name">${escapeHtml(tab.label)}</span>${tab.focused ? '<span class="focused">focused</span>' : ''}</div>
        <div class="tab-meta">${escapeHtml(tab.id)} · ${tab.pane_count} pane${tab.pane_count === 1 ? '' : 's'}${tabStatuses(tab.agent_statuses)}${resumeStatuses(tab.agent_resume)}</div>
        <label class="tab-select"><input type="checkbox" data-select-tab="${escapeHtml(tab.id)}" ${state.selectedTabs.has(tab.id) ? 'checked' : ''}> Select this tab for a cross-workspace move</label>
        <div class="tab-actions">
          <button type="button" title="Copy a command that places this tab one position closer to the first tab in this workspace" data-command="herdr-organizer reorder-tab --tab ${escapeHtml(tab.id)} --index ${before} --execute">Copy move tab left</button>
          <button type="button" title="Copy a command that places this tab one position closer to the last tab in this workspace" data-command="herdr-organizer reorder-tab --tab ${escapeHtml(tab.id)} --index ${after} --execute">Copy move tab right</button>
        </div>
      </article>`;
    };
    const workspaceView = workspace => `<article class="workspace">
      <div class="workspace-head"><div class="workspace-title"><strong>${escapeHtml(workspace.label)}</strong>${workspace.focused ? '<span class="focused">focused</span>' : ''}</div><span class="counts">${workspace.tab_count} tabs · ${workspace.pane_count} panes</span></div>
      <div class="tabs">${workspace.tabs.map(tab => tabView(tab, workspace.tab_count)).join('') || '<div class="tab-meta">No tabs</div>'}</div>
      <div class="tab-actions" style="padding: 0 16px 14px"><button type="button" title="Copies a preview command. It only identifies shell-only tabs and protects tabs with running agents or verified resumable sessions." data-command="herdr-organizer cleanup-empty-tabs --workspace ${escapeHtml(workspace.id)}">Copy cleanup preview</button><button type="button" data-command="herdr-organizer archive --workspace ${escapeHtml(workspace.id)}">Copy archive preview</button><button type="button" title="Copies a command that captures this layout and closes this workspace. Its processes will stop." data-command="herdr-organizer archive --workspace ${escapeHtml(workspace.id)} --execute --confirm ${escapeHtml(workspace.id)}">Copy archive and close</button></div>
    </article>`;
    const movePanelView = data => {
      const allTabs = data.workspaces.flatMap(workspace => workspace.tabs.map(tab => ({ ...tab, workspace })));
      const selected = allTabs.filter(tab => state.selectedTabs.has(tab.id));
      if (!selected.length) return '';
      const sourceWorkspaces = new Set(selected.map(tab => tab.workspace.id));
      const destinationChoices = data.workspaces.filter(workspace => !sourceWorkspaces.has(workspace.id));
      if (!destinationChoices.some(workspace => workspace.id === state.destinationWorkspace)) state.destinationWorkspace = destinationChoices[0]?.id || '';
      const command = state.destinationWorkspace
        ? `herdr-organizer move-tabs ${selected.map(tab => `--tab ${tab.id}`).join(' ')} --to-workspace ${state.destinationWorkspace} --execute --confirm ${state.destinationWorkspace}`
        : '';
      const detail = `${selected.length} selected. The command rebuilds their layouts, closes the originals, then resumes any Codex or Claude sessions whose real CLI session can be identified before the move.`;
      return `<div><strong>Move selected tabs to another workspace</strong><p>${escapeHtml(detail)}</p></div>
        <label>Destination workspace<select id="move-destination" ${destinationChoices.length ? '' : 'disabled'}><option value="">Choose destination</option>${destinationChoices.map(workspace => `<option value="${escapeHtml(workspace.id)}" ${workspace.id === state.destinationWorkspace ? 'selected' : ''}>${escapeHtml(workspace.label)} (${escapeHtml(workspace.id)})</option>`).join('')}</select></label>
        <button class="primary" type="button" id="copy-move-tabs" ${command ? '' : 'disabled'} data-command="${escapeHtml(command)}">Copy move + resume</button>`;
    };
    const archiveTabKey = (archiveId, tabId) => `${archiveId}::${tabId}`;
    const restorePanelView = data => {
      const selected = data.archives.flatMap(archive => (archive.tabs || []).map(tab => ({ archive, tab }))).filter(({ archive, tab }) => state.selectedArchivedTabs.has(archiveTabKey(archive.archive_id, tab.id)));
      if (!selected.length) return '';
      const archiveIds = new Set(selected.map(({ archive }) => archive.archive_id));
      if (archiveIds.size !== 1) return '<div><strong>Restore selected archived tabs</strong><p>Select tabs from one archive at a time.</p></div><button type="button" disabled>Choose one archive</button>';
      const archiveId = selected[0].archive.archive_id;
      const destinations = data.workspaces || [];
      if (!destinations.some(workspace => workspace.id === state.archiveDestinations[archiveId])) state.archiveDestinations[archiveId] = destinations[0]?.id || '';
      const destination = state.archiveDestinations[archiveId];
      const unavailable = selected.filter(({ tab }) => tab.unresumable_agent_count > 0);
      const command = destination && !unavailable.length
        ? `herdr-organizer restore-tabs --archive ${archiveId} ${selected.map(({ tab }) => `--tab ${tab.id}`).join(' ')} --to-workspace ${destination} --execute --confirm ${archiveId}`
        : '';
      const detail = unavailable.length
        ? `${unavailable.length} selected tab${unavailable.length === 1 ? ' has' : 's have'} an unavailable agent session. Register it before restoring.`
        : `${selected.length} selected from this archive. The command rebuilds them in the destination and resumes verified Codex or Claude sessions.`;
      return `<div><strong>Restore selected archived tabs</strong><p>${escapeHtml(detail)}</p></div>
        <label>Destination workspace<select id="restore-destination" ${destinations.length ? '' : 'disabled'}><option value="">Choose destination</option>${destinations.map(workspace => `<option value="${escapeHtml(workspace.id)}" ${workspace.id === destination ? 'selected' : ''}>${escapeHtml(workspace.label)} (${escapeHtml(workspace.id)})</option>`).join('')}</select></label>
        <button class="primary" type="button" ${command ? '' : 'disabled'} data-command="${escapeHtml(command)}">Copy restore + resume</button>`;
    };
    const archivedTabView = (archive, tab) => {
      const key = archiveTabKey(archive.archive_id, tab.id);
      const canDelete = (archive.tabs || []).length > 1;
      const deleteCommand = canDelete ? `herdr-organizer delete-archived-tab --archive ${archive.archive_id} --tab ${tab.id} --execute --confirm ${archive.archive_id}:${tab.id}` : '';
      return `<div class="tab" style="margin: 10px 0">
        <div class="tab-line"><span class="tab-name">${escapeHtml(tab.label)}</span></div>
        <div class="tab-meta">${escapeHtml(tab.id)} · ${tab.pane_count} pane${tab.pane_count === 1 ? '' : 's'} · ${tab.resumable_agent_count} resumable${tab.unresumable_agent_count ? ` · ${tab.unresumable_agent_count} unavailable` : ''}</div>
        <label class="tab-select"><input type="checkbox" data-select-archive-tab="${escapeHtml(key)}" data-archive-id="${escapeHtml(archive.archive_id)}" ${state.selectedArchivedTabs.has(key) ? 'checked' : ''}> Select this tab for restore</label>
        <div class="tab-actions"><button class="danger" type="button" ${deleteCommand ? '' : 'disabled'} title="Permanently removes this tab from the saved archive only. It does not change any active or restored workspace." data-command="${escapeHtml(deleteCommand)}">${canDelete ? 'Copy delete archived tab' : 'Delete archive instead'}</button></div>
      </div>`;
    };
    const archiveView = archive => {
      const restore = `herdr-organizer restore --archive ${archive.archive_id}`;
      const execute = `${restore} --execute --confirm ${archive.archive_id}`;
      const resume = `${restore} --resume-agents --execute --confirm ${archive.archive_id}`;
      const remove = `herdr-organizer delete-archive --archive ${archive.archive_id} --execute --confirm ${archive.archive_id}`;
      return `<article class="archive">
        <div class="archive-line"><div><div class="archive-name">${escapeHtml(archive.workspace_label || archive.archive_id)}</div><div class="archive-meta">${escapeHtml(archive.archive_id)}</div></div><span class="archive-state">${escapeHtml(archive.status || 'unknown')}</span></div>
        <div class="archive-meta">${archive.tab_count} tabs · ${archive.pane_count} panes · ${archive.resumable_pane_count} resumable · ${archive.shell_only_pane_count} unavailable</div>
        <div class="archive-actions"><button type="button" data-command="${escapeHtml(restore)}">Copy restore preview</button><button class="primary" type="button" data-command="${escapeHtml(execute)}">Copy restore layout</button><button type="button" data-command="${escapeHtml(resume)}">Copy restore + resume agents</button><button class="danger" type="button" title="Permanently removes this saved archive only. It does not change any active or restored workspace." data-command="${escapeHtml(remove)}">Copy delete archive</button></div>
        <div class="archive-meta" style="margin-top: 12px">Select one or more archived tabs to restore into an active workspace</div>${(archive.tabs || []).map(tab => archivedTabView(archive, tab)).join('')}
      </article>`;
    };
    const render = () => {
      const data = state.data;
      if (!data) return;
      const workspaces = (data.workspaces || []).filter(workspace => matches(`${workspace.label} ${workspace.id} ${workspace.tabs.map(tab => `${tab.label} ${tab.id}`).join(' ')}`));
      const archives = (data.archives || []).filter(archive => matches(`${archive.workspace_label} ${archive.archive_id} ${archive.status}`));
      const allTabIds = new Set((data.workspaces || []).flatMap(workspace => workspace.tabs.map(tab => tab.id)));
      state.selectedTabs = new Set([...state.selectedTabs].filter(tabId => allTabIds.has(tabId)));
      const archivedTabKeys = new Set((data.archives || []).flatMap(archive => (archive.tabs || []).map(tab => archiveTabKey(archive.archive_id, tab.id))));
      state.selectedArchivedTabs = new Set([...state.selectedArchivedTabs].filter(key => archivedTabKeys.has(key)));
      const paneCount = workspaces.reduce((total, workspace) => total + workspace.pane_count, 0);
      document.querySelector('#summary').innerHTML = [
        ['Visible workspaces', workspaces.length], ['Visible tabs', workspaces.reduce((total, workspace) => total + workspace.tab_count, 0)], ['Visible panes', paneCount]
      ].map(([label, value]) => `<article class="metric"><span>${label}</span><strong>${value}</strong></article>`).join('');
      document.querySelector('#move-panel').innerHTML = state.view === 'archives' ? restorePanelView(data) : movePanelView(data);
      document.querySelector('#workspaces-section').hidden = state.view !== 'workspaces';
      document.querySelector('#archives-section').hidden = state.view !== 'archives';
      document.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-selected', String(button.dataset.view === state.view)));
      document.querySelector('#workspaces').innerHTML = workspaces.length ? workspaces.map(workspaceView).join('') : '<div class="empty">No workspaces match this filter.</div>';
      document.querySelector('#archives').innerHTML = archives.length ? archives.map(archiveView).join('') : '<div class="empty">No archives yet. Preview an archive from a workspace when you are ready to close it.</div>';
      document.querySelectorAll('[data-command]').forEach(button => button.addEventListener('click', () => copy(button.dataset.command)));
      document.querySelectorAll('[data-select-tab]').forEach(input => input.addEventListener('change', event => {
        if (event.target.checked) state.selectedTabs.add(event.target.dataset.selectTab);
        else state.selectedTabs.delete(event.target.dataset.selectTab);
        render();
      }));
      document.querySelectorAll('[data-select-archive-tab]').forEach(input => input.addEventListener('change', event => {
        const key = event.target.dataset.selectArchiveTab;
        const archiveId = event.target.dataset.archiveId;
        if (event.target.checked) {
          const hasAnotherArchive = [...state.selectedArchivedTabs].some(item => !item.startsWith(`${archiveId}::`));
          if (hasAnotherArchive) state.selectedArchivedTabs.clear();
          state.selectedArchivedTabs.add(key);
        } else state.selectedArchivedTabs.delete(key);
        render();
      }));
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => {
        state.view = button.dataset.view;
        render();
      }));
      document.querySelector('#move-destination')?.addEventListener('change', event => {
        state.destinationWorkspace = event.target.value;
        render();
      });
      document.querySelector('#restore-destination')?.addEventListener('change', event => {
        const selectedKey = [...state.selectedArchivedTabs][0];
        const archiveId = selectedKey?.split('::')[0];
        if (archiveId) state.archiveDestinations[archiveId] = event.target.value;
        render();
      });
      document.querySelector('#updated').textContent = data.generated_at ? `Snapshot ${new Date(data.generated_at).toLocaleString()}${data.herdr_session ? ` · ${data.herdr_session}` : ''}` : 'No timestamp';
    };
    const load = async () => {
      try {
        const response = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        state.data = await response.json(); render();
      } catch (error) {
        state.data = { workspaces: [], archives: [] }; render();
        document.querySelector('#workspaces').innerHTML = '<div class="empty">Run <code>herdr-organizer snapshot</code>, then reload this page. The viewer never changes Herdr itself.</div>';
        document.querySelector('#updated').textContent = 'Snapshot unavailable';
      }
    };
    const refreshSnapshot = async () => {
      const button = document.querySelector('#reload');
      button.disabled = true;
      button.textContent = 'Refreshing…';
      try {
        const response = await fetch('/api/herdr-workspace-organizer/snapshot', { method: 'POST' });
        const result = await response.json();
        if (!response.ok || result.status !== 'ok') throw new Error(result.message || `HTTP ${response.status}`);
        await load();
        showToast('Live snapshot refreshed');
      } catch (error) {
        await load();
        showToast(`Could not refresh live snapshot: ${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = 'Refresh snapshot';
      }
    };
    document.querySelector('#search').addEventListener('input', event => { state.query = event.target.value.trim().toLowerCase(); render(); });
    document.querySelector('#reload').addEventListener('click', refreshSnapshot);
    refreshSnapshot();
  </script>
</body>
</html>
